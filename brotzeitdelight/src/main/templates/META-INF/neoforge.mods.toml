modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Farmer's Delight ist Pflicht und wird vor diesem Mod geladen.
[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="required"
    versionRange="${farmers_delight_version_range}"
    ordering="AFTER"
    side="BOTH"
