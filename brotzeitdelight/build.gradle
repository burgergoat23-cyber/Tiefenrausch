plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Ergibt den Dateinamen brotzeitdelight-<Minecraft-Version>-<Mod-Version>.jar
version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets.main.resources {
    // Vom Datengenerator erzeugte Dateien gehören mit in den Mod.
    srcDir('src/generated/resources')

    // Reine Arbeitsdateien bleiben draußen.
    exclude('**/*.bbmodel')
    exclude('.cache')
}

repositories {
    // JUnit und Gson für die einfachen Tests
    mavenCentral()

    // Farmer's Delight kommt aus dem Maven-Verzeichnis von Modrinth.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// Minecraft 1.21.1 liefert Java 21 mit aus, also wird auch für Java 21 gebaut.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Startet einen Server, lässt alle Spieltests laufen und beendet sich wieder.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Datengenerator: schreibt nach src/generated/resources.
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Farmer's Delight: wird zum Übersetzen gebraucht und läuft in der Entwicklungsumgebung mit.
    implementation "maven.modrinth:farmers-delight:${minecraft_version}-${farmers_delight_version}"

    // Einfache Tests ohne Spiel (z. B. Sprachdateien), Aufruf: ./gradlew test
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Setzt die Werte aus gradle.properties in die Vorlage neoforge.mods.toml ein.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range      : minecraft_version_range,
            neo_version_range            : neo_version_range,
            loader_version_range         : loader_version_range,
            farmers_delight_version_range: farmers_delight_version_range,
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_license                  : mod_license,
            mod_version                  : mod_version,
            mod_description              : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
