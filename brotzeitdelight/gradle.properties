# Speicher für Gradle-Befehle.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment: lesbare Parameternamen für den Minecraft-Code (nur für die Entwicklung).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft und NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Version, gegen die gebaut und getestet wird.
neo_version=21.1.265
# Älteste NeoForge-Version, mit der der Mod startet.
neo_version_range=[21.1.265,)
loader_version_range=[1,)

# Farmer's Delight (Pflicht-Abhängigkeit)
farmers_delight_version=1.3.4
farmers_delight_version_range=[1.3.4,)

# Angaben zum Mod
mod_id=brotzeitdelight
mod_name=Brotzeit Delight
mod_license=MIT
mod_version=0.1.0
mod_group_id=de.brotzeitdelight
mod_description=German comfort food for Farmer's Delight: pretzels, bratwurst, schnitzel and a fermenting barrel for sauerkraut.
