[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codebuddy"
version = "1.0.0"
description = "Eigene kostenlose Coding-KI, die lokal mit Ollama läuft"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
farbe = ["pygments"]

[project.scripts]
codebuddy = "codebuddy.cli:main"

[tool.setuptools]
packages = ["codebuddy"]
