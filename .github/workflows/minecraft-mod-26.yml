name: Minecraft-Mod bauen (26.2)

on:
  push:
    paths:
      - 'minecraft-mod-26/**'
      - '!minecraft-mod-26/download/**'
      - '!minecraft-mod-26/test-screenshots/**'
      - '!minecraft-mod-26/dev/*-out.txt'
      - '!minecraft-mod-26/dev/build-errors.txt'
      - '.github/workflows/minecraft-mod-26.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-mod-26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Einmalig - Code von Yarn- auf Mojang-Namen umstellen
        run: |
          if find minecraft-mod-26/src/main/java -name '*.java' | grep -q .; then
            echo "Schon umgestellt"
            exit 0
          fi
          cd minecraft-mod
          chmod +x gradlew
          YARN=$(curl -sf https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.11" -Pyarn_mappings="$YARN" --no-daemon --stacktrace
          ls remappedSrc
          cp -r remappedSrc/. ../minecraft-mod-26/src/main/java/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft-mod-26/src/main/java
          git commit -m "26.2: Code automatisch auf Mojang-Namen umgestellt [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; git rebase --abort 2>/dev/null || true; sleep 5; done

      - name: Bauen
        id: build
        continue-on-error: true
        working-directory: minecraft-mod-26
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Fehler und Nachschlage-Infos sammeln
        if: always()
        working-directory: minecraft-mod-26
        run: |
          mkdir -p dev
          if [ -f build.log ]; then
            grep -n -E "error:|warning: \[removal\]" -A 3 build.log | head -n 600 > dev/build-errors.txt || true
            grep -E "^[0-9]+ errors?$" build.log >> dev/build-errors.txt || true
          fi
          echo "Bau: ${{ steps.build.outcome }}" >> dev/build-errors.txt
          echo "Fertiges Jar: minecraft-mod-26/download/" >> dev/build-errors.txt
          # Klassen nachschlagen (Namen und Signaturen aus dem Spiel 26.2), Liste in dev/lookup.txt
          if [ -f dev/lookup.txt ]; then
            JARS=$( (find ~/.gradle/caches/fabric-loom .gradle -name '*.jar' 2>/dev/null | grep -E 'minecraft|26\.2' ; find ~/.gradle/caches/modules-2 -name 'fabric-*.jar' 2>/dev/null) | grep -v sources | tr '\n' ':')
            : > dev/lookup-out.txt
            while read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                \#*) continue ;;
                -c\ *) cls=${line#-c }; echo "=== $cls (Code)" >> dev/lookup-out.txt; (javap -c -p -cp "$JARS" "$cls" 2>&1 | grep -E "^  [a-zA-Z].*\(|invoke|getfield|putfield" | head -n 1500 >> dev/lookup-out.txt) || true ;;
                *) echo "=== $line" >> dev/lookup-out.txt; javap -p -cp "$JARS" "$line" >> dev/lookup-out.txt 2>&1 || true ;;
              esac
            done < dev/lookup.txt
          fi
          # Nachschlage-Ergebnis nur ins Bau-Protokoll (nicht ins Repo)
          [ -f dev/lookup-out.txt ] && head -n 4000 dev/lookup-out.txt || true

      - name: Spieltest (Minecraft startet ohne Bildschirm)
        id: gametest
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 25
        working-directory: minecraft-mod-26
        run: ./gradlew runProductionClientGameTest --no-daemon --stacktrace

      - name: Screenshots und Log einsammeln
        if: steps.gametest.outcome == 'success' || steps.gametest.outcome == 'failure'
        working-directory: minecraft-mod-26
        run: |
          rm -rf test-screenshots
          mkdir -p test-screenshots
          find run -path '*screenshots*' -name '*.png' -exec cp {} test-screenshots/ \; || true
          if [ -f run/logs/latest.log ]; then
            {
              echo "=== Wichtige Zeilen ==="
              grep -n -E "Vantage|vantage|TEST |ERROR|Exception|Mixin|FATAL|Caused by" run/logs/latest.log | head -n 400
              echo
              echo "=== Ende des Logs ==="
              tail -n 150 run/logs/latest.log
            } > test-screenshots/log.txt
          fi
          ls run/crash-reports 2>/dev/null && cp run/crash-reports/*.txt test-screenshots/ 2>/dev/null || true
          echo "Spieltest: ${{ steps.gametest.outcome }}" > test-screenshots/status.txt

      - name: Jar und Ergebnisse ins Repo legen
        if: always()
        working-directory: minecraft-mod-26
        run: |
          mkdir -p download
          if [ "${{ steps.build.outcome }}" = "success" ] && ls build/libs/*.jar >/dev/null 2>&1; then
            rm -f download/*.jar
            for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) cp "$f" download/ ;; esac; done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download dev/build-errors.txt
          [ -d test-screenshots ] && git add test-screenshots
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "26.2: Bau-Ergebnisse automatisch [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; git rebase --abort 2>/dev/null || true; sleep 5; done

      - name: Ergebnis
        if: steps.build.outcome == 'failure' || steps.gametest.outcome == 'failure'
        run: |
          echo "Bau oder Spieltest fehlgeschlagen - siehe minecraft-mod-26/dev/build-errors.txt bzw. test-screenshots/log.txt"
          exit 1
