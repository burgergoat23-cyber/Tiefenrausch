name: Minecraft-Mod bauen

on:
  push:
    paths:
      - 'minecraft-mod/**'
      - '!minecraft-mod/download/**'
      - '!minecraft-mod/test-screenshots/**'
      - '.github/workflows/minecraft-mod.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minecraft-mod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: minecraft-mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Neueste Yarn-Version für 1.21.11 suchen
        run: |
          YARN=$(curl -sf https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          echo "Yarn: $YARN"
          echo "YARN=$YARN" >> "$GITHUB_ENV"

      - name: Bauen
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build -Pyarn_mappings="$YARN" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Jar hochladen
        uses: actions/upload-artifact@v4
        with:
          name: vantage-client
          path: minecraft-mod/build/libs/*.jar

      - name: Spieltest (Minecraft startet ohne Bildschirm)
        id: gametest
        continue-on-error: true
        timeout-minutes: 25
        run: ./gradlew runProductionClientGameTest -Pyarn_mappings="$YARN" --no-daemon --stacktrace

      - name: Screenshots und Log einsammeln
        if: always()
        run: |
          if [ "${{ steps.gametest.outcome }}" = "skipped" ]; then
            # Bau fehlgeschlagen: alte Testbilder behalten, nur den Status setzen
            mkdir -p test-screenshots
            echo "Bau fehlgeschlagen (Spieltest nicht gelaufen)" > test-screenshots/status.txt
            [ -f build.log ] && grep -n -E "error:" -A 3 build.log | head -n 300 >> test-screenshots/status.txt || true
            exit 0
          fi
          rm -rf test-screenshots
          mkdir -p test-screenshots
          find run -path '*screenshots*' -name '*.png' | while read -r f; do
            convert "$f" -resize '960x>' -quality 82 "test-screenshots/$(basename "${f%.png}").jpg" || cp "$f" test-screenshots/
          done
          if [ -f run/logs/latest.log ]; then
            {
              echo "=== Wichtige Zeilen ==="
              grep -n -E "Vantage|vantage|TEST |ERROR|Exception|Mixin|FATAL|Caused by" run/logs/latest.log | head -n 400
              echo
              echo "=== Ende des Logs ==="
              tail -n 150 run/logs/latest.log
            } > test-screenshots/log.txt
          fi
          ls run/crash-reports 2>/dev/null && cp run/crash-reports/*.txt test-screenshots/ 2>/dev/null || true
          echo "Spieltest: ${{ steps.gametest.outcome }}" > test-screenshots/status.txt
          ls -la test-screenshots

      - name: Jar und Test-Ergebnisse ins Repo legen
        if: always()
        run: |
          mkdir -p download
          if ls build/libs/*.jar >/dev/null 2>&1; then
            rm -f download/*.jar
            for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) cp "$f" download/ ;; esac; done
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download test-screenshots
          if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git commit -m "Mod-Jar und Testbilder automatisch erstellt [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; git rebase --abort 2>/dev/null || true; sleep 5; done

      - name: Ergebnis des Spieltests
        if: steps.gametest.outcome == 'failure'
        run: |
          echo "Der Spieltest ist fehlgeschlagen – siehe test-screenshots/log.txt"
          exit 1
