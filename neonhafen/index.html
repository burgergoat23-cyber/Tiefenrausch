<script>
'use strict';
/* Neonhafen – ein eigenes Open-World-Stadtspiel. Eine Datei, three.js, kein Build-Schritt. */
const N=12,BS=60,W=N*BS,DX=[0,1,0,-1],DZ=[1,0,-1,0],PI=Math.PI;
let seed=20261110;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v,hyp=Math.hypot;
function angDiff(a,b){let d=(a-b)%(2*PI);if(d>PI)d-=2*PI;if(d<-PI)d+=2*PI;return d}
const $=id=>document.getElementById(id);
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;

/* ---------- Stadt ---------- */
const PARKS={'4,8':1,'8,6':1,'3,2':1,'10,10':1,'6,11':1},LOTS={'1,3':1,'2,6':1,'6,9':1,'9,1':1,'7,3':1,'0,7':1,'10,6':1,'4,5':1};
function district(bx,bz){if(bx<=1)return'ind';if(bz>=10)return'beach';return hyp(bx-5.5,bz-4.5)<2.7?'down':'res'}
const PAL={down:[0x8fa3b8,0x6f8196,0xa9b4c2,0x58708a,0xc2c8d0],res:[0xd9b38c,0xc98f6b,0xe6d3a8,0xb8c4a0,0xd0a0a0,0xa8b8d0],ind:[0x8a7f72,0x9a9a92,0x7a8a8f,0xa0764f],beach:[0xfff0d0,0xffc9a8,0xbfe8e0,0xffe08a,0xf0b0c0]};
const blocks=[];
for(let bz=0;bz<N;bz++)for(let bx=0;bx<N;bx++){
  const k=bx+','+bz,dist=district(bx,bz),b={bx,bz,dist,type:PARKS[k]?'park':LOTS[k]?'lot':'bld',boxes:[]},ox=bx*BS,oz=bz*BS;
  if(b.type=='bld'){
    const lay=dist=='down'?[1,2,2][rnd()*3|0]:dist=='ind'?[1,2][rnd()*2|0]:[2,4,4][rnd()*3|0];
    const cuts=lay==1?[[11,11,49,49]]:lay==2?(rnd()<.5?[[11,11,49,29],[11,31,49,49]]:[[11,11,29,49],[31,11,49,49]]):[[11,11,29,29],[31,11,49,29],[11,31,29,49],[31,31,49,49]];
    for(const c of cuts){const i=()=>rnd()*2.5;
      const h=dist=='down'?28+rnd()*70:dist=='res'?7+rnd()*16:dist=='ind'?6+rnd()*7:8+rnd()*14;
      b.boxes.push({x0:ox+c[0]+i(),z0:oz+c[1]+i(),x1:ox+c[2]-i(),z1:oz+c[3]-i(),h,col:PAL[dist][rnd()*PAL[dist].length|0]})}
  }
  blocks.push(b);
}
function blk(x,z){const bx=Math.floor(x/BS),bz=Math.floor(z/BS);return(bx<0||bz<0||bx>=N||bz>=N)?null:blocks[bx+bz*N]}
function solidAt(x,z){const b=blk(x,z);if(!b)return false;for(const q of b.boxes)if(!q.t&&x>q.x0&&x<q.x1&&z>q.z0&&z<q.z1)return true;return false}
function los(x0,z0,x1,z1){const d=hyp(x1-x0,z1-z0),n=Math.ceil(d/3);for(let i=1;i<n;i++){const t=i/n;if(solidAt(x0+(x1-x0)*t,z0+(z1-z0)*t))return false}return true}
function collide(o,r){let hit=null;const b=blk(o.x,o.z);
  if(b)for(const q of b.boxes){const cx=clamp(o.x,q.x0,q.x1),cz=clamp(o.z,q.z0,q.z1);let dx=o.x-cx,dz=o.z-cz;const d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2);dx/=d;dz/=d;o.x=cx+dx*r;o.z=cz+dz*r;hit=[dx,dz]}
      else{const l=o.x-q.x0,rt=q.x1-o.x,t=o.z-q.z0,bt=q.z1-o.z,m=Math.min(l,rt,t,bt);
        if(m==l){o.x=q.x0-r;hit=[-1,0]}else if(m==rt){o.x=q.x1+r;hit=[1,0]}else if(m==t){o.z=q.z0-r;hit=[0,-1]}else{o.z=q.z1+r;hit=[0,1]}}}}
  const lo=-34,hi=W+34;
  if(o.x<lo){o.x=lo;hit=[1,0]}if(o.x>hi){o.x=hi;hit=[-1,0]}if(o.z<lo){o.z=lo;hit=[0,1]}if(o.z>hi){o.z=hi;hit=[0,-1]}
  return hit}
const walk=(bx,bz)=>({x:bx*BS+30,z:bz*BS+51}),road=(bx,bz)=>({x:bx*BS+30,z:(bz+1)*BS-3.5});
const PLACES=[
 {k:'safe',n:'Unterschlupf',l:'H',c:'#55ff66',...walk(7,8)},
 {k:'rosa',n:'Rosa – Aufträge',l:'R',c:'#ffdd33',...walk(3,6)},
 {k:'gun',n:'Eisen & Blei',l:'W',c:'#ff5555',...walk(6,4)},{k:'gun',n:'Eisen & Blei',l:'W',c:'#ff5555',...walk(9,9)},
 {k:'spray',n:'Farbwechsel',l:'L',c:'#44ddff',x:2*BS+18,z:8*BS+51},{k:'spray',n:'Farbwechsel',l:'L',c:'#44ddff',x:9*BS+18,z:3*BS+51},
 {k:'food',n:'Möwenbiss',l:'I',c:'#ffaa44',...walk(5,8)},{k:'food',n:'Möwenbiss',l:'I',c:'#ffaa44',...walk(8,5)},{k:'food',n:'Möwenbiss',l:'I',c:'#ffaa44',...walk(4,2)}];
const HOSP=walk(8,2),COPS=walk(5,3),HOME=walk(7,8);

/* ---------- three.js Grundlagen ---------- */
const cv=$('c'),ren=new THREE.WebGLRenderer({canvas:cv,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x86c3ea,110,430);scene.background=new THREE.Color(0x86c3ea);
const cam=new THREE.PerspectiveCamera(60,1,.3,1200);
const hemi=new THREE.HemisphereLight(0xffffff,0x4a5a4a,.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff4e0,.9);scene.add(sun);
const head=new THREE.SpotLight(0xfff2cc,0,60,.5,.5,1);scene.add(head);scene.add(head.target);
function resize(){const w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const mats={};function lam(c){return mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}))}
const bmats={};function bas(c){return bmats[c]||(bmats[c]=new THREE.MeshBasicMaterial({color:c}))}
const BOX=new THREE.BoxGeometry(1,1,1),LIMB=new THREE.BoxGeometry(1,1,1);LIMB.translate(0,-.5,0);
const WHEEL=new THREE.CylinderGeometry(.38,.38,.3,10);WHEEL.rotateZ(PI/2);
function bx(w,h,d,m,x,y,z){const o=new THREE.Mesh(BOX,m);o.scale.set(w,h,d);o.position.set(x,y,z);return o}
function GB(){return{p:[],n:[],u:[],c:[],i:[]}}
function quad(g,a,b,c,d,n,col,uv){const k=g.p.length/3;g.p.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2],d[0],d[1],d[2]);
  for(let i=0;i<4;i++){g.n.push(n[0],n[1],n[2]);g.c.push(col.r,col.g,col.b)}
  uv=uv||[0,0,0,0,0,0,0,0];for(let i=0;i<8;i++)g.u.push(uv[i]);g.i.push(k,k+1,k+2,k,k+2,k+3)}
const TC=new THREE.Color();
function gbox(g,x0,y0,z0,x1,y1,z1,hex,win){const c=TC.set(hex).clone(),w=x1-x0,d=z1-z0,h=y1-y0;
  const U=L=>{if(!win)return null;const o=(rnd()*4|0)/4,p=(rnd()*4|0)/4;return[o,p,o+L/16,p,o+L/16,p+h/14,o,p+h/14]};
  quad(g,[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[1,0,0],c,U(d));
  quad(g,[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0],c,U(d));
  quad(g,[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],c,U(w));
  quad(g,[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1],c,U(w));
  const t=c.clone().multiplyScalar(.55);quad(g,[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],[0,1,0],t)}
function flat(g,x0,z0,x1,z1,y,hex){quad(g,[x0,y,z1],[x1,y,z1],[x1,y,z0],[x0,y,z0],[0,1,0],TC.set(hex).clone())}
function gmesh(g,mat){const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(g.p,3));geo.setAttribute('normal',new THREE.Float32BufferAttribute(g.n,3));
  geo.setAttribute('uv',new THREE.Float32BufferAttribute(g.u,2));geo.setAttribute('color',new THREE.Float32BufferAttribute(g.c,3));
  geo.setIndex(g.i);const m=new THREE.Mesh(geo,mat);scene.add(m);return m}
function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}t.anisotropy=4;return t}

/* ---------- Welt bauen ---------- */
let winMat,bulbMat,waterMesh;
function buildWorld(){
  const wt=ctex(256,256,x=>{x.fillStyle='#d8d8d8';x.fillRect(0,0,256,256);x.fillStyle='#3d5873';for(let i=0;i<4;i++)for(let j=0;j<4;j++)x.fillRect(i*64+13,j*64+12,38,36)},1);
  const et=ctex(256,256,x=>{x.fillStyle='#000';x.fillRect(0,0,256,256);for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(rnd()<.5){x.fillStyle=rnd()<.75?'#ffd98a':'#a8d8ff';x.fillRect(i*64+13,j*64+12,38,36)}},1);
  winMat=new THREE.MeshLambertMaterial({map:wt,emissiveMap:et,emissive:0xffffff,emissiveIntensity:0,vertexColors:true});
  const g=GB(),f=GB(),trees=[],lamps=[];
  for(const b of blocks){const ox=b.bx*BS,oz=b.bz*BS;
    for(const q of b.boxes){gbox(g,q.x0,0,q.z0,q.x1,q.h,q.z1,q.col,1);
      if(q.h>40&&rnd()<.6)gbox(g,(q.x0+q.x1)/2-3,q.h,(q.z0+q.z1)/2-3,(q.x0+q.x1)/2+3,q.h+5+rnd()*8,(q.z0+q.z1)/2+3,0x555c66,0)}
    if(b.type=='park'){flat(f,ox+11,oz+11,ox+49,oz+49,.03,0x3f8f4a);flat(f,ox+28,oz+11,ox+32,oz+49,.04,0xc9b98a);flat(f,ox+11,oz+28,ox+49,oz+32,.04,0xc9b98a);
      for(let i=0;i<9;i++){const tx=ox+13+rnd()*34,tz=oz+13+rnd()*34;if(Math.abs(tx-ox-30)<3.5||Math.abs(tz-oz-30)<3.5)continue;trees.push([tx,tz,.8+rnd()*.6,0]);b.boxes.push({x0:tx-.4,x1:tx+.4,z0:tz-.4,z1:tz+.4,h:3,t:1})}}
    if(b.type=='lot'){flat(f,ox+11,oz+11,ox+49,oz+49,.03,0x45474d);for(let i=0;i<8;i++){flat(f,ox+14+i*4.6,oz+13,ox+14.2+i*4.6,oz+19,.04,0xdddddd);flat(f,ox+14+i*4.6,oz+41,ox+14.2+i*4.6,oz+47,.04,0xdddddd)}}
    if(b.dist=='beach'||b.bz==N-1)for(const lx of[20,40]){const tx=ox+lx,tz=oz+51.5;trees.push([tx,tz,1,1])}
    for(const c of[[8,8],[52,8],[8,52],[52,52]])lamps.push([ox+c[0],oz+c[1]]);
  }
  for(let i=0;i<40;i++)trees.push([-30+rnd()*(W+60),W+8+rnd()*22,1,1]);
  gmesh(g,winMat);
  // Steg und Boot
  gbox(f,384,-.3,W,396,.25,W+52,0x8a6a48,0);gbox(f,397,-.2,W+40,402,1.1,W+51,0xf2f2f2,0);gbox(f,398,1.1,W+43,401,2.1,W+47,0x2a6fb0,0);
  gmesh(f,new THREE.MeshLambertMaterial({vertexColors:true}));
  // Boden-Kachel
  const s=512/60,gt=ctex(512,512,x=>{x.fillStyle='#3b3e44';x.fillRect(0,0,512,512);x.fillStyle='#a3a39c';x.fillRect(7*s,7*s,46*s,46*s);x.fillStyle='#74776e';x.fillRect(11*s,11*s,38*s,38*s);
    x.fillStyle='#e8c84a';for(let u=10;u<50;u+=5){x.fillRect(u*s,0,3*s,2);x.fillRect(u*s,510,3*s,2);x.fillRect(0,u*s,2,3*s);x.fillRect(510,u*s,2,3*s)}
    x.fillStyle='#e6e6e6';for(const e of[7.4,50.4])for(let v=.5;v<6.6;v+=1.5){x.fillRect(e*s,v*s,2.2*s,.75*s);x.fillRect(e*s,(60-v-.75)*s,2.2*s,.75*s);x.fillRect(v*s,e*s,.75*s,2.2*s);x.fillRect((60-v-.75)*s,e*s,.75*s,2.2*s)}},1);
  gt.repeat.set(N,N);
  const gp=new THREE.Mesh(new THREE.PlaneGeometry(W,W),new THREE.MeshLambertMaterial({map:gt}));gp.rotation.x=-PI/2;gp.position.set(W/2,0,W/2);scene.add(gp);
  const sd=new THREE.Mesh(new THREE.PlaneGeometry(W+84,W+84),lam(0xcdb980));sd.rotation.x=-PI/2;sd.position.set(W/2,-.06,W/2);scene.add(sd);
