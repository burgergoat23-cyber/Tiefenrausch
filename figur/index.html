[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--buehne);color:var(--schrift);font-family:var(--f-text);overflow:hidden}
#buehne{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}

.kopf{position:fixed;top:0;left:0;right:0;pointer-events:none;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:4px}

.kopf p{margin:0;font-size:.82rem;color:var(--leise);max-width:34ch}
.leiste{position:fixed;left:0;right:0;bottom:0;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

  border-radius:4px;padding:10px 16px;min-height:44px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.leiste button:hover{border-color:var(--bronze)}

.leiste button[aria-pressed="true"]{background:var(--bronze-tief);border-color:var(--bronze);color:#fff8e6}

#lade span{color:var(--leise);font-size:.9rem}
#balken{width:min(260px,70vw);height:4px;background:rgba(214,178,110,.18);border-radius:2px;overflow:hidden}
#balken i{display:block;height:100%;width:0;background:var(--bronze);transition:width .25s}
@media (prefers-reduced-motion:reduce){#balken i{transition:none}}

  if(ids.length===1){goal.th-=(e.clientX-p.x)*0.007;goal.ph=Math.max(-0.12,Math.min(1.1,goal.ph+(e.clientY-p.y)*0.005));}
  p.x=e.clientX;p.y=e.clientY;
  if(ids.length>=2){var a=ptr[ids[0]],b=ptr[ids[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);if(pinch)zoom(pinch/dd);pinch=dd;}});
function up(e){delete ptr[e.pointerId];pinch=0;}
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom(Math.exp(e.deltaY*0.0012));},{passive:false});
function zoom(f){goal.d=Math.max(0.42,Math.min(7,goal.d*f));}
function press(id,on){document.getElementById(id).setAttribute('aria-pressed',on?'true':'false');}
document.getElementById('k-ganz').onclick=function(){goal.d=3.9;goal.ty=0.9;goal.ph=0.06;press('k-ganz',true);press('k-gesicht',false);};
document.getElementById('k-gesicht').onclick=function(){goal.d=0.95;goal.ty=1.585;goal.ph=0.02;press('k-ganz',false);press('k-gesicht',true);};
document.getElementById('k-dreh').onclick=function(){autoDreh=!autoDreh;press('k-dreh',autoDreh);};
document.getElementById('k-wind').onclick=function(){wind=!wind;press('k-wind',wind);};

/* ================= Bewegung: Stehen, Atmen, Blinzeln ================= */
var V=function(){return new T.Vector3();},Q=function(){return new T.Quaternion();};
var FWD=new T.Vector3(0,0,1),tmp={hj:V(),v:V(),ax:V(),td:V(),kn:V(),sd:V(),hq:Q(),qt:Q(),qs:Q(),qi:Q()};
var leg={};
['L','R'].forEach(function(S){var a=bones['leg'+S].userData.w,b=bones['shin'+S].userData.w,c=bones['foot'+S].userData.w;
  leg[S]={l1:a.distanceTo(b),l2:b.distanceTo(c),b1:b.clone().sub(a).normalize(),b2:c.clone().sub(b).normalize(),ank:c.clone()};});
function legIK(S){
  var L=leg[S],th=bones['leg'+S],sh=bones['shin'+S],ft=bones['foot'+S],h=bones.hips;
  tmp.hq.copy(h.quaternion);tmp.hj.copy(th.userData.p0).applyQuaternion(tmp.hq).add(h.position);
  tmp.v.copy(L.ank).sub(tmp.hj);var len=tmp.v.length(),d=Math.min(len,L.l1+L.l2-0.0005);tmp.v.divideScalar(len);
  var ca=(L.l1*L.l1+d*d-L.l2*L.l2)/(2*L.l1*d);ca=ca>1?1:ca<-1?-1:ca;
  tmp.ax.crossVectors(tmp.v,FWD).normalize();tmp.td.copy(tmp.v).applyAxisAngle(tmp.ax,Math.acos(ca));
  tmp.kn.copy(tmp.hj).addScaledVector(tmp.td,L.l1);tmp.sd.copy(L.ank).sub(tmp.kn).normalize();
  tmp.qt.setFromUnitVectors(L.b1,tmp.td);tmp.qs.setFromUnitVectors(L.b2,tmp.sd);
  th.quaternion.copy(tmp.qi.copy(tmp.hq).invert()).multiply(tmp.qt);
  sh.quaternion.copy(tmp.qi.copy(tmp.qt).invert()).multiply(tmp.qs);
  ft.quaternion.copy(tmp.qs).invert();
}
var st={hy:0,hp:0,ey:0,ep:0,blinkAt:1.5,blinkT:-1,awayAt:7,awayEnd:0,ay:0,ap:0,sacAt:0,sy:0,sp:0,last:0};
function pose(t,dt){
  var b=bones,br=Math.sin(t*1.5),bi=br*0.5+0.5;
  var sw=Math.sin(t*0.31)*0.7+Math.sin(t*0.13+1)*0.3;
  b.hips.position.set(0.016*sw,0.95-0.007-0.002*Math.abs(sw)+0.0012*br,0.004*Math.sin(t*0.4));
  b.hips.rotation.set(0.01,0.03*sw,0.034*sw);
  b.spine.rotation.set(0.012+0.004*br,-0.02*sw,-0.03*sw);
  b.chest.rotation.set(-0.018-0.012*br,-0.012*sw,-0.012*sw);
  b.breath.scale.set(1+0.02*bi,1,1+0.075*bi);
  legIK('L');legIK('R');
  [1,-1].forEach(function(s){var S=s>0?'L':'R',a=b['arm'+S],f=b['fore'+S],h=b['hand'+S];
    a.position.copy(a.userData.p0);a.position.y+=0.0045*bi;
    a.rotation.set(0.05+0.02*Math.sin(t*0.5+s),0,s*(-0.2+0.012*bi)+0.012*sw);
    f.rotation.set(-0.2+0.025*Math.sin(t*0.43+s*0.7),0,s*-0.03);
    h.rotation.set(-0.08,s*0.25,s*0.06+0.02*Math.sin(t*0.6+s));});
  /* Blick zur Kamera */
  var cx=cam.position.x,cy=cam.position.y,cz=cam.position.z,yaw=Math.atan2(cx,cz),pit=Math.atan2(cy-1.6,Math.hypot(cx,cz));
  if(Math.abs(yaw)>1.9){yaw=0;pit=0;}
  if(t>st.awayAt){st.awayEnd=t+1.4+Math.random()*1.8;st.awayAt=st.awayEnd+6+Math.random()*7;st.ay=(Math.random()-0.5)*0.9;st.ap=(Math.random()-0.4)*0.25;}
  if(t<st.awayEnd){yaw=st.ay;pit=st.ap;}
  yaw=Math.max(-1.1,Math.min(1.1,yaw));pit=Math.max(-0.35,Math.min(0.45,pit));
  var hyT=yaw*0.55,hpT=pit*0.5,kH=1-Math.exp(-dt*2.6),kE=1-Math.exp(-dt*14);
  st.hy+=(hyT-st.hy)*kH;st.hp+=(hpT-st.hp)*kH;
  if(t>st.sacAt){st.sacAt=t+0.5+Math.random()*1.6;st.sy=(Math.random()-0.5)*0.05;st.sp=(Math.random()-0.5)*0.03;}
  var eyT=Math.max(-0.5,Math.min(0.5,yaw-st.hy))+st.sy,epT=Math.max(-0.3,Math.min(0.3,pit-st.hp))+st.sp;
  st.ey+=(eyT-st.ey)*kE;st.ep+=(epT-st.ep)*kE;
  var nx=0.012*Math.sin(t*0.37)+0.006*br,nz=0.014*Math.sin(t*0.23+2);
  b.neck.rotation.set(-st.hp*0.4+nx+0.02,st.hy*0.4,nz+0.01*sw);
  b.head.rotation.set(-st.hp*0.6+0.01*Math.sin(t*0.51),st.hy*0.6,nz*0.6);
  if(t>st.blinkAt){st.blinkT=t;st.blinkAt=t+(Math.random()<0.18?0.32:1.8+Math.random()*3.8);}
  var bl=0;if(st.blinkT>=0){var u=(t-st.blinkT)/0.17;if(u>=0&&u<1)bl=Math.sin(Math.PI*u);else st.blinkT=-1;}
  for(var i=0;i<eyes.length;i++){eyes[i].rotation.set(-st.ep,st.ey,0);lids[i].rotation.x=-st.ep*0.55+bl*0.78+0.03*Math.sin(t*0.2);}
  /* Haare */
  var g=wind?(0.55+0.45*Math.sin(t*0.21)):0.12,w=(Math.sin(t*0.9)+0.5*Math.sin(t*2.1+2)+0.25*Math.sin(t*3.7+1))*g;
  b.hair1.rotation.set(0.02+0.03*w+st.hp*0.3,0,0.05*w-0.03*sw);
  b.hair2.rotation.set(0.03*Math.sin(t*1.3)*g+0.05*w,0,0.08*w+0.03*Math.sin(t*1.1+1)*g);
  b.hair3.rotation.set(0.05*Math.sin(t*1.5+0.5)*g+0.06*w,0,0.11*w+0.05*Math.sin(t*1.4+2)*g);
  b.lockL.rotation.set(0.05*w*g,0,0.05*w+0.02*Math.sin(t*1.7)*g);
  b.lockR.rotation.set(0.04*w*g,0,0.045*w+0.02*Math.sin(t*1.9+1)*g);
}
function frame(ms){
  requestAnimationFrame(frame);
  var t=ms/1000,dt=Math.min(0.05,Math.max(0.001,t-st.last));st.last=t;
  if(window.__fig.fix!=null){t=window.__fig.fix;dt=0.05;}
  if(autoDreh)goal.th+=dt*0.25;
  var k=1-Math.exp(-dt*7);view.th+=(goal.th-view.th)*k;view.ph+=(goal.ph-view.ph)*k;view.d+=(goal.d-view.d)*k;view.ty+=(goal.ty-view.ty)*k;
  var cp=Math.cos(view.ph);cam.position.set(Math.sin(view.th)*cp*view.d,view.ty+Math.sin(view.ph)*view.d,Math.cos(view.th)*cp*view.d);cam.lookAt(0,view.ty,0);
  if(ready)pose(t,dt);
  renderer.render(scene,cam);
}
window.__fig={lids:lids,eyes:eyes,ready:false,fix:null,view:function(th,ph,d,ty){goal.th=view.th=th;goal.ph=view.ph=ph;goal.d=view.d=d;goal.ty=view.ty=ty;}};
requestAnimationFrame(frame);
build().catch(function(e){ladeT.textContent='Das hat nicht geklappt: '+e.message;});
})();
</script>
