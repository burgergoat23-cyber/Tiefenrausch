<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2419">
<title>BOXRUSH</title>
<style>
:root{--bg:#1c2419;--panel:rgba(30,35,27,.95);--line:#3c4a36;--blue:#3f7fd0;--teal:#e0b878;--red:#cf4e3c;--violet:#7d58c2;--text:#f1ede2;--dim:#a8a290;--wood:#b98149;--green:#5f8f3b}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);overscroll-behavior:none}
canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
canvas#game.nocursor{cursor:none}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;pointer-events:auto;flex-direction:column;align-items:center;gap:10px;background:var(--panel);border:1px solid #4a5640;border-radius:16px;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px);box-sizing:border-box;overflow:auto}
.screen.active{display:flex}
.screen.bare{background:none;border:none;box-shadow:none}
.screen h2{margin:0 0 6px;font-size:26px;letter-spacing:3px;font-weight:800;text-transform:uppercase}
.screen .sub{color:var(--dim);font-size:14px;letter-spacing:2px;margin-bottom:6px;text-align:center}
.screen .foot{color:var(--dim);font-size:12px;margin-top:6px;text-align:center;line-height:1.5}
.screen button{font:inherit;font-size:17px;font-weight:700;letter-spacing:1px;color:var(--text);background:linear-gradient(180deg,#3a4433,#2b3326);border:1px solid #556349;border-radius:10px;padding:12px 18px;min-width:240px;min-height:48px;cursor:pointer;transition:transform .06s,border-color .1s,box-shadow .1s;outline:none;touch-action:manipulation}
.screen button:hover,.screen button:focus-visible,.screen button.focus{border-color:var(--teal);box-shadow:0 0 0 2px rgba(224,184,120,.45)}
.screen button:active{transform:scale(.97)}
.screen button.primary{background:linear-gradient(180deg,#6d9a42,#52782f);border-color:#8db35f}
.screen button.danger{border-color:#7a3a36}
.opts{display:flex;flex-direction:column;gap:8px;width:100%}
.opts.scroll{max-height:52vh;overflow:auto;padding:2px 4px}
.opts button.cyc{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;min-width:0;font-size:15px;text-align:left}
.cyc .val{color:var(--teal);white-space:nowrap}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:15px;margin:4px 0 8px}
.stats .k{color:var(--dim)}
.stats .v{text-align:right;font-weight:700}
#end-score{font-size:30px;font-weight:800;letter-spacing:4px}
#s-touch{position:fixed;top:10px;left:50%;transform:translateX(-50%);padding:10px 12px;gap:6px}
#s-touch .bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#s-touch button{min-width:0;padding:8px 12px;font-size:14px;min-height:44px}
#s-touch .tip{font-size:12px;color:var(--dim);text-align:center}
#logo{width:min(440px,80vw);height:auto;aspect-ratio:640/220}
@media (max-height:520px){.screen{padding:12px 16px;gap:6px}.screen button{min-height:42px;padding:8px 14px}#logo{width:min(300px,60vw)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <div class="screen" id="s-main">
    <canvas id="logo" width="640" height="220"></canvas>
    <div class="sub">BAUEN · EDITIEREN · DUELLIEREN</div>
    <button class="primary" data-act="play">Spielen</button>
    <button data-act="training">Training</button>
    <button data-act="settings">Einstellungen</button>
    <button data-act="stats">Statistik</button>
    <div class="foot" id="main-foot">WASD bewegen · Maus zielen · Q bauen · F editieren · V einboxen</div>
  </div>
  <div class="screen" id="s-play">
    <h2>Spielen</h2>
    <div class="opts" id="play-opts"></div>
    <button class="primary" data-act="start">Start</button>
    <button data-act="back">Zurück</button>
  </div>
  <div class="screen" id="s-training">
    <h2>Training</h2>
    <div class="sub">Unbegrenztes Material · Edit-Zeitmessung · T setzt die Arena zurück</div>
    <div class="opts" id="train-opts"></div>
    <button class="primary" data-act="starttraining">Start</button>
    <button data-act="back">Zurück</button>
  </div>
  <div class="screen" id="s-settings">
    <h2>Einstellungen</h2>
    <div class="opts scroll" id="set-opts"></div>
    <button data-act="keys">Tastenbelegung</button>
    <button data-act="touchlayout">Touch-Layout</button>
    <button data-act="resethints">Hinweise zurücksetzen</button>
    <button data-act="back">Zurück</button>
  </div>
  <div class="screen" id="s-keys">
    <h2>Tasten</h2>
    <div class="opts scroll" id="key-opts"></div>
    <button data-act="keysdefault">Standard</button>
    <button data-act="back">Zurück</button>
  </div>
  <div class="screen" id="s-stats">
    <h2>Statistik</h2>
    <div class="stats" id="stats-body"></div>
    <button data-act="back">Zurück</button>
  </div>
  <div class="screen" id="s-pause">
    <h2>Pause</h2>
    <button class="primary" data-act="resume">Weiter</button>
    <button data-act="settings">Einstellungen</button>
    <button class="danger" data-act="surrender">Aufgeben</button>
  </div>
  <div class="screen" id="s-end">
    <h2 id="end-title">Sieg</h2>
    <div id="end-score">0 : 0</div>
    <div class="stats" id="end-stats"></div>
    <button class="primary" data-act="again">Nochmal</button>
    <button data-act="menu">Hauptmenü</button>
  </div>
  <div class="screen" id="s-touch">
    <div class="bar">
      <button data-act="tsmaller">Größe −</button>
      <button data-act="tbigger">Größe +</button>
      <button data-act="tdefault">Standard</button>
      <button class="primary" data-act="tdone">Fertig</button>
    </div>
    <div class="tip">Buttons ziehen zum Verschieben · antippen zum Auswählen</div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   BOXRUSH – Top-Down-Boxfight mit Bauen, Editieren und KI-Bots
   Eine Datei, kein Server, keine Bibliotheken. Alle Grafiken per Canvas,
   alle Sounds per Web Audio API.
   ===================================================================== */

// =====================================================================
// 1. CONFIG – alle Zahlenwerte zentral
// =====================================================================
const CONFIG = {
  TILE: 96, GRID_W: 20, GRID_H: 20,
  WALL_THICK: 10, WALL_SEGMENTS: 3,
  PLAYER_RADIUS: 13, MOVE_SPEED: 260, ACCEL_TIME: 0.08, DECEL_TIME: 0.06,
  HP_MAX: 100, SHIELD_MAX: 100,
  MATS_START: 500, MATS_MAX: 999, WALL_COST: 10,
  WALL_HP: 150, BUILD_TIME: 0.6, BUILD_START_FRACTION: 0.1,
  BUILD_RANGE: 2, TURBO_BUILD_INTERVAL: 0.05, MAX_PLAYER_WALLS: 300,
  EDIT_RANGE: 1.6, EDIT_APPLY_TIME: 0.08, EDIT_RELEASE_TO_CONFIRM: true,
  EDIT_POINTER_TOLERANCE: 40, EDIT_DRAW_SCALE: 1.6,
  WEAPON_SWITCH_TIME: 0.15, WALL_DAMAGE_MULT: 1.0,
  SHIELD_POTION: { amount: 50, useTime: 1.5, perRound: 2 },
  VIEW_RADIUS: 9,
  ZONE_START_DELAY: 45, ZONE_SHRINK_TIME: 40, ZONE_END_RADIUS: 1.5,
  ZONE_DPS: 5, ZONE_DPS_LATE: 10,
  ROUND_COUNTDOWN: 3, ROUNDS_TO_WIN: 5,
  SOUND_RADIUS: { step: 5, build: 8, edit: 6, shot: 14, wallBreak: 10 },
  MAX_PARTICLES: 400,

  // --- Ergänzende Werte (vom Prompt offen gelassen) ---
  FIXED_DT: 1 / 60, MAX_STEPS: 5, DPR_MAX: 2,
  CAM_LERP: 0.15, CAM_LOOK: 0.25, CAM_LOOK_MAX: 160,
  ZOOM_TILES: 11, ZOOM_TILES_PORTRAIT: 7, ZOOM_MIN: 8, ZOOM_MAX: 14,
  // ENTSCHEIDUNG: Im Hochformat gilt der Zoombereich relativ zum Standard (7 Kacheln), sonst wäre 7 außerhalb von 8–14.
  ZOOM_MIN_PORTRAIT: 5, ZOOM_MAX_PORTRAIT: 10,
  COLLISION_ITER: 2, CORNER_ASSIST: 6, CORNER_ASSIST_SPEED: 220,
  FIGHTER_PUSH_MAX: 3,
  TOUCH_BUILD_DIST: 1.2,
  // ENTSCHEIDUNG: Auf Touch zielt der Edit-Zeiger 0,6 Kacheln vor den Spieler (trifft so die Wand der eigenen Kachel).
  TOUCH_EDIT_DIST: 0.6,
  // ENTSCHEIDUNG: Nach dem Bestätigen eines Edits ist die Waffe nach 0,08 s feuerbereit (Prompt: höchstens 0,1 s).
  EDIT_EXIT_READY: 0.08, EDIT_ABORT_EXTRA: 0.5,
  RELOAD_SPEED_MULT: 0.9, HEAL_SPEED_MULT: 0.5,
  STEP_INTERVAL: 0.35, STEP_JITTER: 0.5, SOUND_RING_TIME: 0.9,
  // ENTSCHEIDUNG: „nach 10 s“ = nach 10 s ununterbrochen außerhalb der Zone.
  ZONE_LATE_AFTER: 10,
  ROUND_END_TIME: 2.5, KILLFEED_TIME: 4, KILLFEED_MAX: 4,
  VIEW_RAYS: 64, VIEW_EPS: 0.0001, FOG_ALPHA: 0.6,
  BOX_DISTANCE: 6, CRATES_MIN: 4, CRATES_MAX: 8,
  // ENTSCHEIDUNG (Wunsch: Häuser): 1–2 Paare Häuser je Runde, punktsymmetrisch; Ziegelwände mit 300 HP, zerstörbar, von niemandem editierbar
  HOUSE_PAIRS_MIN: 1, HOUSE_PAIRS_MAX: 2, HOUSE_SIZE_MIN: 2, HOUSE_SIZE_MAX: 3, HOUSE_WALL_HP: 300,
  TRACER_TIME: 0.08, MUZZLE_TIME: 2 / 60, DMG_NUMBER_TIME: 0.8, HITMARK_TIME: 0.15, HURT_INDICATOR_TIME: 0.9,
  SHAKE_WALL: 2.5, SHAKE_DAMAGE: 7, SHAKE_DECAY: 10,
  AUDIO_MAX_VOICES: 24, AUDIO_MERGE: 0.03, AUDIO_HEAR_TILES: 16,
  TRAINING_RESPAWN: 2,
  HINT_TIME: 4.5,
  BOT: {
    PERCEIVE: 0.1, THINK: 0.2, MEMORY: 4, HYSTERESIS: 0.15, PATH_RECALC: 0.5,
    STUCK_TIME: 1.5, STUCK_DIST: 10, UNSTUCK_TIME: 1,
    PEEK_COOLDOWN: 1, PEEK_SHOOT_MIN: 0.2, PEEK_SHOOT_MAX: 0.6,
    COVER_EHP: 60, PUSH_EHP: 80, PUSH_DEALT: 90, HEAL_SHIELD: 40, FARM_MATS: 60,
    WALL_REPLACE_HP: 50, SHOTGUN_RANGE: 2.5, PERSONALITY: 0.15,
    TASK_TIMEOUT: 1.6
  }
};
const TILE = CONFIG.TILE;
const GW = CONFIG.GRID_W, GH = CONFIG.GRID_H;
const ARENA_W = GW * TILE, ARENA_H = GH * TILE;
const SEG_LEN = TILE / CONFIG.WALL_SEGMENTS;
const DEG = Math.PI / 180;

// Waffen (Werte aus Abschnitt 9). spread = gesamter Streukegel in Grad.
const WEAPONS = [
  { id: 'shotgun', name: 'Schrotflinte', short: 'SCHROT', pellets: 9, damage: 10, interval: 0.9, mag: 5, reload: 0.5, perShell: true,
    spread: 14, range: 4, falloffStart: 2, falloffMin: 0.3, auto: true, sound: 'shotgun' },
  // ENTSCHEIDUNG: Sturmgewehr: erster Schuss geht exakt ins Ziel (0°), +1,1° pro Schuss bis 6°, erholt sich in 0,4 s; Reichweite 14 Kacheln.
  { id: 'rifle', name: 'Sturmgewehr', short: 'GEWEHR', pellets: 1, damage: 30, interval: 1 / 5.5, mag: 30, reload: 2.2,
    spread: 0, bloomPerShot: 1.1, bloomMax: 6, bloomRecover: 0.4, range: 14, auto: true, sound: 'rifle' },
  { id: 'smg', name: 'Maschinenpistole', short: 'MP', pellets: 1, damage: 17, interval: 1 / 11, mag: 30, reload: 2.0,
    spread: 3, range: 6, auto: true, sound: 'smg' },
  // ENTSCHEIDUNG: Spitzhacke trifft in einem Bogen von ±25°; nur zerstörbare Wände geben Material.
  { id: 'pickaxe', name: 'Spitzhacke', short: 'HACKE', melee: true, damage: 20, wallDamage: 50, interval: 0.45, reach: 50, matsPerHit: 5,
    arc: 25, auto: true, sound: 'pickaxe' }
];

// Bot-Schwierigkeitsgrade (Abschnitt 11)
const BOT_PROFILES = {
  easy:   { label: 'Leicht', reaction: 0.6,  aimError: 9,   turnSpeed: 220, buildReaction: 0.5,  peek: 0,    doublePeek: false, lead: false, turbo: false, push: 0.6, strafe: 0.45, coverChance: 0.55 },
  medium: { label: 'Mittel', reaction: 0.4,  aimError: 5,   turnSpeed: 360, buildReaction: 0.3,  peek: 0.25, doublePeek: false, lead: false, turbo: true,  push: 1.0, strafe: 0.7,  coverChance: 0.8 },
  hard:   { label: 'Schwer', reaction: 0.25, aimError: 2.5, turnSpeed: 540, buildReaction: 0.15, peek: 0.6,  doublePeek: false, lead: true,  turbo: true,  push: 1.3, strafe: 0.9,  coverChance: 0.95 },
  pro:    { label: 'Profi',  reaction: 0.15, aimError: 1.2, turnSpeed: 720, buildReaction: 0.08, peek: 0.9,  doublePeek: true,  lead: true,  turbo: true,  push: 1.6, strafe: 1.0,  coverChance: 1.0 }
};
const BOT_NAMES = ['Ziegelzorn', 'Kantenkönig', 'Feldfuchs', 'Mauerblitz', 'Eckenwolf', 'Fugenfee', 'Kachelkralle', 'Rasterrabe', 'Plankenpuma', 'Brettbaron', 'Lückenluchs', 'Fensterfalke'];

// Farbpalette (Abschnitt 15)
// Farbpalette – auf Wunsch natürlicher (Grasboden, Holzwände) statt Neon; Teamfarben nur noch als Akzent
const COLORS = {
  bg: '#1c2419', floor: '#5b8a3d', floor2: '#649546', grid: 'rgba(28,48,18,0.22)', outside: '#27331f',
  own: '#3f7fd0', enemy: '#cf4e3c', neutral: '#8a8f96', mate: '#2fa58c', zone: '#7d58c2',
  preview: 'rgba(255,255,255,0.35)', previewBad: 'rgba(230,60,50,0.45)',
  select: '#5ec8e8', shieldNum: '#58b4ff', hpNum: '#ffd84a', player: '#3f7fd0',
  wood: '#b98149', woodLight: '#d6a56b', woodDark: '#7a4f26', woodSeam: 'rgba(72,40,14,0.6)', woodMem: '#8d8170',
  stone: '#8d9196', stoneLight: '#a9adb2', stoneDark: '#62666c',
  brick: '#a85a40', brickLight: '#c27a5c', brickDark: '#7a3e2c', mortar: 'rgba(225,210,190,0.55)', floorWood: '#9a6f45'
};

// =====================================================================
// Hilfsfunktionen
// =====================================================================
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }
function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
function tileOf(v) { return Math.floor(v / TILE); }
function edgeKey(o, gx, gy) { return o + gx + ',' + gy; }
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgbStr(c, a) { return a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }
function mixRgb(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
function shade(hex, t) { const c = hexToRgb(hex); return t >= 0 ? rgbStr(mixRgb(c, [255, 255, 255], t)) : rgbStr(mixRgb(c, [0, 0, 0], -t)); }
function gaussRand() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }

// Speicher: jeder Zugriff in try/catch, Spiel läuft auch ohne localStorage
const Store = {
  get(key, def) { try { const v = window.localStorage.getItem('boxrush_' + key); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set(key, val) { try { window.localStorage.setItem('boxrush_' + key, JSON.stringify(val)); } catch (e) { /* kein Speicher */ } }
};

const DEFAULT_KEYS = {
  up: 'KeyW', left: 'KeyA', down: 'KeyS', right: 'KeyD', build: 'KeyQ', edit: 'KeyF', box: 'KeyV',
  slot1: 'Digit1', slot2: 'Digit2', slot3: 'Digit3', slot4: 'Digit4', heal: 'Digit5', reload: 'KeyR',
  trainReset: 'KeyT', pause: 'Escape', debug: 'F3'
};
const KEY_LABELS = {
  up: 'Hoch', left: 'Links', down: 'Runter', right: 'Rechts', build: 'Bau-Modus', edit: 'Edit-Modus', box: 'Ein-Knopf-Box',
  slot1: 'Schrotflinte', slot2: 'Sturmgewehr', slot3: 'Maschinenpistole', slot4: 'Spitzhacke', heal: 'Schildtrank', reload: 'Nachladen',
  trainReset: 'Training zurücksetzen', pause: 'Pause / Menü', debug: 'Debug'
};
// Touch-Buttons: Abstand von rechts/unten in CSS-Pixeln (dx, dy) und Größe s
const DEFAULT_TOUCH_LAYOUT = {
  fire:   { dx: 92,  dy: 120, s: 100 },
  build:  { dx: 214, dy: 78,  s: 70 },
  heal:   { dx: 214, dy: 170, s: 60 },
  weapon: { dx: 60,  dy: 252, s: 60 }
};
const DEFAULT_SETTINGS = {
  aimSens: 1, editRelease: CONFIG.EDIT_RELEASE_TO_CONFIRM, shake: true, dmgNumbers: true, reducedFx: false,
  sfxVol: 80, musicVol: 40, music: true, autoFire: false, stickFire: true, hints: true, touchUi: 'auto',
  keys: Object.assign({}, DEFAULT_KEYS), touchLayout: JSON.parse(JSON.stringify(DEFAULT_TOUCH_LAYOUT)), seenHints: {}
};
function loadSettings() {
  const s = Store.get('settings', null) || {};
  const out = Object.assign({}, DEFAULT_SETTINGS, s);
  out.keys = Object.assign({}, DEFAULT_KEYS, s.keys || {});
  out.touchLayout = Object.assign(JSON.parse(JSON.stringify(DEFAULT_TOUCH_LAYOUT)), s.touchLayout || {});
  out.seenHints = Object.assign({}, s.seenHints || {});
  return out;
}
const settings = loadSettings();
function saveSettings() { Store.set('settings', settings); }
const bests = Object.assign({ fastestEdit: 0, maxKills: 0, bestAccuracy: 0, maxDamage: 0, matchesPlayed: 0, matchesWon: 0, roundsWon: 0, wallsBuilt: 0 }, Store.get('bests', {}) || {});
function saveBests() { Store.set('bests', bests); }

// Absichten (Intent): Spieler und Bots steuern ihre Kämpfer über dasselbe Objekt → gleiche Regeln für alle
function makeIntent() {
  return { mx: 0, my: 0, aimX: 0, aimY: 0, fire: false, firePressed: false, alt: false, buildToggle: false, buildHold: false, buildHoldPressed: false,
    editPressed: false, editReleased: false, editTap: false, editConfirm: false, editReset: false,
    panelSeg: -1, panelPressed: false, panelHeld: false, box: false, slot: -1, cycle: 0, heal: false, reload: false,
    shotError: 0, forceWeapon: false, trainReset: false, editCancel: false };
}
function clearIntent(it) {
  it.mx = 0; it.my = 0; it.fire = false; it.firePressed = false; it.alt = false; it.buildToggle = false; it.buildHold = false; it.buildHoldPressed = false;
  it.editPressed = false; it.editReleased = false; it.editTap = false; it.editConfirm = false; it.editReset = false;
  it.panelSeg = -1; it.panelPressed = false; it.panelHeld = false; it.box = false; it.slot = -1; it.cycle = 0; it.heal = false; it.reload = false;
  it.shotError = 0; it.forceWeapon = false; it.trainReset = false; it.editCancel = false;
}

// =====================================================================
// 2. Input – Tastatur, Maus, Touch, Tastenbelegung
// =====================================================================
const Input = {
  down: new Set(), pressed: new Set(), released: new Set(),
  mouse: { x: 0, y: 0, left: false, right: false, leftPressed: false, rightPressed: false, moved: false },
  wheel: 0, zoomDelta: 0,
  touchMode: false,
  capture: null,                 // Rückruf für Tastenbelegung
  touches: new Map(),            // id -> { role, sx, sy, x, y, id2 }
  touch: { moveX: 0, moveY: 0, aimAngle: 0, aimActive: false, aimFire: false, fire: false, firePressed: false, buildHeld: false, buildPressed: false,
    editTap: false, resetTap: false, healTap: false, reloadTap: false, cycleTap: false, boxTap: false, slotTap: -1, confirmTap: false, cancelTap: false,
    panelSeg: -1, panelPressed: false, panelHeld: false, worldSelX: 0, worldSelY: 0, worldSel: false },
  pinch: null,

  init(canvas) {
    this.canvas = canvas;
    window.addEventListener('keydown', e => this.onKeyDown(e));
    window.addEventListener('keyup', e => this.onKeyUp(e));
    window.addEventListener('blur', () => { this.down.clear(); this.mouse.left = this.mouse.right = false; });
    canvas.addEventListener('mousedown', e => this.onMouseDown(e));
    window.addEventListener('mouseup', e => this.onMouseUp(e));
    window.addEventListener('mousemove', e => this.onMouseMove(e));
    canvas.addEventListener('wheel', e => this.onWheel(e), { passive: false });
    window.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('touchstart', e => this.onTouch(e, 'start'), { passive: false });
    canvas.addEventListener('touchmove', e => this.onTouch(e, 'move'), { passive: false });
    canvas.addEventListener('touchend', e => this.onTouch(e, 'end'), { passive: false });
    canvas.addEventListener('touchcancel', e => this.onTouch(e, 'end'), { passive: false });
    // Doppeltipp-Zoom und Gesten auf iOS verhindern
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
    const unlock = () => Sfx.unlock();
    window.addEventListener('pointerdown', unlock, true);
    window.addEventListener('keydown', unlock, true);
    window.addEventListener('touchend', unlock, true);
  },
  isTouchUi() {
    if (settings.touchUi === 'on') return true;

  touchStart(id, x, y) {

    const panel = UI.panelHit(x, y);
    const btn = UI.touchButtonAt(x, y);

  updateMoveStick(tc) {

  endTick() {

  }
};

// Absicht des menschlichen Spielers aus der Eingabe
function playerIntent(f) {
  const it = f.intent; clearIntent(it);

    const T = Input.touch;

    const a = T.aimAngle;
    const d = (f.mode === 'edit' ? CONFIG.TOUCH_EDIT_DIST : CONFIG.TOUCH_BUILD_DIST) * TILE;
    it.aimX = f.x + Math.cos(a) * d; it.aimY = f.y + Math.sin(a) * d;
    const stickFire = settings.stickFire && T.aimFire && f.mode === 'weapon';
    it.fire = T.fire || stickFire; it.firePressed = T.firePressed;
    if (T.fire || T.firePressed) it.forceWeapon = true;
    // Automatisch feuern, wenn ein sichtbarer Gegner im Fadenkreuz ist
    if (settings.autoFire && f.mode === 'weapon' && autoFireTarget(f)) it.fire = true;
    it.buildHold = T.buildHeld; it.buildHoldPressed = T.buildPressed;
    it.editTap = T.editTap; it.editReset = T.resetTap; it.editConfirm = T.confirmTap; it.editCancel = T.cancelTap;
    it.heal = T.healTap; it.reload = T.reloadTap; it.box = T.boxTap; it.cycle = T.cycleTap ? 1 : 0;
    if (T.slotTap >= 0) it.slot = T.slotTap;
    it.panelSeg = T.panelSeg; it.panelPressed = T.panelPressed; it.panelHeld = T.panelHeld;
    // Feld auf der Wand angetippt → Edit startet sofort, Loslassen übernimmt
    if (T.panelPressed && f.mode !== 'edit') it.editTap = true;
  } else {
    it.mx = (Input.key('right') ? 1 : 0) - (Input.key('left') ? 1 : 0);
    it.my = (Input.key('down') ? 1 : 0) - (Input.key('up') ? 1 : 0);
    const w = Renderer.screenToWorld(Input.mouse.x, Input.mouse.y);
    it.aimX = w.x; it.aimY = w.y;
    it.fire = Input.mouse.left; it.firePressed = Input.mouse.leftPressed;
    it.alt = Input.mouse.rightPressed;
    if (it.alt && f.mode === 'edit') it.editReset = true;
    it.buildToggle = Input.keyPressed('build');
    it.editPressed = Input.keyPressed('edit'); it.editReleased = Input.keyReleased('edit');
    it.box = Input.keyPressed('box');
    for (let i = 0; i < 4; i++) if (Input.keyPressed('slot' + (i + 1))) it.slot = i;
    it.heal = Input.keyPressed('heal'); it.reload = Input.keyPressed('reload');
    it.cycle = Input.wheel > 0 ? 1 : Input.wheel < 0 ? -1 : 0;
    it.trainReset = Input.keyPressed('trainReset');
  }
  if (Input.zoomDelta) { Renderer.setZoom(Renderer.zoomTiles + Input.zoomDelta); Input.zoomDelta = 0; }

}
function hasTouchRole(r) { for (const t of Input.touches.values()) if (t.role === r) return true; return false; }
function autoFireTarget(f) {
  for (const e of Match.fighters) {
    if (!e.alive || e.team === f.team || !e.visibleToPlayer) continue;
    const d = dist(f.x, f.y, e.x, e.y);
    if (d > WEAPONS[f.slot].range * TILE && !WEAPONS[f.slot].melee) continue;
    if (WEAPONS[f.slot].melee && d > f.r + 60) continue;
    const a = Math.atan2(e.y - f.y, e.x - f.x);
    if (Math.abs(angDiff(a, f.aim)) < Math.atan2(e.r * 1.1, d)) return true;
  }
  return false;
}

// =====================================================================
// 3. WallSystem – Raster, Wände auf Kanten, 3 Felder, Abfragen
// =====================================================================
const WallSystem = {
  h: null, v: null, list: [], nextId: 1, version: 0, seq: 0,

  reset() {
    this.h = []; for (let x = 0; x < GW; x++) this.h.push(new Array(GH + 1).fill(null));
    this.v = []; for (let x = 0; x <= GW; x++) this.v.push(new Array(GH).fill(null));
    this.list = []; this.version++;
  },
  inRange(o, gx, gy) {
    return o === 'H' ? (gx >= 0 && gx < GW && gy >= 0 && gy <= GH) : (gx >= 0 && gx <= GW && gy >= 0 && gy < GH);
  },
  isBorder(o, gx, gy) { return o === 'H' ? (gy === 0 || gy === GH) : (gx === 0 || gx === GW); },
  get(o, gx, gy) {
    if (!this.inRange(o, gx, gy)) return null;
    return o === 'H' ? this.h[gx][gy] : this.v[gx][gy];
  },
  add(o, gx, gy, p) {
    if (!this.inRange(o, gx, gy) || this.get(o, gx, gy)) return null;
    const w = {
      id: this.nextId++, orient: o, gx, gy,
      segments: [true, true, true],
      hp: p.hp !== undefined ? p.hp : (p.maxHp || CONFIG.WALL_HP), maxHp: p.maxHp || CONFIG.WALL_HP, material: p.material || 'wood',
      buildProgress: p.instant ? 1 : 0,
      ownerId: p.ownerId || 0, team: p.team === undefined ? -1 : p.team,
      editState: null, indestructible: !!p.indestructible,
      // Zusatzfelder
      x0: gx * TILE, y0: gy * TILE, cx: 0, cy: 0, rects: [], seq: this.seq++, pending: null,
      blink: [0, 0, 0], dead: false, hitFlash: 0, cracks: null, key: edgeKey(o, gx, gy)
    };
    w.cx = o === 'H' ? w.x0 + TILE / 2 : w.x0;
    w.cy = o === 'H' ? w.y0 : w.y0 + TILE / 2;
    if (w.indestructible) { w.hp = w.maxHp = 1e9; w.buildProgress = 1; }
    this.updateRects(w);
    if (o === 'H') this.h[gx][gy] = w; else this.v[gx][gy] = w;
    this.list.push(w);
    this.version++;
    return w;
  },
  remove(w) {
    if (w.dead) return;
    w.dead = true;
    if (w.orient === 'H') this.h[w.gx][w.gy] = null; else this.v[w.gx][w.gy] = null;
    const i = this.list.indexOf(w); if (i >= 0) this.list.splice(i, 1);
    w.editState = null; w.pending = null;
    this.version++;
  },
  // Rechteck eines Feldes (32 × 10 Einheiten mittig auf der Kante)
  segRect(w, i, thickScale) {
    const h = CONFIG.WALL_THICK * (thickScale || 1) / 2;
    if (w.orient === 'H') return { x0: w.x0 + i * SEG_LEN, y0: w.y0 - h, x1: w.x0 + (i + 1) * SEG_LEN, y1: w.y0 + h };
    return { x0: w.x0 - h, y0: w.y0 + i * SEG_LEN, x1: w.x0 + h, y1: w.y0 + (i + 1) * SEG_LEN };
  },
  fullRect(o, gx, gy) {
    const h = CONFIG.WALL_THICK / 2, x0 = gx * TILE, y0 = gy * TILE;
    if (o === 'H') return { x0, y0: y0 - h, x1: x0 + TILE, y1: y0 + h };
    return { x0: x0 - h, y0, x1: x0 + h, y1: y0 + TILE };
  },
  // Zusammenhängende geschlossene Felder zu Rechtecken zusammenfassen (schneller für Physik, Sicht, Strahlen)
  updateRects(w) {
    w.rects = [];
    let i = 0;
    while (i < 3) {
      if (!w.segments[i]) { i++; continue; }
      let j = i; while (j + 1 < 3 && w.segments[j + 1]) j++;
      const a = this.segRect(w, i), b = this.segRect(w, j);
      w.rects.push({ x0: a.x0, y0: a.y0, x1: b.x1, y1: b.y1, o: w.orient, wall: w });
      i = j + 1;
    }
  },
  setSegments(w, segs) {
    w.segments = segs.slice();
    this.updateRects(w);
    this.version++;
  },
  edgeMid(o, gx, gy) { return o === 'H' ? { x: (gx + 0.5) * TILE, y: gy * TILE } : { x: gx * TILE, y: (gy + 0.5) * TILE }; },
  tileEdges(tx, ty) { return [['H', tx, ty], ['H', tx, ty + 1], ['V', tx, ty], ['V', tx + 1, ty]]; },
  // Feld unter einem Zeigerpunkt: Projektion auf die Wandachse, Toleranz quer zur Wand
  fieldAt(w, px, py) {
    const along = w.orient === 'H' ? px - w.x0 : py - w.y0;
    const across = w.orient === 'H' ? Math.abs(py - w.y0) : Math.abs(px - w.x0);
    if (across > CONFIG.EDIT_POINTER_TOLERANCE) return -1;
    if (along < -CONFIG.EDIT_POINTER_TOLERANCE || along > TILE + CONFIG.EDIT_POINTER_TOLERANCE) return -1;
    const t = along / TILE;
    return clamp(Math.floor(t * 3), 0, 2);
  },
  segCenter(w, i) {
    return w.orient === 'H' ? { x: w.x0 + (i + 0.5) * SEG_LEN, y: w.y0 } : { x: w.x0, y: w.y0 + (i + 0.5) * SEG_LEN };
  },
  countPlayerWalls() { let n = 0; for (const w of this.list) if (!w.indestructible) n++; return n; },
  // Laufende Wand-Zustände: Aufbau, Edit-Anwendung, Blinken
  update(dt) {
    for (const w of this.list) {
      if (w.buildProgress < 1) {
        w.buildProgress = Math.min(1, w.buildProgress + dt / CONFIG.BUILD_TIME);
        w.hp = Math.min(w.maxHp, w.hp + w.maxHp * (1 - CONFIG.BUILD_START_FRACTION) * dt / CONFIG.BUILD_TIME);
      }
      if (w.hitFlash > 0) w.hitFlash -= dt;
      for (let i = 0; i < 3; i++) if (w.blink[i] > 0) w.blink[i] -= dt;
      if (w.pending) {
        w.pending.t -= dt;
        if (w.pending.t <= 0) {
          const segs = w.pending.segs.slice();
          // Ein Feld, in dem ein Kämpfer steht, bleibt offen und blinkt rot
          for (let i = 0; i < 3; i++) {
            if (segs[i] && !w.segments[i] && fighterInRect(this.segRect(w, i))) { segs[i] = false; w.blink[i] = 0.7; }
          }
          if (segs.every(s => !s)) segs[1] = true; // Sicherheitsnetz: nie alle 3 offen
          this.setSegments(w, segs);
          w.pending = null;
        }
      }
    }
  },
  // Arena für eine Runde: Randwände, Boxen, Kisten
  buildBorders() {
    for (let x = 0; x < GW; x++) { this.add('H', x, 0, { indestructible: true }); this.add('H', x, GH, { indestructible: true }); }
    for (let y = 0; y < GH; y++) { this.add('V', 0, y, { indestructible: true }); this.add('V', GW, y, { indestructible: true }); }
  },
  boxEdges(bx, by) {
    return [['H', bx, by], ['H', bx + 1, by], ['H', bx, by + 2], ['H', bx + 1, by + 2], ['V', bx, by], ['V', bx, by + 1], ['V', bx + 2, by], ['V', bx + 2, by + 1]];
  },
  buildBox(bx, by, f) {
    for (const [o, x, y] of this.boxEdges(bx, by)) this.add(o, x, y, { ownerId: f.id, team: f.team, instant: true });
  },
  buildCrate(tx, ty) { for (const [o, x, y] of this.tileEdges(tx, ty)) this.add(o, x, y, { indestructible: true }); }
};

function fighterInRect(R, except) {
  for (const f of Match.fighters) {
    if (!f.alive || f === except) continue;
    if (Physics.circleOverlapsRect(f.x, f.y, f.r, R)) return true;
  }
  return false;
}

// =====================================================================
// 4. Physics – Kreis gegen Wandfeld, Raycasts (DDA)
// =====================================================================
const Physics = {
  _c: { nx: 0, ny: 0, depth: 0, corner: false },
  _rects: [], stamp: 1,
  circleOverlapsRect(cx, cy, r, R) {
    const nx = clamp(cx, R.x0, R.x1), ny = clamp(cy, R.y0, R.y1);
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  },
  // Kreis gegen Rechteck: kürzeste Normale zum Herausschieben
  circleRect(cx, cy, r, R, out) {
    const nx = clamp(cx, R.x0, R.x1), ny = clamp(cy, R.y0, R.y1);
    const dx = cx - nx, dy = cy - ny, d2 = dx * dx + dy * dy;
    if (d2 >= r * r) return false;
    if (d2 > 1e-9) {
      const d = Math.sqrt(d2);
      out.nx = dx / d; out.ny = dy / d; out.depth = r - d;
      out.corner = (cx < R.x0 || cx > R.x1) && (cy < R.y0 || cy > R.y1);
    } else {
      // Mittelpunkt steckt im Rechteck (Einklemmen): zur nächsten freien Seite schieben
      const l = cx - R.x0, rr = R.x1 - cx, t = cy - R.y0, b = R.y1 - cy;
      const m = Math.min(l, rr, t, b);
      out.corner = false;
      if (m === l) { out.nx = -1; out.ny = 0; out.depth = l + r; }
      else if (m === rr) { out.nx = 1; out.ny = 0; out.depth = rr + r; }
      else if (m === t) { out.nx = 0; out.ny = -1; out.depth = t + r; }
      else { out.nx = 0; out.ny = 1; out.depth = b + r; }
    }
    return true;
  },
  // Alle geschlossenen Wandrechtecke in den 3 × 3 Kacheln um einen Punkt
  nearRects(x, y) {
    const out = this._rects; out.length = 0;
    const tx = tileOf(x), ty = tileOf(y);
    const W = WallSystem;
    for (let gx = tx - 1; gx <= tx + 1; gx++) for (let gy = ty - 1; gy <= ty + 2; gy++) {
      const w = W.get('H', gx, gy); if (w) for (const R of w.rects) out.push(R);
    }
    for (let gx = tx - 1; gx <= tx + 2; gx++) for (let gy = ty - 1; gy <= ty + 1; gy++) {
      const w = W.get('V', gx, gy); if (w) for (const R of w.rects) out.push(R);
    }
    return out;
  },
  moveFighter(f, dt) {
    f.x += f.vx * dt; f.y += f.vy * dt;
    const c = this._c, r = f.r;
    for (let iter = 0; iter < CONFIG.COLLISION_ITER; iter++) {
      const rects = this.nearRects(f.x, f.y);
      let any = false;
      for (const R of rects) {
        if (!this.circleRect(f.x, f.y, r, R, c)) continue;
        any = true;

  // Strahl gegen achsenparalleles Rechteck (Slab-Test), liefert t ≥ 0 oder Infinity
  rayRect(ox, oy, dx, dy, R) {
    let tmin = 0, tmax = Infinity;

  // Raster-Traversierung (DDA): prüft nur die Kanten der Kacheln, die der Strahl kreuzt

    const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1;
    const tDX = dx !== 0 ? Math.abs(TILE / dx) : Infinity, tDY = dy !== 0 ? Math.abs(TILE / dy) : Infinity;
    let tMX = dx !== 0 ? ((tx + (dx > 0 ? 1 : 0)) * TILE - ox) / dx : Infinity;
    let tMY = dy !== 0 ? ((ty + (dy > 0 ? 1 : 0)) * TILE - oy) / dy : Infinity;

      w.rayStamp = stamp;

    };
    for (let guard = 0; guard < 64; guard++) {
      test(W.h[tx][ty]); test(W.h[tx][ty + 1]); test(W.v[tx][ty]); test(W.v[tx + 1][ty]);
      const tExit = Math.min(tMX, tMY);
      if (best <= tExit || tExit > maxT) break;
      if (tMX < tMY) { tx += stepX; tMX += tDX; } else { ty += stepY; tMY += tDY; }

  },
  // Strahl gegen Kämpfer (Kreise)
  raycastFighters(ox, oy, dx, dy, maxT, shooter) {
    let best = maxT, bf = null;
    for (const f of Match.fighters) {
      if (!f.alive || f === shooter) continue;
      // ENTSCHEIDUNG: Kein Eigenbeschuss – Kugeln fliegen durch Teammitglieder hindurch
      if (shooter && f.team === shooter.team) continue;
      const fx = ox - f.x, fy = oy - f.y;
      const b = fx * dx + fy * dy, c = fx * fx + fy * fy - f.r * f.r;
      const disc = b * b - c; if (disc < 0) continue;
      const s = Math.sqrt(disc);

  separateFighters() {
    const fs = Match.fighters;

      a.x -= nx * p; a.y -= ny * p; b.x += nx * p; b.y += ny * p;
    }
  }

// =====================================================================
// 5. Entities – Kämpfer, Partikel, Spuren, Schadenszahlen (mit Objekt-Pools)

function newStats() {

}

    x: 0, y: 0, px: 0, py: 0, rx: 0, ry: 0, vx: 0, vy: 0, r: CONFIG.PLAYER_RADIUS, aim: 0, pointerX: 0, pointerY: 0,
    hp: CONFIG.HP_MAX, shield: CONFIG.SHIELD_MAX, mats: CONFIG.MATS_START, potions: CONFIG.SHIELD_POTION.perRound, alive: true,

    edit: null, buildPreview: null, turboT: 0, lastBuildKey: null, muzzle: 0, stepT: 0, outsideT: 0, zoneAcc: 0,

  f.hp = CONFIG.HP_MAX; f.shield = CONFIG.SHIELD_MAX;

  f.slot = 1; f.mode = 'weapon'; f.ready = 0; f.ws = WEAPONS.map(w => ({ mag: w.mag || 0 }));

const Entities = {
  particles: [], pCount: 0, tracers: [], numbers: [], flashes: [],
  initPools() {
    this.particles = []; for (let i = 0; i < CONFIG.MAX_PARTICLES; i++) this.particles.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, color: '#fff', drag: 0 });
    this.tracers = []; for (let i = 0; i < 96; i++) this.tracers.push({ on: false, x0: 0, y0: 0, x1: 0, y1: 0, life: 0, color: '#fff', vis: true });
    this.numbers = []; for (let i = 0; i < 64; i++) this.numbers.push({ on: false, x: 0, y: 0, val: 0, life: 0, color: '#fff' });

  },
  clear() { for (const p of this.particles) p.on = false; for (const t of this.tracers) t.on = false; for (const n of this.numbers) n.on = false; },
  particle(x, y, vx, vy, life, size, color, drag) {
    if (settings.reducedFx && Math.random() < 0.5) return;
    const p = this.particles[this.pNext]; this.pNext = (this.pNext + 1) % this.particles.length;
    p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.size = size; p.color = color; p.drag = drag || 3;

  burst(x, y, n, speed, life, size, color) {

  },
  tracer(x0, y0, x1, y1, color) {
    const t = this.tracers[this.tNext]; this.tNext = (this.tNext + 1) % this.tracers.length;
    t.on = true; t.x0 = x0; t.y0 = y0; t.x1 = x1; t.y1 = y1; t.life = CONFIG.TRACER_TIME; t.color = color;
  },
  number(x, y, val, color) {

  }

// ---------------------------------------------------------------------
// Kämpfer-Update: wendet eine Absicht an (für Spieler und Bots identisch)
// ---------------------------------------------------------------------
function updateFighter(f, it, dt) {
  if (!f.alive) return;
  const ph = Match.phase;
  const locked = ph === 'countdown' || ph === 'roundEnd' || ph === 'matchEnd';
  const adx = it.aimX - f.x, ady = it.aimY - f.y;
  if (adx * adx + ady * ady > 1) f.aim = Math.atan2(ady, adx);
  f.pointerX = it.aimX; f.pointerY = it.aimY;
  if (f.ready > 0) f.ready -= dt;
  if (f.muzzle > 0) f.muzzle -= dt;
  if (f.matsFlash > 0) f.matsFlash -= dt;
  if (f.matsErr > 0) f.matsErr -= dt;
  if (f.hurtT > 0) f.hurtT -= dt;
  const rw = WEAPONS[1];
  f.bloom = Math.max(rw.spread, f.bloom - (rw.bloomMax - rw.spread) / rw.bloomRecover * dt);

  if (!locked) handleActions(f, it, dt);
  else { if (f.mode === 'edit') endEdit(f); f.buildPreview = null; }
  updateReload(f, dt); updateHeal(f, dt);

  // Bewegung mit Beschleunigung und Abbremsen
  let mx = locked ? 0 : it.mx, my = locked ? 0 : it.my;
  const ml = Math.hypot(mx, my); if (ml > 1) { mx /= ml; my /= ml; }
  let speed = CONFIG.MOVE_SPEED;
  if (f.heal) speed *= CONFIG.HEAL_SPEED_MULT; else if (f.reload) speed *= CONFIG.RELOAD_SPEED_MULT;
  const tvx = mx * speed, tvy = my * speed;
  const moving = ml > 0.01;
  const rate = moving ? CONFIG.MOVE_SPEED / CONFIG.ACCEL_TIME : CONFIG.MOVE_SPEED / CONFIG.DECEL_TIME;
  const ddx = tvx - f.vx, ddy = tvy - f.vy, dl = Math.hypot(ddx, ddy), step = rate * dt;
  if (dl <= step) { f.vx = tvx; f.vy = tvy; } else { f.vx += ddx / dl * step; f.vy += ddy / dl * step; }
  Physics.moveFighter(f, dt);

  // Schritte als Geräusch
  const sp = Math.hypot(f.vx, f.vy);
  if (sp > 60) {
    f.stepT -= dt;
    if (f.stepT <= 0) { f.stepT = CONFIG.STEP_INTERVAL; Noise.emit('step', f.x, f.y, f); Sfx.play('step', f.x, f.y, f.isPlayer ? 0.5 : 0.8); }
  } else f.stepT = 0.05;
}

function handleActions(f, it, dt) {
  // Waffenwahl
  if (it.slot >= 0) selectSlot(f, it.slot);
  if (it.cycle) selectSlot(f, f.mode === 'weapon' ? (f.slot + it.cycle + 4) % 4 : f.slot);
  if (it.forceWeapon && f.mode === 'build') toWeapon(f);
  // Bau-Modus
  if (it.buildToggle) { if (f.mode === 'build') toWeapon(f); else enterBuild(f); }
  if (it.buildHoldPressed && f.mode !== 'build') enterBuild(f);
  if (it.box && f.mode !== 'edit') buildBox(f);
  // Edit-Modus
  const releaseMode = f.editRelease;
  if (it.editPressed) {
    if (f.mode === 'edit') { if (!releaseMode) confirmEdit(f); }
    else startEdit(f);
  }
  if (it.editTap) { if (f.mode === 'edit') confirmEdit(f, true); else if (startEdit(f)) f.edit.tapMode = true; }
  if (f.mode === 'edit') updateEditMode(f, it);
  if (it.editReleased && f.mode === 'edit' && releaseMode && !f.edit.tapMode) confirmEdit(f);
  if (it.editConfirm && f.mode === 'edit') confirmEdit(f, true);
  if (it.editCancel && f.mode === 'edit') endEdit(f);
  if (it.editReset) { if (f.mode === 'edit') resetEdit(f); else resetTargetWall(f); }

  if (f.mode === 'build') updateBuildMode(f, it, dt);
  else if (f.mode === 'weapon') {
    if (it.reload) startReload(f);
    if (it.heal) startHeal(f);
    if (it.fire || it.firePressed) {
      const w = WEAPONS[f.slot];
      if (w.auto || it.firePressed) tryFire(f, it);
    }
  } else if (it.heal && f.mode === 'build') { toWeapon(f); startHeal(f); }
}

function selectSlot(f, s) {
  if (f.mode === 'edit') endEdit(f);
  if (f.mode === 'weapon' && f.slot === s) return;
  f.slot = s; f.mode = 'weapon'; f.buildPreview = null;
  f.ready = Math.max(f.ready, CONFIG.WEAPON_SWITCH_TIME);
  f.reload = null;
  if (f.isPlayer) Sfx.play('ui', f.x, f.y, 0.4);
}

  if (f.mode === 'edit') endEdit(f);
  if (f.mode !== 'weapon') { f.mode = 'weapon'; f.ready = Math.max(f.ready, CONFIG.WEAPON_SWITCH_TIME); }
  f.buildPreview = null;
}

  if (f.mode === 'edit') endEdit(f);
  f.heal = null; f.reload = null;
  f.mode = 'build'; f.lastBuildKey = null;
}

// ---------------------------------------------------------------------
// Bausystem (Abschnitt 7)
// ---------------------------------------------------------------------
function clampPointer(f, px, py, range) {
  const dx = px - f.x, dy = py - f.y, d = Math.hypot(dx, dy);
  if (d <= range || d < 0.001) return { x: px, y: py };
  return { x: f.x + dx / d * range, y: f.y + dy / d * range };
}

  const vx = Math.round(p.x / TILE), vy = Math.floor(p.y / TILE);
  const hm = WallSystem.edgeMid('H', hx, hy), vm = WallSystem.edgeMid('V', vx, vy);
  const useH = dist(p.x, p.y, hm.x, hm.y) <= dist(p.x, p.y, vm.x, vm.y);
  const o = useH ? 'H' : 'V', gx = useH ? hx : vx, gy = useH ? hy : vy;
  const t = { o, gx, gy, valid: true, reason: '', key: edgeKey(o, gx, gy) };
  if (!WallSystem.inRange(o, gx, gy)) { t.valid = false; t.reason = 'outside'; return t; }
  if (WallSystem.get(o, gx, gy)) { t.valid = false; t.reason = 'occupied'; return t; }
  if (fighterInRect(WallSystem.fullRect(o, gx, gy))) { t.valid = false; t.reason = 'blocked'; return t; }
  if (!f.unlimitedMats && f.mats < CONFIG.WALL_COST) { t.valid = false; t.reason = 'mats'; return t; }
  return t;
}
function placeWall(f, o, gx, gy) {
  if (!WallSystem.inRange(o, gx, gy) || WallSystem.get(o, gx, gy)) return null;
  if (fighterInRect(WallSystem.fullRect(o, gx, gy))) return null;
  if (!f.unlimitedMats && f.mats < CONFIG.WALL_COST) return null;
  // Ab 300 Spielerwänden verschwindet die älteste Wand des bauenden Kämpfers
  if (WallSystem.countPlayerWalls() >= CONFIG.MAX_PLAYER_WALLS) {
    let old = null;
    for (const w of WallSystem.list) if (w.ownerId === f.id && !w.indestructible && (!old || w.seq < old.seq)) old = w;
    if (old) WallSystem.remove(old); else return null;
  }
  // ENTSCHEIDUNG: Kämpfer werden pro Update in aufsteigender ID-Reihenfolge verarbeitet. Bei gleicher Kante gewinnt so
  // automatisch die niedrigere ID; der andere zahlt nichts (entspricht „Material zurück“).
  const w = WallSystem.add(o, gx, gy, { ownerId: f.id, team: f.team, hp: CONFIG.WALL_HP * CONFIG.BUILD_START_FRACTION });
  if (!w) return null;
  if (!f.unlimitedMats) f.mats -= CONFIG.WALL_COST;
  f.matsFlash = 0.25;
  addStat(f, 'wallsBuilt', 1);
  f.heal = null;
  Sfx.play('build', w.cx, w.cy);
  Noise.emit('build', w.cx, w.cy, f);
  for (let i = 0; i < 6; i++) Entities.particle(w.cx + rand(-30, 30) * (o === 'H' ? 1 : 0.2), w.cy + rand(-30, 30) * (o === 'V' ? 1 : 0.2), rand(-40, 40), rand(-40, 40), 0.35, 3, 'rgba(200,210,230,0.6)', 4);
  return w;
}
function buildFail(f, reason) {

  if (f.isPlayer) Sfx.play('error', f.x, f.y, 0.5);
}
function updateBuildMode(f, it, dt) {
  const t = buildTarget(f, it.aimX, it.aimY);
  f.buildPreview = t;
  if (f.turboT > 0) f.turboT -= dt;
  const pressed = it.firePressed || it.buildHoldPressed;
  const held = (it.fire || it.buildHold) && f.turboAllowed;
  if (pressed) {
    if (t.valid) { if (placeWall(f, t.o, t.gx, t.gy)) { f.lastBuildKey = t.key; f.turboT = CONFIG.TURBO_BUILD_INTERVAL; } }
    else buildFail(f, t.reason);
  } else if (held && t.valid && f.turboT <= 0 && t.key !== f.lastBuildKey) {
    // Turbo-Bau: jede neue gültige Kante unter dem Zeiger, höchstens alle 0,05 s
    if (placeWall(f, t.o, t.gx, t.gy)) { f.lastBuildKey = t.key; f.turboT = CONFIG.TURBO_BUILD_INTERVAL; }
  }
}
// Ein-Knopf-Box: alle freien Kanten der aktuellen Kachel
function buildBox(f) {
  const tx = tileOf(f.x), ty = tileOf(f.y);
  let built = 0, need = 0;
  for (const [o, x, y] of WallSystem.tileEdges(tx, ty)) {
    if (WallSystem.get(o, x, y)) continue;
    need++;
    if (placeWall(f, o, x, y)) built++;
  }
  if (need > 0 && built === 0) buildFail(f, f.mats < CONFIG.WALL_COST && !f.unlimitedMats ? 'mats' : 'blocked');

// ---------------------------------------------------------------------
// Editsystem mit 3 gleich großen Feldern (Abschnitt 8)
// ---------------------------------------------------------------------
function canEdit(f, w) { return !w.indestructible && w.team === f.team; }
// Nur die Wand direkt vor dem Kämpfer: erster Wandkörper (inkl. offener Felder) auf dem Strahl in Zielrichtung.
// Wände dahinter können so nie bearbeitet werden.
function frontWall(f, ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang), range = CONFIG.EDIT_RANGE * TILE;
  const tx = tileOf(f.x), ty = tileOf(f.y);
  let best = null, bt = range;
  const consider = (w) => {
    if (!w) return;
    const t = Physics.rayRect(f.x, f.y, dx, dy, WallSystem.fullRect(w.orient, w.gx, w.gy));
    if (t < bt) { bt = t; best = w; }
  };
  for (let gx = tx - 2; gx <= tx + 2; gx++) for (let gy = ty - 2; gy <= ty + 3; gy++) consider(WallSystem.get('H', gx, gy));
  for (let gx = tx - 2; gx <= tx + 3; gx++) for (let gy = ty - 2; gy <= ty + 2; gy++) consider(WallSystem.get('V', gx, gy));
  return best;
}
function findEditTarget(f, px, py) {
  return frontWall(f, Math.atan2(py - f.y, px - f.x));
}
function startEdit(f) {
  const w = findEditTarget(f, f.pointerX, f.pointerY);
  if (!w) { if (f.isPlayer) Sfx.play('click', f.x, f.y, 0.35); return false; }

// Geräusch-Ereignisse: Position + Hörradius; Spieler-HUD und Bots bekommen dieselben Daten
const Noise = {

    for (const f of Match.fighters) {

// =====================================================================
// 8. AI – Bot-Gehirn, Wegfindung, Schwierigkeitsprofile
//    Bots steuern ihren Kämpfer ausschließlich über dieselbe Absicht wie
//    der Spieler: simulierte Maus mit Drehgrenze, gleiche Bau-/Edit-Regeln.
// =====================================================================
const AI = {
  // A* auf dem Kachelraster. Geschlossene Wände: teuer, aber passierbar (3 + HP/50)
  _g: new Float32Array(GW * GH), _f: new Float32Array(GW * GH), _came: new Int16Array(GW * GH), _closed: new Uint8Array(GW * GH),
  edgeBetween(ax, ay, bx, by) {
    if (bx === ax + 1) return ['V', ax + 1, ay];
    if (bx === ax - 1) return ['V', ax, ay];
    if (by === ay + 1) return ['H', ax, ay + 1];
    return ['H', ax, ay];
  },
  edgeCost(w) {
    if (!w) return 1;
    if (w.indestructible) return Infinity;
    if (w.segments.some(s => !s)) return 1.3;
    return 3 + w.hp / 50;
  },
  findPath(sx, sy, gx, gy) {
    sx = clamp(sx, 0, GW - 1); sy = clamp(sy, 0, GH - 1); gx = clamp(gx, 0, GW - 1); gy = clamp(gy, 0, GH - 1);
    const N = GW * GH, g = this._g, fS = this._f, came = this._came, closed = this._closed;
    g.fill(Infinity); fS.fill(Infinity); came.fill(-1); closed.fill(0);
    const s = sy * GW + sx, goal = gy * GW + gx;
    g[s] = 0; fS[s] = Math.abs(gx - sx) + Math.abs(gy - sy);
    const open = [s];
    while (open.length) {
      let bi = 0; for (let i = 1; i < open.length; i++) if (fS[open[i]] < fS[open[bi]]) bi = i;
      const cur = open[bi]; open[bi] = open[open.length - 1]; open.pop();
      if (cur === goal) break;
      if (closed[cur]) continue;
      closed[cur] = 1;
      const cx = cur % GW, cy = (cur / GW) | 0;
      for (let k = 0; k < 4; k++) {
        const nx = cx + (k === 0 ? 1 : k === 1 ? -1 : 0), ny = cy + (k === 2 ? 1 : k === 3 ? -1 : 0);
        if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
        const ni = ny * GW + nx; if (closed[ni]) continue;
        const e = this.edgeBetween(cx, cy, nx, ny);
        const c = this.edgeCost(WallSystem.get(e[0], e[1], e[2]));
        if (!isFinite(c)) continue;
        const ng = g[cur] + c;
        if (ng < g[ni]) { g[ni] = ng; came[ni] = cur; fS[ni] = ng + Math.abs(gx - nx) + Math.abs(gy - ny); open.push(ni); }
      }
      if (open.length > N * 4) break;
    }
    if (came[goal] < 0 && goal !== s) return null;
    const path = [];
    let c = goal;
    while (c !== -1 && c !== undefined) { path.push({ x: c % GW, y: (c / GW) | 0 }); if (c === s) break; c = came[c]; }
    path.reverse();
    if (path.length === 0 || path[0].x !== sx || path[0].y !== sy) return null;
    return path;
  }
};

class Brain {

    let idx = -1;
    for (let i = 0; i < P.length; i++) if (P[i].x === ctx && P[i].y === cty) { idx = i; break; }
    if (idx < 0) { this.path = null; return this.dirTo((P[0].x + 0.5) * TILE, (P[0].y + 0.5) * TILE); }
    if (idx >= P.length - 1) { this.gap = null; return this.dirTo(gx, gy, 6); }
    const nx = P[idx + 1].x, ny = P[idx + 1].y;
    const e = AI.edgeBetween(ctx, cty, nx, ny);
    const w = WallSystem.get(e[0], e[1], e[2]);
    const tcx = (nx + 0.5) * TILE, tcy = (ny + 0.5) * TILE;
    const last = idx + 1 === P.length - 1;
    if (!w) {
      this.gap = null;
      // freie Kante: Richtung Mitte der nächsten Kachel, dabei auf die Kantenmitte ausrichten
      const m = WallSystem.edgeMid(e[0], e[1], e[2]);
      const along = e[0] === 'H' ? Math.abs(f.x - m.x) : Math.abs(f.y - m.y);
      if (along > TILE / 2 - f.r - 4) return this.dirTo(m.x, m.y);
      return last ? this.dirTo(gx, gy, 6) : this.dirTo(tcx, tcy);
    }
    // Wand mit offenem Feld: durch die Lücke
    let gi = -1;
    if (!w.segments[1]) gi = 1; else if (!w.segments[0]) gi = 0; else if (!w.segments[2]) gi = 2;
    if (gi >= 0 && !w.pending) {
      const c = WallSystem.segCenter(w, gi);
      const nX = e[0] === 'V' ? Math.sign(nx - ctx) : 0, nY = e[0] === 'H' ? Math.sign(ny - cty) : 0;
      const off = f.r + 10;
      const ax = c.x - nX * off, ay = c.y - nY * off;
      const along = e[0] === 'H' ? Math.abs(f.x - c.x) : Math.abs(f.y - c.y);
      if (along > 3.5) return this.dirTo(ax, ay, 0);
      return this.dirTo(c.x + nX * off * 2, c.y + nY * off * 2, 0);
    }
    // Geschlossene Wand im Weg
    this.blocked = w;
    const mid = { x: w.cx, y: w.cy };
    const nX = e[0] === 'V' ? Math.sign(nx - ctx) : 0, nY = e[0] === 'H' ? Math.sign(ny - cty) : 0;
    const stand = { x: mid.x - nX * (f.r + 26), y: mid.y - nY * (f.r + 26) };
    this.handleBlocked(w, stand);
    if (dist(f.x, f.y, stand.x, stand.y) > 8) return this.dirTo(stand.x, stand.y, 0);
    return null;
  }
  dirTo(x, y, arrive) {
    const f = this.f, dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy);
    if (d < (arrive === undefined ? 4 : arrive) || d < 0.5) return null;
    const k = d < 20 ? Math.max(0.35, d / 20) : 1;
    return { x: dx / d * k, y: dy / d * k };
  }
  handleBlocked(w, stand) {
    const f = this.f;
    if (this.task) return;
    const d = dist(f.x, f.y, w.cx, w.cy);
    if (canEdit(f, w) && d < CONFIG.EDIT_RANGE * TILE * 0.9) {
      // Eigene Wand: unterwegs aufeditieren (Mitte öffnen)
      this.task = { type: 'openWall', wall: w, seg: 1, phase: 'aim', t: 0, edits: true, stationary: true };
    } else if (!canEdit(f, w)) {
      // Fremde Wand: zerschießen (Spitzhacke, wenn direkt davor und wenig Material)
      const close = d < f.r + 40;
      const slot = close && f.mats < 200 ? 3 : (close && f.ws[0].mag > 0 ? 0 : 1);
      this.wantSlot(slot);
      const R = w.rects[0];
      const tx = R ? (R.x0 + R.x1) / 2 : w.cx, ty = R ? (R.y0 + R.y1) / 2 : w.cy;
      this.aimAt(tx, ty); this.wantFire = true; this.fireTol = 8 * DEG;
    }
  }

  // --- Zustände ---
  actPassive(dt) {
    // Passiver Zielbot im Training: läuft ruhig in seiner Box umher, schießt und baut nicht
    const f = this.f;
    if (!this.wander || dist(f.x, f.y, this.wander.x, this.wander.y) < 10 || Math.random() < 0.004) {
      const b = f.homeBox || { x: tileOf(f.x), y: tileOf(f.y) };
      this.wander = { x: (b.x + rand(0.3, 1.7)) * TILE, y: (b.y + rand(0.3, 1.7)) * TILE };
    }
    this.moveDir = this.dirTo(this.wander.x, this.wander.y, 6);
    if (this.moveDir) { this.moveDir.x *= 0.45; this.moveDir.y *= 0.45; }
  }
  actSearch() {
    const f = this.f, now = this.now();
    const m = this.target ? this.mem.get(this.target.id) : null;
    let goal = null;
    // Letzte bekannte Position bzw. Geräusch erreicht, aber niemand da → vergessen (sonst drückt er gegen eine Wand)
    if (m && m.conf > 0.05 && !m.visible && dist(f.x, f.y, m.x, m.y) < TILE * 0.6) { m.c0 = 0; m.conf = 0; }
    if (this.noise && dist(f.x, f.y, this.noise.x, this.noise.y) < TILE * 0.6) this.noise = null;
    if (m && m.conf > 0.05) goal = { x: m.x, y: m.y };
    else if (this.noise && now - this.noise.t < 4) goal = this.noise;
    else {
      const Z = Match.zone;
      if (!this.wander || dist(f.x, f.y, this.wander.x, this.wander.y) < TILE * 0.6) {
        const cx = Z.active ? Z.cx : ARENA_W / 2, cy = Z.active ? Z.cy : ARENA_H / 2;
        const r = Z.active ? Math.max(TILE, Z.r * 0.5) : TILE * 4;
        const a = Math.random() * Math.PI * 2, rr = Math.random() * r;
        this.wander = { x: clamp(cx + Math.cos(a) * rr, TILE, ARENA_W - TILE), y: clamp(cy + Math.sin(a) * rr, TILE, ARENA_H - TILE) };
      }
      goal = this.wander;
    }
    // Gegner bekannt, aber verdeckt, und der Bot steht in Deckung: eine Weile halten (auf Peek warten) statt loszulaufen
    if (m && m.conf > 0.15 && !m.visible && this.inCover() && this.holdT < this.holdMax) {
      this.holdT += CONFIG.FIXED_DT;
      this.wantSlot(this.combatSlot(dist(f.x, f.y, m.x, m.y)));
      this.aimAt(m.x, m.y);
      const cx = (tileOf(f.x) + 0.5) * TILE, cy = (tileOf(f.y) + 0.5) * TILE;
      this.moveDir = this.dirTo(cx, cy, TILE * 0.2);
      return;
    }
    if (!(m && m.conf > 0.15)) this.holdT = 0;
    this.moveTo(goal.x, goal.y);
    this.wantSlot(1);
    if (!this.blocked && m && m.conf > 0.05) this.aimAt(m.x, m.y);
  }
  actFight(dt) {
    const f = this.f, e = this.target; if (!e) { this.actSearch(); return; }
    const m = this.mem.get(e.id); if (!m) return;
    if (!m.visible) { this.actSearch(); return; }
    const d = dist(f.x, f.y, m.x, m.y);
    this.wantSlot(this.combatSlot(d));
    this.aimAtEnemy(e, m);
    this.wantFire = this.canShootNow(m);
    // seitlich ausweichen, Abstand halten
    this.strafeT -= dt;
    if (this.strafeT <= 0) { this.strafeT = rand(0.35, 1.1); if (Math.random() < 0.6) this.strafeDir *= -1; }
    const a = Math.atan2(m.y - f.y, m.x - f.x);
    const pref = (f.slot === 0 ? 1.6 : 4) * TILE / this.aggr;
    const radial = d > pref * 1.2 ? 0.6 : d < pref * 0.6 ? -0.5 : 0;
    const st = this.p.strafe;
    if (this.inCover() && d > 2.5 * TILE) {
      // In Deckung: nur innerhalb der Kachel seitlich bewegen
      const cx = (tileOf(f.x) + 0.5) * TILE, cy = (tileOf(f.y) + 0.5) * TILE;
      const px = cx + Math.cos(a + Math.PI / 2) * this.strafeDir * TILE * 0.22 * st, py = cy + Math.sin(a + Math.PI / 2) * this.strafeDir * TILE * 0.22 * st;
      this.moveDir = this.dirTo(px, py, 4); this.wantMove = false;
      return;
    }
    this.moveDir = { x: Math.cos(a) * radial + Math.cos(a + Math.PI / 2) * this.strafeDir * st, y: Math.sin(a) * radial + Math.sin(a + Math.PI / 2) * this.strafeDir * st };
    const ml = Math.hypot(this.moveDir.x, this.moveDir.y); if (ml > 1) { this.moveDir.x /= ml; this.moveDir.y /= ml; }
    this.wantMove = ml > 0.2;
  }
  actCover(dt) {
    const f = this.f, now = this.now(), e = this.target;
    const m = e ? this.mem.get(e.id) : null;
    if (m && m.visible) { this.aimAtEnemy(e, m); this.wantFire = this.canShootNow(m) && !this.task; }
    if (this.coverDue >= 0 && now >= this.coverDue && !this.task) {
      this.coverDue = -1;
      if (f.hp + f.shield < CONFIG.BOT.COVER_EHP && now - this.lastBoxT > 0.5) { this.it.box = true; this.lastBoxT = now; return; }
      if (m) {
        const edges = this.edgesFacing(m.x, m.y);
        if (edges.length) {
          const first = edges[0];
          const w = WallSystem.get(first.o, first.gx, first.gy);
          if (w && canEdit(f, w) && w.segments.some(s => !s) && !w.editState && !w.pending) {
            this.task = { type: 'reset', wall: w, phase: 'aim', t: 0, edits: true };
          } else {
            const list = edges.filter(ed => !WallSystem.get(ed.o, ed.gx, ed.gy)).slice(0, this.p.turbo ? 2 : 1);
            if (list.length) this.task = { type: 'build', edges: list, i: 0, t: 0 };
          }
        }
      }
    }
    // kleine Ausweichbewegung zur Kachelmitte
    const cx = (tileOf(f.x) + 0.5) * TILE, cy = (tileOf(f.y) + 0.5) * TILE;
    this.moveDir = this.dirTo(cx, cy, 10);
  }
  // Kanten der aktuellen Kachel, sortiert nach Ausrichtung zum Gegner
  edgesFacing(x, y) {
    const f = this.f, tx = tileOf(f.x), ty = tileOf(f.y);
    const dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy) || 1;
    const c = [{ o: 'H', gx: tx, gy: ty, nx: 0, ny: -1 }, { o: 'H', gx: tx, gy: ty + 1, nx: 0, ny: 1 }, { o: 'V', gx: tx, gy: ty, nx: -1, ny: 0 }, { o: 'V', gx: tx + 1, gy: ty, nx: 1, ny: 0 }];
    for (const e of c) e.dot = (dx * e.nx + dy * e.ny) / d;
    return c.filter(e => e.dot > 0.15).sort((a, b) => b.dot - a.dot);
  }
  actPeek(dt) {
    const f = this.f, e = this.target, now = this.now();
    const m = e ? this.mem.get(e.id) : null;
    if (!this.task) {
      if (!m || !this.peekWall || now < this.peekCd) { this.actSearch(); return; }
      const w = this.peekWall;
      // Feldwahl: Mitte bei Gegner gegenüber, sonst Feld auf der Gegnerseite
      const along = w.orient === 'H' ? (m.x - w.x0) / TILE : (m.y - w.y0) / TILE;
      const seg = along < 0.15 ? 0 : along > 0.85 ? 2 : 1;
      const slot = this.combatSlot(dist(f.x, f.y, m.x, m.y));
      this.task = { type: 'peek', wall: w, seg, phase: 'prep', t: 0, edits: true, slot, stationary: true };
    }
    const w = this.task && this.task.wall;
    if (w && dist(f.x, f.y, w.cx, w.cy) > TILE * 0.7) this.moveDir = this.dirTo(w.cx, w.cy, TILE * 0.55);
  }
  actPush(dt) {
    const f = this.f, e = this.target, now = this.now();
    if (!e) { this.actSearch(); return; }
    const m = this.mem.get(e.id);
    if (!m || m.conf <= 0.02) { this.actSearch(); return; }
    const d = dist(f.x, f.y, m.x, m.y);
    this.moveTo(m.x, m.y);
    if (m.visible) {
      this.wantSlot(this.combatSlot(d));
      this.aimAtEnemy(e, m);
      this.wantFire = this.canShootNow(m);
      // seitliche Deckung beim Vorrücken (ab Schwer)
      if (this.p.lead && !this.task && now - this.lastSideCover > 1.6 && d > 2 * TILE && (f.mats >= 40 || f.unlimitedMats)) {
        this.lastSideCover = now;
        const edges = this.edgesFacing(m.x, m.y).filter(ed => ed.dot < 0.8 && !WallSystem.get(ed.o, ed.gx, ed.gy));
        if (edges.length) this.task = { type: 'build', edges: [edges[0]], i: 0, t: 0 };
      }
    } else if (!this.blocked) {
      this.wantSlot(d < 3 * TILE ? 0 : 1);
      this.aimAt(m.x, m.y);
    }
  }
  actHeal(dt) {
    const f = this.f, now = this.now();
    const tx = tileOf(f.x), ty = tileOf(f.y);
    const missing = WallSystem.tileEdges(tx, ty).filter(([o, x, y]) => !WallSystem.get(o, x, y)).length;
    if (missing > 0 && (f.mats >= CONFIG.WALL_COST || f.unlimitedMats) && now - this.lastBoxT > 0.4) { this.it.box = true; this.lastBoxT = now; }
    // Angegriffen während des Trinkens → abbrechen, Wände ersetzen
    if (f.heal && now - this.lastDamageT < 0.25 && missing > 0) { this.it.box = true; this.lastBoxT = now; }
    // Schwache Wand (< 50 HP) Richtung Gegner: zweite Reihe dahinter ist nicht möglich → zur Kachelmitte zurück
    const cx = (tx + 0.5) * TILE, cy = (ty + 0.5) * TILE;
    this.moveDir = this.dirTo(cx, cy, 8);
    if (!f.heal && missing === 0 || (!f.heal && f.mats < CONFIG.WALL_COST)) {
      if (f.mode !== 'weapon') this.it.slot = f.slot;
      else if (f.ready <= 0) this.it.heal = true;
    }
    for (const [o, x, y] of WallSystem.tileEdges(tx, ty)) {
      const w = WallSystem.get(o, x, y);
      if (w && w.hp < CONFIG.BOT.WALL_REPLACE_HP && !w.indestructible) this.lastDamageT = Math.max(this.lastDamageT, now - 1);
    }
  }
  actZone(dt) {
    const f = this.f, Z = Match.zone, e = this.target;
    this.moveTo(Z.cx, Z.cy);
    const m = e ? this.mem.get(e.id) : null;
    if (m && m.visible) { this.wantSlot(this.combatSlot(dist(f.x, f.y, m.x, m.y))); this.aimAtEnemy(e, m); this.wantFire = this.canShootNow(m); }
    else this.wantSlot(1);
  }
  actFarm(dt) {
    const f = this.f;
    const tx = tileOf(f.x), ty = tileOf(f.y);
    const own = new Set(WallSystem.tileEdges(tx, ty).map(([o, x, y]) => edgeKey(o, x, y)));
    let best = null, bd = 7 * TILE;
    for (const w of WallSystem.list) {
      if (w.indestructible || w.team !== f.team || own.has(w.key) || w.editState) continue;
      const d = dist(f.x, f.y, w.cx, w.cy);
      if (d < bd) { bd = d; best = w; }
    }
    if (!best) {
      // ENTSCHEIDUNG: Keine fremde eigene Wand → auch Wände der aktuellen Kachel, die nicht zum Gegner zeigen
      for (const w of WallSystem.list) if (!w.indestructible && w.team === f.team && own.has(w.key)) { best = w; break; }
    }
    if (!best) { this.actSearch(); return; }
    const side = best.orient === 'H' ? { x: 0, y: f.y < best.cy ? -1 : 1 } : { x: f.x < best.cx ? -1 : 1, y: 0 };
    const sx = best.cx + side.x * (f.r + 22), sy = best.cy + side.y * (f.r + 22);
    if (dist(f.x, f.y, sx, sy) > 10) this.moveTo(sx, sy);
    if (dist(f.x, f.y, best.cx, best.cy) < f.r + 50) {
      this.wantSlot(3);
      const R = best.rects[0];
      this.aimAt(R ? (R.x0 + R.x1) / 2 : best.cx, R ? (R.y0 + R.y1) / 2 : best.cy);
      this.wantFire = true; this.fireTol = 10 * DEG;
    }
  }

  // --- Aufgaben: Bauen, Edit-Peek, Wand öffnen, Reset ---
  runTask(dt) {
    const f = this.f, it = this.it, t = this.task, now = this.now();
    t.t += dt;
    if (t.t > CONFIG.BOT.TASK_TIMEOUT + (t.type === 'peek' ? 1.2 : 0)) { this.abortTask(); return; }
    if (t.wall && t.wall.dead) { this.abortTask(); return; }
    if (t.type === 'build') {
      const ed = t.edges[t.i];
      if (!ed || WallSystem.get(ed.o, ed.gx, ed.gy)) { t.i++; if (t.i >= t.edges.length) { this.task = null; if (f.mode === 'build') it.slot = f.slot; } return; }
      if (f.mode !== 'build') { it.buildToggle = true; return; }
      const mid = WallSystem.edgeMid(ed.o, ed.gx, ed.gy);
      this.aimAt(mid.x, mid.y);
      const pv = f.buildPreview;
      const hit = pv && pv.o === ed.o && pv.gx === ed.gx && pv.gy === ed.gy;
      if (hit && pv.valid) {
        if (this.p.turbo && t.i > 0) it.fire = true; else it.firePressed = true;
        it.fire = true;
      } else if (hit && !pv.valid) { t.i++; }
      return;
    }
    if (t.type === 'peek' || t.type === 'openWall' || t.type === 'reset') {
      const w = t.wall;
      const segPoint = (i) => {
        const c = WallSystem.segCenter(w, i);
        const o = 3;
        return w.orient === 'H' ? { x: c.x, y: c.y + (f.y < w.y0 ? -o : o) } : { x: c.x + (f.x < w.x0 ? -o : o), y: c.y };
      };
      const ptrSeg = () => WallSystem.fieldAt(w, f.x + Math.cos(this.aimAng) * this.pointerDist, f.y + Math.sin(this.aimAng) * this.pointerDist);
      if (t.phase === 'prep') {
        // Waffe vorher wählen, damit nach dem Edit sofort geschossen werden kann
        if (f.mode === 'weapon' && f.slot !== t.slot) { it.slot = t.slot; return; }
        t.phase = 'aim';
      }
      if (t.phase === 'aim') {
        const target = t.type === 'reset' ? 1 : t.seg;
        const pt = segPoint(target); this.aimAt(pt.x, pt.y);
        if (f.mode === 'build') { it.slot = f.slot; return; }
        if (ptrSeg() === target && Math.abs(this.aimVel) < 25) {
          it.editPressed = true; t.phase = t.type === 'reset' ? 'release' : 'select';
        }
        return;
      }
      if (t.phase === 'select') {
        const pt = segPoint(t.seg); this.aimAt(pt.x, pt.y);
        if (f.mode !== 'edit' || !f.edit || f.edit.wall !== w) { this.abortTask(); return; }
        if (ptrSeg() === t.seg) {
          if (!w.editState.selected[t.seg]) it.firePressed = true, it.fire = true;
          t.phase = 'release';
        }
        return;
      }
      if (t.phase === 'release') {
        const pt = segPoint(t.type === 'reset' ? 1 : t.seg); this.aimAt(pt.x, pt.y);
        it.editReleased = true;
        if (t.type === 'peek') { t.phase = 'shoot'; t.shootT = 0; t.shootDur = rand(CONFIG.BOT.PEEK_SHOOT_MIN, CONFIG.BOT.PEEK_SHOOT_MAX); }
        else if (t.type === 'openWall') { t.phase = 'wait'; t.t = Math.min(t.t, CONFIG.BOT.TASK_TIMEOUT - 0.4); }
        else this.task = null;
        return;
      }
      if (t.phase === 'wait') { if (!w.pending) this.task = null; return; }
      if (t.phase === 'shoot') {
        t.shootT += dt;
        const e = this.target, m = e ? this.mem.get(e.id) : null;
        if (m) { this.aimAtEnemy(e, m); this.wantFire = this.canShootNow(m) || (!m.visible && m.conf > 0.35 && t.shootT > CONFIG.EDIT_APPLY_TIME); this.fireTol = m.visible ? 0 : 6 * DEG; }
        if (t.shootT >= t.shootDur + CONFIG.EDIT_APPLY_TIME) { t.phase = 'resetAim'; }
        return;
      }
      if (t.phase === 'resetAim') {
        const pt = segPoint(t.seg === 1 ? 0 : 1); this.aimAt(pt.x, pt.y);
        if (ptrSeg() >= 0 && !w.pending) { it.editPressed = true; t.phase = 'resetRelease'; }
        return;
      }
      if (t.phase === 'resetRelease') {
        it.editReleased = true;
        this.task = null;
        this.peekCount++;
        const dbl = this.p.doublePeek && this.peekCount % 2 === 1 && Math.random() < 0.6;
        this.peekCd = this.now() + (dbl ? 0.3 : CONFIG.BOT.PEEK_COOLDOWN + rand(0, 1.2) / Math.max(0.3, this.p.peek));
        return;
      }
    }
  }
}

// =====================================================================
// 9. Match – Runden, Zone, Punkte, Statistik, Modi
// =====================================================================
const MODES = {
  duel: { label: 'Duell (1 gegen 1)' },
  outnumber: { label: 'Überzahl (1 gegen 2)' },
  team: { label: 'Team (2 gegen 2)' }
};
const Match = {
  mode: 'duel', difficulty: 'medium', roundsToWin: CONFIG.ROUNDS_TO_WIN, training: false, trainingBot: true,
  fighters: [], player: null, round: 0, scores: [0, 0], phase: 'idle', phaseT: 0, time: 0, roundTime: 0,
  zone: { active: false, r: 0, cx: ARENA_W / 2, cy: ARENA_H / 2, r0: 0, r1: 0 },
  killfeed: [], roundResult: null, autoplay: false, lastBeep: -1, names: [],

  playerTeam() { return this.player ? this.player.team : 0; },
  viewer() {
    const p = this.player;
    if (!p) return null;
    if (p.alive) return p;
    // Nach dem Tod: lebendes Teammitglied, sonst der Gegner, der getroffen hat
    const mate = this.fighters.find(f => f.alive && f.team === p.team);
    if (mate) return mate;
    const killer = this.fighters.find(f => f.id === p.killerId && f.alive);
    return killer || this.fighters.find(f => f.alive) || p;
  },
  start(opts) {
    this.mode = opts.mode || 'duel';
    this.difficulty = opts.difficulty || 'medium';
    this.roundsToWin = opts.rounds || CONFIG.ROUNDS_TO_WIN;
    this.training = !!opts.training;
    this.trainingBot = opts.trainingBot !== false;
    this.autoplay = !!opts.autoplay;
    this.fighters = [];
    const names = BOT_NAMES.slice().sort(() => Math.random() - 0.5);
    let id = 1;
    const P = createFighter({ id: id++, team: 0, name: 'Du', isPlayer: true, color: COLORS.player });
    P.editRelease = settings.editRelease;
    this.fighters.push(P); this.player = P;
    if (this.autoplay) { P.isBot = true; P.brain = new Brain(P, opts.autoplayLevel || 'hard'); P.editRelease = true; }
    const addBot = (team, color, passive) => {
      const f = createFighter({ id: id++, team, name: names.pop() || ('Bot ' + id), isBot: true, color });
      f.brain = new Brain(f, this.difficulty, { passive });
      f.passive = !!passive;
      f.turboAllowed = BOT_PROFILES[this.difficulty].turbo;
      this.fighters.push(f); return f;
    };
    if (this.training) {
      P.unlimitedMats = true;
      if (this.trainingBot) { const d = addBot(1, COLORS.enemy, true); d.name = 'Zielbot'; }
    } else if (this.mode === 'duel') addBot(1, COLORS.enemy);
    else if (this.mode === 'outnumber') { addBot(1, COLORS.enemy); addBot(1, COLORS.enemy); }
    else if (this.mode === 'team') { addBot(0, COLORS.mate); addBot(1, COLORS.enemy); addBot(1, COLORS.enemy); }
    for (const f of this.fighters) { f.stats = newStats(); }
    this.round = 0; this.scores = [0, 0]; this.time = 0; this.killfeed = [];
    UI.editTimes = [];
    this.startRound();
  },
  // Boxen: 1 gegen 1 im Abstand von 6 Kacheln gespiegelt, sonst gleichmäßig im Kreis
  layoutBoxes(n) {
    const out = [];
    if (n <= 2) {
      const half = CONFIG.BOX_DISTANCE / 2, c = GW / 2;
      const horiz = Math.random() < 0.5;
      const a = { x: c - half - 1, y: c - 1 }, b = { x: c + half - 1, y: c - 1 };
      if (!horiz) { [a.x, a.y] = [a.y, a.x]; [b.x, b.y] = [b.y, b.x]; }
      if (Math.random() < 0.5) out.push(a, b); else out.push(b, a);
      return out;
    }
    const rr = n === 3 ? 4 : 4.5;
    const off = n === 4 ? (Math.random() < 0.5 ? 0 : Math.PI / 4) : Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      const a = off + i / n * Math.PI * 2;
      out.push({ x: clamp(Math.round(GW / 2 + Math.cos(a) * rr - 1), 1, GW - 3), y: clamp(Math.round(GH / 2 + Math.sin(a) * rr - 1), 1, GH - 3) });
    }
    return out;
  },
  // Kisten: punktsymmetrisch, jede Runde etwas anders
  // Häuser: Rechteck aus Ziegelwänden, eine Tür (offene Kante) und 1–2 Fenster (mittleres Feld offen), Holzboden innen.
  // Jedes Haus bekommt ein punktgespiegeltes Gegenstück, damit es fair bleibt.
  placeHouses(boxes) {
    this.houses = [];
    const pairs = randInt(CONFIG.HOUSE_PAIRS_MIN, CONFIG.HOUSE_PAIRS_MAX);
    const hit = (a, b, m) => a.x - m < b.x + b.w && b.x - m < a.x + a.w && a.y - m < b.y + b.h && b.y - m < a.y + a.h;
    const blocked = boxes.map(b => ({ x: b.x, y: b.y, w: 2, h: 2 }));
    let placed = 0;
    for (let tries = 0; tries < 300 && placed < pairs; tries++) {
      const w = randInt(CONFIG.HOUSE_SIZE_MIN, CONFIG.HOUSE_SIZE_MAX), h = randInt(CONFIG.HOUSE_SIZE_MIN, CONFIG.HOUSE_SIZE_MAX);
      if (w * h > 6) continue;
      const a = { x: randInt(1, GW - 1 - w), y: randInt(1, GH - 1 - h), w, h };
      const b = { x: GW - a.x - w, y: GH - a.y - h, w, h };
      if (hit(a, b, 2)) continue;
      if (blocked.some(r => hit(a, r, 2) || hit(b, r, 2)) || this.houses.some(r => hit(a, r, 1) || hit(b, r, 1))) continue;
      // Kanten des Hauses, Tür und Fenster zufällig
      const edges = [];
      for (let i = 0; i < w; i++) { edges.push(['H', a.x + i, a.y]); edges.push(['H', a.x + i, a.y + h]); }
      for (let j = 0; j < h; j++) { edges.push(['V', a.x, a.y + j]); edges.push(['V', a.x + w, a.y + j]); }
      const order = edges.map((e, i) => i).sort(() => Math.random() - 0.5);
      const door = order[0], windows = new Set(order.slice(1, 1 + randInt(1, 2)));
      const mirror = ([o, gx, gy]) => o === 'H' ? ['H', GW - 1 - gx, GH - gy] : ['V', GW - gx, GH - 1 - gy];
      for (const [k, e] of edges.entries()) {
        if (k === door) continue;
        for (const [o, gx, gy] of [e, mirror(e)]) {
          const wl = WallSystem.add(o, gx, gy, { team: -1, material: 'brick', maxHp: CONFIG.HOUSE_WALL_HP, instant: true });
          if (wl && windows.has(k)) WallSystem.setSegments(wl, [true, false, true]);
        }
      }
      this.houses.push(a, b);
      placed++;
    }
  },
  placeCrates(boxes) {
    const pairs = randInt(CONFIG.CRATES_MIN, CONFIG.CRATES_MAX) >> 1;
    const used = new Set();
    const nearBox = (x, y) => boxes.some(b => x >= b.x - 1 && x <= b.x + 2 && y >= b.y - 1 && y <= b.y + 2) ||
      (this.houses || []).some(r => x >= r.x - 1 && x <= r.x + r.w && y >= r.y - 1 && y <= r.y + r.h);
    const free = (x, y) => WallSystem.tileEdges(x, y).every(([o, a, b]) => !WallSystem.get(o, a, b));
    let placed = 0;
    for (let tries = 0; tries < 200 && placed < pairs; tries++) {
      const x = randInt(2, GW - 3), y = randInt(2, GH - 3), mx = GW - 1 - x, my = GH - 1 - y;
      if (x === mx && y === my) continue;
      if (Math.abs(x - mx) + Math.abs(y - my) < 2) continue;
      if (nearBox(x, y) || nearBox(mx, my) || used.has(x + ',' + y) || used.has(mx + ',' + my)) continue;
      if (!free(x, y) || !free(mx, my)) continue;
      WallSystem.buildCrate(x, y); WallSystem.buildCrate(mx, my);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) { used.add((x + dx) + ',' + (y + dy)); used.add((mx + dx) + ',' + (my + dy)); }
      placed++;

  },
  startRound() {
    WallSystem.reset();
    WallSystem.buildBorders();
    const boxes = this.layoutBoxes(this.fighters.length);
    this.fighters.forEach((f, i) => {
      const b = boxes[i];
      f.homeBox = b;
      resetFighterForRound(f, (b.x + 1) * TILE, (b.y + 1) * TILE);
      if (this.training && f.isPlayer) f.unlimitedMats = true;
      WallSystem.buildBox(b.x, b.y, f);
      if (f.brain) { f.brain.reset(); f.brain.aimAng = f.aim; }
    });
    this.placeHouses(boxes);
    this.placeCrates(boxes);
    // ENTSCHEIDUNG: Die Startboxen sind öffentlich bekannt (der Spieler sieht sie in der Gedächtnis-Ansicht). Bots bekommen
    // deshalb zu Rundenbeginn dieselbe ungenaue Information über die gegnerischen Boxen, nicht mehr.
    for (const f of this.fighters) if (f.brain) for (const e of this.fighters) if (e.team !== f.team) {
      const m = f.brain.memOf(e); m.x = e.x; m.y = e.y; m.t = this.time + (this.training ? 0 : CONFIG.ROUND_COUNTDOWN); m.c0 = 0.7; m.conf = 0.7;
    }

  },
  update(dt) {
    this.time += dt; this.phaseT += dt;

      const left = Math.ceil(CONFIG.ROUND_COUNTDOWN - this.phaseT);
      if (left !== this.lastBeep && left > 0) { this.lastBeep = left; Sfx.play('beep'); }
      if (this.phaseT >= CONFIG.ROUND_COUNTDOWN) { this.phase = 'combat'; this.phaseT = 0; Sfx.play('go'); }
    } else if (this.phase === 'combat') {
      this.roundTime += dt;
      if (!this.training) this.updateZone(dt);
    }
    // Absichten sammeln (Spieler aus der Eingabe, Bots aus dem Gehirn), dann in ID-Reihenfolge anwenden
    for (const f of this.fighters) {
      f.px = f.x; f.py = f.y;
      if (!f.alive) continue;
      if (f.brain) f.brain.tick(dt);
      else if (f.isPlayer) playerIntent(f);
    }
    if (this.player && !this.player.brain && this.player.intent.trainReset && this.training) { this.resetTraining(); return; }
    for (const f of this.fighters) updateFighter(f, f.intent, dt);
    Physics.separateFighters();
    WallSystem.update(dt);
    Entities.update(dt);
    Noise.update(dt);
    for (let i = this.killfeed.length - 1; i >= 0; i--) { this.killfeed[i].life -= dt; if (this.killfeed[i].life <= 0) this.killfeed.splice(i, 1); }
    if (this.training) this.updateTraining(dt);
    else if (this.phase === 'combat') this.checkRoundEnd();
    else if (this.phase === 'roundEnd' && this.phaseT >= CONFIG.ROUND_END_TIME) this.nextRound();
  },
  updateZone(dt) {
    const Z = this.zone, t = this.roundTime - CONFIG.ZONE_START_DELAY;
    if (t < 0) return;
    Z.active = true;
    Z.r = lerp(Z.r0, Z.r1, clamp(t / CONFIG.ZONE_SHRINK_TIME, 0, 1));
    for (const f of this.fighters) {
      if (!f.alive) continue;
      if (dist(f.x, f.y, Z.cx, Z.cy) > Z.r) {
        f.outsideT += dt;
        const dps = f.outsideT > CONFIG.ZONE_LATE_AFTER ? CONFIG.ZONE_DPS_LATE : CONFIG.ZONE_DPS;
        f.zoneAcc += dps * dt;
        if (f.zoneAcc >= 1) {
          const d = Math.floor(f.zoneAcc); f.zoneAcc -= d;
          applyDamage(f, d, null, { direct: true });
          if (f.isPlayer) Entities.number(f.x, f.y, d, COLORS.zone);
        }
      } else f.outsideT = 0;
    }
  },
  checkRoundEnd() {
    const alive = new Set(this.fighters.filter(f => f.alive).map(f => f.team));
    if (alive.size > 1) return;
    if (alive.size === 0) {
      // Gleichzeitiger Tod: Runde zählt für niemanden und startet sofort neu
      UI.toast('Unentschieden – Runde wird wiederholt');
      this.round--;
      this.startRound();
      return;
    }
    const winner = [...alive][0];
    this.scores[winner]++;
    const won = winner === this.playerTeam();
    if (won) bests.roundsWon++;
    const P = this.player;
    this.roundResult = { won, winner, dmg: Math.round(P.roundStats.dmgDealt), kills: P.roundStats.kills, walls: P.roundStats.wallsBuilt, edits: P.roundStats.edits };
    this.phase = 'roundEnd'; this.phaseT = 0;
    Sfx.play(won ? 'roundWin' : 'roundLose');
  },
  nextRound() {
    if (this.scores[0] >= this.roundsToWin || this.scores[1] >= this.roundsToWin) { this.endMatch(false); return; }
    this.startRound();
  },
  endMatch(surrender) {
    this.phase = 'matchEnd';
    const P = this.player, s = P.stats;
    const won = !surrender && this.scores[this.playerTeam()] >= this.roundsToWin;
    if (!this.training && !this.autoplay) {
      bests.matchesPlayed++; if (won) bests.matchesWon++;
      bests.maxKills = Math.max(bests.maxKills, s.kills);
      bests.maxDamage = Math.max(bests.maxDamage, Math.round(s.dmgDealt));
      if (s.shots >= 10) bests.bestAccuracy = Math.max(bests.bestAccuracy, Math.round(s.hits / s.shots * 100));
    }
    bests.wallsBuilt += s.wallsBuilt;
    if (s.fastestEdit && (!bests.fastestEdit || s.fastestEdit < bests.fastestEdit)) bests.fastestEdit = s.fastestEdit;
    saveBests();
    Sfx.play(won ? 'matchWin' : 'roundLose');
    UI.showEnd(won, surrender);
  },
  // Training: Zielbot respawnt, T setzt die Arena zurück
  updateTraining(dt) {
    for (const f of this.fighters) {
      if (f.alive) continue;
      f.respawnT += dt;
      if (f.respawnT >= CONFIG.TRAINING_RESPAWN) {
        f.respawnT = 0;
        const b = f.homeBox;
        resetFighterForRound(f, (b.x + 1) * TILE, (b.y + 1) * TILE);
        if (f.isPlayer) f.unlimitedMats = true;
        for (const [o, x, y] of WallSystem.boxEdges(b.x, b.y)) if (!WallSystem.get(o, x, y)) WallSystem.add(o, x, y, { ownerId: f.id, team: f.team, instant: true });
        if (f.brain) f.brain.reset();
      }
    }
  },
  resetTraining() {
    const st = this.fighters.map(f => f.stats);
    this.startRound();
    this.fighters.forEach((f, i) => { f.stats = st[i]; });
    UI.toast('Arena zurückgesetzt');
  }
};

const Renderer = {
  canvas: null, ctx: null, w: 1, h: 1, dpr: 1, scale: 1, zoomTiles: CONFIG.ZOOM_TILES,
  cam: { x: ARENA_W / 2, y: ARENA_H / 2 }, shakeAmt: 0, shx: 0, shy: 0, portrait: false, menuT: 0,
  fps: 60, fpsAcc: 0, fpsN: 0,
  init(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    const r = () => this.resize();
    window.addEventListener('resize', r); window.addEventListener('orientationchange', () => setTimeout(r, 120));
    this.resize();
  },
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.DPR_MAX, this.dprCap || 9);
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = Math.round(this.w * this.dpr); this.canvas.height = Math.round(this.h * this.dpr);
    const wasPortrait = this.portrait;
    this.portrait = this.h > this.w && Math.min(this.w, this.h) < 820;

  },
  zoomRange() { return this.portrait ? [CONFIG.ZOOM_MIN_PORTRAIT, CONFIG.ZOOM_MAX_PORTRAIT] : [CONFIG.ZOOM_MIN, CONFIG.ZOOM_MAX]; },
  setZoom(z) { const [a, b] = this.zoomRange(); this.zoomTiles = clamp(z, a, b); },
  shake(a) { if (settings.shake) this.shakeAmt = Math.max(this.shakeAmt, a * (settings.reducedFx ? 0.5 : 1)); },

  worldToScreen(x, y) { return { x: (x - this.cam.x) * this.scale + this.w / 2 + this.shx, y: (y - this.cam.y) * this.scale + this.h / 2 + this.shy }; },

  // Hintergrund im Menü: langsam treibendes Raster mit Wänden

  // Wände: erst Schatten, dann Körper. Nicht sichtbare Wände zeigen den zuletzt gesehenen Zustand.

  drawWallLive(ctx, w) {
