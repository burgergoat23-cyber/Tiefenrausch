    if (P.mode === 'edit' && P.edit && P.edit.wall && P.edit.wall.editState && !Input.isTouchUi()) this.drawEditOverlay(ctx, P.edit.wall, P);
    // Touch: Ziellinie zeigt genau, wohin geschossen wird
    if (Input.isTouchUi() && P.mode === 'weapon') {
      const wpn = WEAPONS[P.slot], dx = Math.cos(P.aim), dy = Math.sin(P.aim);
      const maxT = wpn.melee ? P.r + wpn.reach : Math.min(wpn.range * TILE, 5 * TILE);
      const h = Physics.raycastWalls(P.rx, P.ry, dx, dy, maxT), t = h ? h.t : maxT;
      ctx.setLineDash([8, 7]); ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(P.rx + dx * (P.r + 6), P.ry + dy * (P.r + 6)); ctx.lineTo(P.rx + dx * t, P.ry + dy * t); ctx.stroke(); ctx.setLineDash([]);
    }
  },
  drawEditOverlay(ctx, w, P) {
    const sel = w.editState.selected, invalid = sel.every(Boolean);
    const Pl = { body: COLORS.wood, top: COLORS.woodLight };
    const thM = CONFIG.EDIT_DRAW_SCALE, gap = 2.5;
    const full = WallSystem.segRect(w, 0, thM), fullEnd = WallSystem.segRect(w, 2, thM);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 2;
    ctx.strokeRect(full.x0 - 3, full.y0 - 3, fullEnd.x1 - full.x0 + 6, fullEnd.y1 - full.y0 + 6);
    const hover = Input.isTouchUi() ? -1 : WallSystem.fieldAt(w, P.pointerX, P.pointerY);
    for (let i = 0; i < 3; i++) {
      const R = WallSystem.segRect(w, i, thM);
      let x = R.x0, y = R.y0, ww = R.x1 - R.x0, hh = R.y1 - R.y0;
      if (w.orient === 'H') { x += gap; ww -= gap * 2; } else { y += gap; hh -= gap * 2; }
      const open = !w.segments[i];
      const selCol = invalid ? '#ff4a4a' : COLORS.select;
      if (sel[i] && !open) {
        // wird entfernt: halbtransparent in Auswahlfarbe, gestreift
        ctx.fillStyle = invalid ? 'rgba(255,74,74,0.5)' : 'rgba(94,200,232,0.45)'; ctx.fillRect(x, y, ww, hh);
        ctx.save(); ctx.beginPath(); ctx.rect(x, y, ww, hh); ctx.clip();
        ctx.strokeStyle = selCol; ctx.lineWidth = 2; ctx.beginPath();
        for (let k = -40; k < 80; k += 7) { ctx.moveTo(x + k, y); ctx.lineTo(x + k + 30, y + 30); }
        ctx.stroke(); ctx.restore();
        ctx.strokeStyle = selCol; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, ww, hh);
      } else if (sel[i] && open) {
        // bereits offen: gestrichelter Umriss
        ctx.setLineDash([4, 3]); ctx.strokeStyle = selCol; ctx.lineWidth = 1.6; ctx.strokeRect(x, y, ww, hh); ctx.setLineDash([]);
      } else if (!sel[i] && open) {
        // wird geschlossen
        ctx.fillStyle = Pl.body; ctx.globalAlpha = 0.5; ctx.fillRect(x, y, ww, hh); ctx.globalAlpha = 1;
        ctx.strokeStyle = Pl.top; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, ww, hh);
      } else {
        ctx.fillStyle = Pl.body; ctx.fillRect(x, y, ww, hh);
        ctx.fillStyle = Pl.top; if (w.orient === 'H') ctx.fillRect(x, y, ww, 3); else ctx.fillRect(x, y, 3, hh);
      }
      if (i === hover) { ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.2; ctx.strokeRect(x - 1.5, y - 1.5, ww + 3, hh + 3); }
    }
  },
  drawDebugWorld(ctx) {
    // Sichtpolygon
    ctx.strokeStyle = 'rgba(255,255,0,0.5)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < Vision.n; i++) { if (i === 0) ctx.moveTo(Vision.px[i], Vision.py[i]); else ctx.lineTo(Vision.px[i], Vision.py[i]); }
    ctx.closePath(); ctx.stroke();
    // Wand-HP
    ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    for (const w of WallSystem.list) if (!w.indestructible && w.seen) ctx.fillText(Math.round(w.hp), w.cx, w.cy - 8);
    // Bots: Zustand, Punktzahlen, Zielpunkt, Pfad
    for (const f of Match.fighters) {
      const b = f.brain; if (!b || !f.alive) continue;
      if (b.path) {
        ctx.strokeStyle = 'rgba(45,226,200,0.6)'; ctx.lineWidth = 2; ctx.beginPath();
        b.path.forEach((p, i) => { const x = (p.x + 0.5) * TILE, y = (p.y + 0.5) * TILE; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
        ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,90,74,0.8)'; ctx.beginPath(); ctx.arc(f.intent.aimX, f.intent.aimY, 5, 0, Math.PI * 2); ctx.stroke();
      if (b.aimTarget) { ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(b.aimTarget.x, b.aimTarget.y); ctx.stroke(); }
      ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#ffeb7a'; ctx.textAlign = 'center';
      ctx.fillText(b.state.toUpperCase() + (b.task ? ' [' + b.task.type + ':' + (b.task.phase || b.task.i) + ']' : ''), f.x, f.y + f.r + 14);
      ctx.font = '9px monospace'; ctx.fillStyle = '#cfd8ea';
      const sc = Object.entries(b.scores).filter(e => e[1] > 0).map(e => e[0].slice(0, 4) + ':' + e[1].toFixed(2)).join(' ');
      ctx.fillText(sc, f.x, f.y + f.r + 26);
    }
  }
};

// ---------------------------------------------------------------------
// HUD
// ---------------------------------------------------------------------
const HUD = {
  draw(ctx, dt) {
    const R = Renderer, w = R.w, h = R.h, u = UI.scale(), P = Match.player;
    const touch = Input.isTouchUi();
    this.drawRings(ctx);
    R.drawVignette();
    // Schadensrichtung: roter Rand Richtung Quelle
    for (let i = UI.hurtFrom.length - 1; i >= 0; i--) {
      const hf = UI.hurtFrom[i]; hf.life -= dt; if (hf.life <= 0) { UI.hurtFrom.splice(i, 1); continue; }
      const a = Math.atan2(hf.y - P.y, hf.x - P.x), al = hf.life / CONFIG.HURT_INDICATOR_TIME;
      const cx = w / 2, cy = h / 2, rr = Math.min(w, h) * 0.42;
      ctx.strokeStyle = `rgba(255,40,40,${0.75 * al})`; ctx.lineWidth = 10 * u; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy, rr, a - 0.35, a + 0.35); ctx.stroke();
    }
    if (P.hurtT > 0) { ctx.fillStyle = `rgba(255,0,0,${P.hurtT * 0.35})`; ctx.fillRect(0, 0, w, h); }
    if (Match.zone.active && P.alive && dist(P.x, P.y, Match.zone.cx, Match.zone.cy) > Match.zone.r) {
      ctx.fillStyle = `rgba(155,92,255,${0.12 + 0.06 * Math.sin(Match.time * 6)})`; ctx.fillRect(0, 0, w, h);
    }
    if (P.alive && !P.isBot) this.drawCrosshair(ctx, u, touch);
    this.drawBars(ctx, u, touch);
    this.drawWeaponBar(ctx, u, touch);
    this.drawMats(ctx, u, touch);
    this.drawTop(ctx, u, touch);
    this.drawKillfeed(ctx, u, touch);
    this.drawProgress(ctx, u);
    if (Match.training) this.drawEditTimes(ctx, u, touch);
    if (!P.alive && Match.phase === 'combat') {
      const V = Match.viewer();
      this.text(ctx, Match.training ? 'Wiederbelebung …' : 'Ausgeschieden – Zuschauen: ' + (V ? V.name : ''), w / 2, h * 0.22, 18 * u, '#ffb3aa', 'center');
    }
    if (Match.phase === 'countdown') {
      const n = Math.ceil(CONFIG.ROUND_COUNTDOWN - Match.phaseT);
      const fr = (CONFIG.ROUND_COUNTDOWN - Match.phaseT) % 1;
      this.text(ctx, 'Runde ' + Match.round, w / 2, h * 0.3, 22 * u, '#cfd8ea', 'center');
      this.text(ctx, String(n), w / 2, h * 0.42, (70 + 30 * fr) * u, '#ffffff', 'center');
    } else if (Match.phase === 'combat' && Match.phaseT < 0.8 && !Match.training) {
      ctx.globalAlpha = 1 - Match.phaseT / 0.8; this.text(ctx, 'LOS!', w / 2, h * 0.42, 70 * u, COLORS.mate, 'center'); ctx.globalAlpha = 1;
    }
    if (Match.phase === 'roundEnd' && Match.roundResult) this.drawRoundEnd(ctx, u);
    UI.drawToasts(ctx, u);
    UI.drawHints(ctx, u, dt);
    if (touch) UI.drawTouch(ctx, u);
    if (Game.debug) this.drawDebug(ctx, u);
  },
  text(ctx, s, x, y, size, col, align, weight) {
    ctx.font = `${weight || 800} ${Math.round(size)}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, size / 7); ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineJoin = 'round';
    ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
  },
  panel(ctx, x, y, w, h, r) {
    ctx.fillStyle = 'rgba(20,24,18,0.72)'; ctx.strokeStyle = 'rgba(150,140,110,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r || 8); else ctx.rect(x, y, w, h); ctx.fill(); ctx.stroke();
  },
  crosshairPos(touch) {
    const P = Match.player;
    if (!touch) return { x: Input.mouse.x, y: Input.mouse.y };
    const d = P.mode === 'weapon' ? Math.min(3 * TILE, WEAPONS[P.slot].melee ? 60 : 3 * TILE) : dist(P.x, P.y, P.pointerX, P.pointerY);
    return Renderer.worldToScreen(P.rx + Math.cos(P.aim) * d, P.ry + Math.sin(P.aim) * d);
  },
  drawCrosshair(ctx, u, touch) {
    const P = Match.player, c = this.crosshairPos(touch);
    const x = c.x, y = c.y;
    ctx.lineCap = 'butt';
    const wpn = WEAPONS[P.slot];
    let gap = 6;
    if (P.mode === 'weapon' && !wpn.melee) {
      const d = Math.max(40, dist(Renderer.w / 2, Renderer.h / 2, x, y));
      gap = clamp(Math.tan(weaponSpread(P, wpn) / 2) * d, 5, 40);
    }
    const col = P.mode === 'edit' ? COLORS.select : P.mode === 'build' ? '#ffffff' : '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 4;
    const lines = (st, lw) => {
      ctx.strokeStyle = st; ctx.lineWidth = lw; ctx.beginPath();
      ctx.moveTo(x - gap - 8, y); ctx.lineTo(x - gap, y); ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + 8, y);
      ctx.moveTo(x, y - gap - 8); ctx.lineTo(x, y - gap); ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + 8);
      ctx.stroke();
    };
    lines('rgba(0,0,0,0.6)', 4); lines(col, 2);
    ctx.fillStyle = col; ctx.fillRect(x - 1, y - 1, 2, 2);
    if (UI.hitmark > 0) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5; ctx.beginPath();
      const a = 5, b = 12;
      ctx.moveTo(x - b, y - b); ctx.lineTo(x - a, y - a); ctx.moveTo(x + b, y - b); ctx.lineTo(x + a, y - a);
      ctx.moveTo(x - b, y + b); ctx.lineTo(x - a, y + a); ctx.moveTo(x + b, y + b); ctx.lineTo(x + a, y + a); ctx.stroke();
    }
    // Modus-Symbol neben dem Fadenkreuz
    const ix = x + gap + 16, iy = y + gap + 14;
    ctx.save(); ctx.translate(ix, iy);
    if (P.mode === 'build') { ctx.fillStyle = '#ffffff'; ctx.fillRect(-9, -3, 18, 6); ctx.fillStyle = '#11151f'; ctx.fillRect(-3, -3, 1, 6); ctx.fillRect(3, -3, 1, 6); }
    else if (P.mode === 'edit') { ctx.fillStyle = COLORS.select; ctx.fillRect(-9, -3, 5, 6); ctx.strokeStyle = COLORS.select; ctx.lineWidth = 1; ctx.strokeRect(-2.5, -3, 5, 6); ctx.fillRect(4, -3, 5, 6); }
    else { WeaponIcon(ctx, P.slot, 0, 0, 0.55, '#ffffff'); }
    ctx.restore();
  },
  drawBars(ctx, u, touch) {
    const P = Match.player;
    const bw = 190 * u, bh = 14 * u;
    let x = 18 * u, y = Renderer.h - 60 * u;
    if (touch) { x = Renderer.portrait ? 20 * u : 64 * u; y = Renderer.portrait ? 72 * u : 16 * u; }
    this.panel(ctx, x - 8 * u, y - 8 * u, bw + 16 * u, bh * 2 + 22 * u, 8 * u);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x, y, bw, bh); ctx.fillRect(x, y + bh + 6 * u, bw, bh);
    ctx.fillStyle = '#3d9bff'; ctx.fillRect(x, y, bw * P.shield / CONFIG.SHIELD_MAX, bh);
    const hpR = P.hp / CONFIG.HP_MAX;
    ctx.fillStyle = hpR > 0.6 ? '#4fdc6e' : hpR > 0.3 ? '#ffd34a' : '#ff5148';
    ctx.fillRect(x, y + bh + 6 * u, bw * hpR, bh);
    this.text(ctx, String(Math.ceil(P.shield)), x + 6 * u, y + bh / 2, 11 * u, '#ffffff', 'left', 700);
    this.text(ctx, String(Math.ceil(P.hp)), x + 6 * u, y + bh * 1.5 + 6 * u, 11 * u, '#ffffff', 'left', 700);
  },
  slotRects(u, touch) {
    const n = 5, sw = (touch ? 46 : 58) * u, sh = (touch ? 46 : 54) * u, gap = 6 * u;
    const tw = n * sw + (n - 1) * gap;
    const x0 = Renderer.w / 2 - tw / 2;
    const y0 = touch ? (Renderer.portrait ? 132 * u : 74 * u) : Renderer.h - sh - 16 * u;
    const out = [];
    for (let i = 0; i < n; i++) out.push({ x: x0 + i * (sw + gap), y: y0, w: sw, h: sh });
    return out;
  },
  drawWeaponBar(ctx, u, touch) {
    const P = Match.player, rs = this.slotRects(u, touch);
    for (let i = 0; i < 4; i++) {
      const r = rs[i], active = P.mode === 'weapon' && P.slot === i;
      this.panel(ctx, r.x, r.y, r.w, r.h, 7 * u);
      if (active) { ctx.strokeStyle = COLORS.own; ctx.lineWidth = 2.5 * u; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); }
      WeaponIcon(ctx, i, r.x + r.w / 2, r.y + r.h * 0.42, u * (touch ? 0.8 : 0.95), active ? '#ffffff' : '#9fb0cc');
      this.text(ctx, String(i + 1), r.x + 5 * u, r.y + 8 * u, 9 * u, '#7f8db0', 'left', 700);
      const w = WEAPONS[i];
      if (!w.melee) {
        const reloading = P.reload && P.reload.slot === i;
        this.text(ctx, reloading ? '…' : String(P.ws[i].mag), r.x + r.w / 2, r.y + r.h - 10 * u, 11 * u, P.ws[i].mag === 0 ? '#ff6b5e' : '#ffffff', 'center', 700);
        if (reloading) { ctx.fillStyle = COLORS.own; ctx.fillRect(r.x + 4 * u, r.y + r.h - 3 * u, (r.w - 8 * u) * (1 - P.reload.t / P.reload.total), 2 * u); }
      }
    }
    const r = rs[4];
    this.panel(ctx, r.x, r.y, r.w, r.h, 7 * u);
    PotionIcon(ctx, r.x + r.w / 2, r.y + r.h * 0.42, u * (touch ? 0.8 : 0.95));
    this.text(ctx, '×' + P.potions, r.x + r.w / 2, r.y + r.h - 10 * u, 11 * u, P.potions ? '#ffffff' : '#ff6b5e', 'center', 700);
    this.text(ctx, '5', r.x + 5 * u, r.y + 8 * u, 9 * u, '#7f8db0', 'left', 700);
    if (P.mode === 'weapon' && !touch) this.text(ctx, WEAPONS[P.slot].name, Renderer.w / 2, rs[0].y - 12 * u, 12 * u, '#cfd8ea', 'center', 700);
  },
  drawMats(ctx, u, touch) {
    const P = Match.player;
    const bw = 110 * u, bh = 44 * u;
    let x = Renderer.w - bw - 16 * u, y = Renderer.h - bh - 16 * u;
    if (touch) { x = Renderer.w - bw - 12 * u; y = 12 * u; }
    this.panel(ctx, x, y, bw, bh, 8 * u);
    if (P.matsErr > 0 && Math.floor(P.matsErr * 10) % 2 === 0) { ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = 2.5 * u; ctx.strokeRect(x, y, bw, bh); }
    if (P.matsFlash > 0) { ctx.fillStyle = `rgba(61,139,255,${P.matsFlash * 1.6})`; ctx.fillRect(x, y, bw, bh); }
    // Wand-Symbol
    const ix = x + 14 * u, iy = y + bh / 2 - 6 * u;
    ctx.fillStyle = COLORS.own; ctx.fillRect(ix, iy, 26 * u, 12 * u);
    ctx.fillStyle = '#8fbcff'; ctx.fillRect(ix, iy, 26 * u, 3 * u);
    ctx.fillStyle = '#0d1422'; ctx.fillRect(ix + 8.5 * u, iy, 1.2 * u, 12 * u); ctx.fillRect(ix + 17 * u, iy, 1.2 * u, 12 * u);
    this.text(ctx, P.unlimitedMats ? '∞' : String(P.mats), x + bw - 12 * u, y + bh / 2, 20 * u, P.mats < CONFIG.WALL_COST && !P.unlimitedMats ? '#ff6b5e' : '#ffffff', 'right');
  },
  drawTop(ctx, u, touch) {
    const w = Renderer.w, cx = w / 2;
    const y = (touch ? 30 : 26) * u;
    if (Match.training) {
      this.panel(ctx, cx - 70 * u, y - 16 * u, 140 * u, 32 * u, 8 * u);
      this.text(ctx, 'TRAINING', cx, y, 15 * u, COLORS.mate, 'center');
      return;
    }
    const pt = Match.playerTeam();
    this.panel(ctx, cx - 92 * u, y - 18 * u, 184 * u, (touch ? 36 : 54) * u, 8 * u);
    this.text(ctx, String(Match.scores[pt]), cx - 22 * u, y, 22 * u, COLORS.own, 'center');
    this.text(ctx, ':', cx, y, 20 * u, '#ffffff', 'center');
    this.text(ctx, String(Match.scores[1 - pt]), cx + 22 * u, y, 22 * u, COLORS.enemy, 'center');
    const t = Math.floor(Match.roundTime), mm = Math.floor(t / 60), ss = String(t % 60).padStart(2, '0');
    this.text(ctx, mm + ':' + ss, cx - 62 * u, y, 13 * u, '#cfd8ea', 'center', 700);
    this.text(ctx, 'bis ' + Match.roundsToWin, cx + 64 * u, y, 11 * u, '#8e9ab3', 'center', 700);
    if (!touch) {
      const zt = CONFIG.ZONE_START_DELAY - Match.roundTime;
      const s = Match.phase !== 'combat' ? '' : zt > 0 ? 'Zone in ' + Math.ceil(zt) + ' s' : (Match.zone.r > Match.zone.r1 + 1 ? 'Zone schrumpft' : 'Zone geschlossen');
      this.text(ctx, s, cx, y + 22 * u, 12 * u, zt > 0 ? '#b9a3ff' : COLORS.zone, 'center', 700);
    } else if (Match.phase === 'combat') {
      const zt = CONFIG.ZONE_START_DELAY - Match.roundTime;
      this.text(ctx, zt > 0 ? 'Zone ' + Math.ceil(zt) + 's' : 'Zone!', cx, y + 26 * u, 11 * u, COLORS.zone, 'center', 700);
    }
  },
  drawKillfeed(ctx, u, touch) {
    const x = Renderer.w - 14 * u;
    let y = (touch ? (Renderer.portrait ? 200 : 72) : 24) * u;
    for (const k of Match.killfeed) {
      ctx.globalAlpha = clamp(k.life, 0, 1);
      const pt = Match.playerTeam();
      const kc = k.killer ? (k.killer.team === pt ? COLORS.own : COLORS.enemy) : COLORS.zone;
      const vc = k.victim.team === pt ? COLORS.own : COLORS.enemy;
      const s = (k.killer ? k.killer.name : 'Zone') + '  [' + k.weapon + ']  ' + k.victim.name;
      ctx.font = `700 ${Math.round(12 * u)}px system-ui,sans-serif`;
      const tw = ctx.measureText(s).width;
      this.panel(ctx, x - tw - 14 * u, y - 11 * u, tw + 14 * u, 22 * u, 6 * u);
      this.text(ctx, k.victim.name, x - 7 * u, y, 12 * u, vc, 'right', 700);
      ctx.font = `700 ${Math.round(12 * u)}px system-ui,sans-serif`;
      const vw = ctx.measureText(k.victim.name).width;
      this.text(ctx, '[' + k.weapon + ']', x - 7 * u - vw - 6 * u, y, 12 * u, '#cfd8ea', 'right', 700);
      this.text(ctx, k.killer ? k.killer.name : 'Zone', x - tw - 7 * u, y, 12 * u, kc, 'left', 700);
      y += 26 * u;
    }
    ctx.globalAlpha = 1;
  },
  drawProgress(ctx, u) {
    const P = Match.player; if (!P.alive) return;
    let p = -1, label = '';
    if (P.heal) { p = 1 - P.heal.t / P.heal.total; label = 'Schildtrank'; }
    else if (P.reload) { const w = WEAPONS[P.reload.slot]; p = w.perShell ? P.ws[P.reload.slot].mag / w.mag : 1 - P.reload.t / P.reload.total; label = 'Nachladen'; }
    if (p < 0) return;
    const bw = 140 * u, x = Renderer.w / 2 - bw / 2, y = Renderer.h * 0.62;
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y, bw, 6 * u);
    ctx.fillStyle = P.heal ? '#58b4ff' : '#ffffff'; ctx.fillRect(x, y, bw * clamp(p, 0, 1), 6 * u);
    this.text(ctx, label, Renderer.w / 2, y - 10 * u, 11 * u, '#e8eefc', 'center', 700);
  },
  drawEditTimes(ctx, u, touch) {
    const x = 18 * u, y = touch ? 90 * u : Renderer.h * 0.38;
    const t = UI.editTimes;
    this.panel(ctx, x - 8 * u, y - 16 * u, 150 * u, (34 + Math.max(1, t.length) * 18) * u, 8 * u);
    this.text(ctx, 'EDIT-ZEIT', x, y, 12 * u, COLORS.mate, 'left');
    if (!t.length) this.text(ctx, 'F → Feld → loslassen', x, y + 20 * u, 11 * u, '#8e9ab3', 'left', 600);
    t.forEach((ms, i) => this.text(ctx, ms + ' ms', x, y + (20 + i * 18) * u, (i === 0 ? 16 : 12) * u, i === 0 ? '#ffffff' : '#9fb0cc', 'left', i === 0 ? 800 : 600));
    const best = Match.player.stats.fastestEdit;
    if (best) this.text(ctx, 'Bestwert ' + best + ' ms', x + 70 * u, y, 10 * u, '#ffd84a', 'left', 700);
  },
  drawRoundEnd(ctx, u) {
    const r = Match.roundResult, w = Renderer.w, h = Renderer.h;
    const a = clamp(Match.phaseT * 4, 0, 1);
    ctx.globalAlpha = a;

  // Geräusche außerhalb der Sicht: Ring im Bild oder Richtungspfeil am Rand
  drawRings(ctx) {
    const w = Renderer.w, h = Renderer.h, V = Match.viewer(); if (!V) return;
    for (const r of Noise.rings) {
      const s = Renderer.worldToScreen(r.x, r.y);

      const col = r.type === 'shot' ? '255,120,90' : r.type === 'step' ? '220,220,240' : '255,210,120';

        const ex = clamp(w / 2 + Math.cos(ang) * w, m, w - m), ey = clamp(h / 2 + Math.sin(ang) * h, m, h - m);
        ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
        ctx.fillStyle = `rgba(${col},${a * 0.9})`;
        ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -9); ctx.lineTo(-2, 0); ctx.lineTo(-6, 9); ctx.closePath(); ctx.fill();

      case 'resethints': settings.seenHints = {}; settings.hints = true; saveSettings(); this.buildSettings(); this.flashBtn('Hinweise zurückgesetzt'); break;

  flashBtn(msg) { const el = document.querySelector('#s-settings h2'); if (el) { el.textContent = msg; setTimeout(() => { el.textContent = 'Einstellungen'; }, 1200); } },
  // Wählbare Werte: Klick = nächster, Pfeil links/rechts = vor/zurück
  cycler(parent, label, values, get, set, fmt) {
    const b = document.createElement('button');
    b.className = 'cyc';
    const render = () => { b.innerHTML = `<span class="lbl">${label}</span><span class="val">◀ ${fmt ? fmt(get()) : get()} ▶</span>`; };
    const step = (d) => {
      let i = values.indexOf(get()); if (i < 0) i = 0;
      set(values[(i + d + values.length) % values.length]); render(); Sfx.play('select');
    };
    b.addEventListener('click', (e) => {
      const r = b.getBoundingClientRect();
      step(e.clientX && e.clientX < r.left + r.width * 0.3 ? -1 : 1);
    });
    b.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); e.stopPropagation(); }
      if (e.key === 'ArrowRight') { step(1); e.preventDefault(); e.stopPropagation(); }

  // Tastatursteuerung der Menüs: Pfeile hoch/runter + Enter; Esc = zurück
  onKey(e) {
    if (Game.state === 'playing') return false;
    if (Game.state === 'touchlayout') { if (e.key === 'Escape') this.closeLayoutEditor(); return true; }
    if (!this.current) return false;
    const el = document.getElementById(this.current);
    const items = [...el.querySelectorAll('button')].filter(b => b.offsetParent !== null);
    const idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = idx < 0 ? 0 : (idx + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[n].focus(); Sfx.play('select');
      return true;
    }
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && idx >= 0 && items[idx].cycleStep) {
      e.preventDefault(); items[idx].cycleStep(e.key === 'ArrowLeft' ? -1 : 1); return true;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      if (idx < 0 && items[0]) { e.preventDefault(); items[0].focus(); return true; }
      return false; // Browser löst den Klick aus
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (this.current === 's-pause') Game.resume();
      else if (this.current !== 's-main' && this.current !== 's-end') this.back();

  // ---------------- Touch-Steuerelemente ----------------
  BTN_LABELS: { fire: 'FEUER', build: 'BAUEN', edit: 'EDIT', reset: 'RESET', weapon: 'WAFFE', heal: 'TRANK', reload: 'LADEN', box: 'BOX' },
  touchButtons() {
    const k = this.touchK(), w = Renderer.w, h = Renderer.h, out = [];
    const P = Match.player;
    for (const id of Object.keys(DEFAULT_TOUCH_LAYOUT)) {
      const L = settings.touchLayout[id] || DEFAULT_TOUCH_LAYOUT[id];
      const r = Math.max(28, L.s * k / 2);
      out.push({ id, x: clamp(w - L.dx * k, r + 4, w - r - 4), y: clamp(h - L.dy * k, r + 4, h - r - 4), r });
    }
    return out;
  },
  touchButtonAt(x, y) {
    if (!Input.isTouchUi()) return null;
    let best = null, bd = Infinity;
    for (const b of this.touchButtons()) { const d = dist(x, y, b.x, b.y); if (d <= b.r + 6 && d < bd) { bd = d; best = b.id; } }
    return best;
  },
  slotAt(x, y) {
    const rs = HUD.slotRects(this.scale(), Input.isTouchUi());
    for (let i = 0; i < rs.length; i++) { const r = rs[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i === 4 ? -1 : i; }
    return -1;
  },
  pauseRect() { const u = this.scale(); return { x: 10 * u, y: 10 * u, w: 44 * u, h: 44 * u }; },
  pauseButtonHit(x, y) { const r = this.pauseRect(); return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; },
  // Edit-Panel: 3 Felder (vertikale Wände übereinander), dazu Reset und Zurück. Auswahl wird beim Loslassen sofort übernommen.
  panelLayout() {
    const P = Match.player;
    if (!P || !P.alive || !Input.isTouchUi() || Game.state !== 'playing' || Match.phase !== 'combat') return null;
    const w = P.mode === 'edit' && P.edit ? P.edit.wall : frontWall(P, P.aim);
    if (!w || w.dead || !canEdit(P, w)) return null;
    if (P.mode !== 'edit' && w.editState) return null;
    const c = Renderer.worldToScreen(w.cx, w.cy);
    // Mindestens 56 px große Tippflächen, mittig auf der Wand
    const L = Math.max(SEG_LEN * Renderer.scale, 56), th = Math.max(CONFIG.WALL_THICK * Renderer.scale * 2.2, 50), g = 4;
    const fields = [];
    for (let i = 0; i < 3; i++) {
      const o = (i - 1) * (L + g);
      fields.push(w.orient === 'H' ? { x: c.x + o - L / 2, y: c.y - th / 2, w: L, h: th } : { x: c.x - th / 2, y: c.y + o - L / 2, w: th, h: L });
    }
    return { wall: w, fields };
  },
  panelHit(x, y) {
    const L = this.panelLayout(); if (!L) return null;
    const inR = r => x >= r.x - 4 && x <= r.x + r.w + 4 && y >= r.y - 4 && y <= r.y + r.h + 4;
    for (let i = 0; i < 3; i++) if (inR(L.fields[i])) return { kind: 'seg', seg: i };
    return null;
  },
  worldFieldAt(sx, sy) {
    const P = Match.player; if (!P || !P.edit || !P.edit.wall) return -1;
    const p = Renderer.screenToWorld(sx, sy);
    return WallSystem.fieldAt(P.edit.wall, p.x, p.y);
  },
  drawTouch(ctx, u) {
    const P = Match.player;
    // Joysticks
    for (const t of Input.touches.values()) {
      if (t.role === 'move' || t.role === 'aim') {
        const R = 56 * u;
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(t.sx, t.sy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        const dx = t.x - t.sx, dy = t.y - t.sy, l = Math.hypot(dx, dy), k = l > R ? R / l : 1;
        ctx.fillStyle = t.role === 'move' ? 'rgba(61,139,255,0.6)' : 'rgba(255,255,255,0.5)';

    }
    // Pause-Button
    const pr = this.pauseRect();
    HUD.panel(ctx, pr.x, pr.y, pr.w, pr.h, 8 * u);
    ctx.fillStyle = '#e8eefc'; ctx.fillRect(pr.x + pr.w * 0.34, pr.y + pr.h * 0.28, pr.w * 0.1, pr.h * 0.44); ctx.fillRect(pr.x + pr.w * 0.56, pr.y + pr.h * 0.28, pr.w * 0.1, pr.h * 0.44);
    for (const b of this.touchButtons()) this.drawTouchBtn(ctx, b, P);
    const L = this.panelLayout();
    if (L) {
      const w = L.wall, editing = P.mode === 'edit' && w.editState;
      const sel = editing ? w.editState.selected : [false, false, false], invalid = sel.every(Boolean);
      for (let i = 0; i < 3; i++) {
        const r = L.fields[i], open = !w.segments[i];
        ctx.lineWidth = 2;
        if (sel[i] && !open) { ctx.fillStyle = invalid ? 'rgba(220,70,60,0.55)' : 'rgba(94,200,232,0.5)'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.strokeStyle = invalid ? '#e0645a' : '#9fe0f2'; ctx.strokeRect(r.x, r.y, r.w, r.h); }
        else if (open && !(editing && !sel[i])) { ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2); ctx.setLineDash([]); }
        else { ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.strokeRect(r.x, r.y, r.w, r.h); }
      }
    }
  },
  drawTouchBtn(ctx, b, P) {
    const active = P && ((b.id === 'build' && P.mode === 'build') || (b.id === 'edit' && P.mode === 'edit') || (b.id === 'fire' && Input.touch.fire));
    const fl = this.btnFlash[b.id] || 0;
    if (fl > 0) this.btnFlash[b.id] = fl - 1 / 60;
    ctx.fillStyle = active ? 'rgba(61,139,255,0.45)' : `rgba(16,22,36,${0.55 + fl})`;
    ctx.strokeStyle = b.id === 'fire' ? 'rgba(255,120,100,0.85)' : 'rgba(150,175,220,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    const u = b.r / 32;
    ctx.save(); ctx.translate(b.x, b.y - 4 * u);
    ctx.fillStyle = '#e8eefc'; ctx.strokeStyle = '#e8eefc';
    switch (b.id) {
      case 'fire': ctx.beginPath(); ctx.arc(0, 0, 10 * u, 0, Math.PI * 2); ctx.lineWidth = 2.5 * u; ctx.stroke(); ctx.fillRect(-1.5 * u, -15 * u, 3 * u, 30 * u); ctx.fillRect(-15 * u, -1.5 * u, 30 * u, 3 * u); break;
      case 'build': ctx.fillRect(-14 * u, -4 * u, 28 * u, 8 * u); break;
      case 'edit': for (let i = 0; i < 3; i++) { if (i === 1) { ctx.lineWidth = 1.5; ctx.strokeRect(-4 * u, -4 * u, 8 * u, 8 * u); } else ctx.fillRect((-14 + i * 10) * u, -4 * u, 8 * u, 8 * u); } break;
      case 'reset': ctx.lineWidth = 2.5 * u; ctx.beginPath(); ctx.arc(0, 0, 8 * u, -Math.PI * 0.2, Math.PI * 1.4); ctx.stroke(); break;
      case 'weapon': if (P) WeaponIcon(ctx, (P.slot + 1) % 4, 0, 0, 0.6 * u, '#e8eefc'); break;
      case 'heal': PotionIcon(ctx, 0, 0, 0.8 * u); break;
      case 'reload': ctx.lineWidth = 2.5 * u; ctx.beginPath(); ctx.arc(0, 0, 8 * u, 0, Math.PI * 1.5); ctx.stroke(); ctx.fillRect(4 * u, -12 * u, 6 * u, 6 * u); break;
      case 'box': ctx.lineWidth = 3 * u; ctx.strokeRect(-9 * u, -9 * u, 18 * u, 18 * u); break;
    }
    ctx.restore();
    HUD.text(ctx, this.BTN_LABELS[b.id], b.x, b.y + b.r * 0.62, Math.max(8, 9 * b.r / 32), '#cfd8ea', 'center', 700);
  },

  // ---------------- Touch-Layout-Editor ----------------
  openLayoutEditor() {
    this.layoutReturn = this.current;
    Game.prevState = Game.state; Game.state = 'touchlayout';
    this.show('s-touch');
    this.layoutSel = 'fire';
  },
  closeLayoutEditor() {
    saveSettings();
    Game.state = Game.prevState || 'menu';
    this.show('s-settings');
  },
  layoutResize(d) {
    const id = this.layoutSel; if (!id) return;
    const L = settings.touchLayout[id];
    L.s = clamp(L.s + d, 56, 150); saveSettings();
  },
  layoutPointer(type, x, y) {
    const k = this.touchK();
    if (type === 'down') {
      let best = null, bd = Infinity;
      for (const b of this.allLayoutButtons()) { const d = dist(x, y, b.x, b.y); if (d < b.r + 8 && d < bd) { bd = d; best = b; } }
      if (best) { this.layoutSel = best.id; this.layoutDrag = { id: best.id, ox: x - best.x, oy: y - best.y }; }
    } else if (type === 'move' && this.layoutDrag) {
      const L = settings.touchLayout[this.layoutDrag.id];
      L.dx = clamp((Renderer.w - (x - this.layoutDrag.ox)) / k, 30, Renderer.w / k - 30);
      L.dy = clamp((Renderer.h - (y - this.layoutDrag.oy)) / k, 30, Renderer.h / k - 30);
    } else if (type === 'up') { this.layoutDrag = null; saveSettings(); }
  },
  allLayoutButtons() {
    const k = this.touchK(), w = Renderer.w, h = Renderer.h, out = [];
    for (const id of Object.keys(DEFAULT_TOUCH_LAYOUT)) {
      const L = settings.touchLayout[id]; const r = Math.max(28, L.s * k / 2);
      out.push({ id, x: clamp(w - L.dx * k, r + 4, w - r - 4), y: clamp(h - L.dy * k, r + 4, h - r - 4), r });
    }
    return out;
  },
  drawLayoutEditor(ctx) {
    ctx.fillStyle = 'rgba(8,10,16,0.55)'; ctx.fillRect(0, 0, Renderer.w, Renderer.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(Renderer.w / 2, 0); ctx.lineTo(Renderer.w / 2, Renderer.h); ctx.stroke(); ctx.setLineDash([]);
    HUD.text(ctx, 'Joystick (laufen)', Renderer.w * 0.25, Renderer.h * 0.6, 16, '#8e9ab3', 'center', 700);
    for (const b of this.allLayoutButtons()) {
      this.drawTouchBtn(ctx, b, Match.player);
      if (b.id === this.layoutSel) { ctx.strokeStyle = COLORS.mate; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, Math.PI * 2); ctx.stroke(); }
    }
  },

  // ---------------- Logo aus Canvas-Formen ----------------
  GLYPHS: {
    B: ['1110', '1001', '1110', '1001', '1110'], O: ['0110', '1001', '1001', '1001', '0110'], X: ['1001', '1001', '0110', '1001', '1001'],
    R: ['1110', '1001', '1110', '1010', '1001'], U: ['1001', '1001', '1001', '1001', '0110'], S: ['0111', '1000', '0110', '0001', '1110'],
    H: ['1001', '1001', '1111', '1001', '1001']
  },
  drawLogo(t) {
    const c = document.getElementById('logo'); if (!c) return;
    const ctx = c.getContext('2d'), W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    const word = 'BOXRUSH', cell = 15, gap = 3, lw = 4 * (cell + gap) + 10;
    const total = word.length * lw - 10;
    let x = (W - total) / 2;
    const y0 = 40;
    t = t || 0;
    for (let li = 0; li < word.length; li++) {
      const g = this.GLYPHS[word[li]], col = li < 3 ? COLORS.woodLight : COLORS.wood;
      for (let r = 0; r < 5; r++) for (let q = 0; q < 4; q++) {
        if (g[r][q] !== '1') continue;
        // ein „editiertes“ Feld im O als Augenzwinkern
        if (li === 1 && r === 2 && q === 1) {
          ctx.strokeStyle = COLORS.mate; ctx.setLineDash([3, 3]); ctx.lineWidth = 2;
          ctx.strokeRect(x + q * (cell + gap) + 1, y0 + r * (cell + gap) + 1, cell - 2, cell - 2); ctx.setLineDash([]);
          continue;
        }
        const bx = x + q * (cell + gap), by = y0 + r * (cell + gap) + Math.sin(t * 3 + li * 0.6) * 2;
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(bx + 4, by + 5, cell, cell);
        ctx.fillStyle = col; ctx.fillRect(bx, by, cell, cell);
        ctx.fillStyle = shade(col, 0.3); ctx.fillRect(bx, by, cell, 3);
        ctx.fillStyle = shade(col, -0.35); ctx.fillRect(bx, by + cell - 2, cell, 2);
        ctx.fillStyle = 'rgba(72,40,14,0.5)'; ctx.fillRect(bx, by + cell * 0.5, cell, 1);
      }
      x += lw;
    }
    // Unterstrich als Wand mit drei Feldern
    const uy = y0 + 5 * (cell + gap) + 18, ux = (W - total) / 2;
    for (let i = 0; i < 3; i++) {
      const sw = (total - 12) / 3;
      ctx.fillStyle = i === 1 ? 'rgba(94,200,232,0.25)' : COLORS.stone;
      ctx.fillRect(ux + i * (sw + 6), uy, sw, 10);
      if (i === 1) { ctx.strokeStyle = COLORS.mate; ctx.lineWidth = 1.5; ctx.strokeRect(ux + i * (sw + 6), uy, sw, 10); }
    }
  }
};

// =====================================================================
// 12. Audio – synthetisierte Sounds (Web Audio API), räumlich, mit Kompressor
// =====================================================================
const Sfx = {
  ctx: null, master: null, sfx: null, music: null, comp: null, noiseBuf: null, voices: 0, last: {}, musicMode: 'menu', musicTimer: null, nextNote: 0, step: 0,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !document.hidden) this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try {
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -16; this.comp.ratio.value = 6; this.comp.attack.value = 0.003; this.comp.release.value = 0.2;
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
      this.sfx = this.ctx.createGain(); this.music = this.ctx.createGain();
      this.sfx.connect(this.comp); this.music.connect(this.comp); this.comp.connect(this.master); this.master.connect(this.ctx.destination);
      const n = this.ctx.sampleRate;
      this.noiseBuf = this.ctx.createBuffer(1, n, n);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.applyVolumes();
      this.startMusic();
    } catch (e) { this.ctx = null; }
  },
  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(settings.sfxVol / 100, t, 0.05);
    const mv = settings.music ? settings.musicVol / 100 * (this.musicMode === 'menu' ? 0.5 : 0.18) : 0;
    this.music.gain.setTargetAtTime(mv, t, 0.3);
  },
  setMusicMode(m) { this.musicMode = m; this.applyVolumes(); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },

  play(name, x, y, vol) {
    const ctx = this.ctx; if (!ctx || ctx.state !== 'running' || !this.syn[name]) return;
    const now = ctx.currentTime;
    // Gleiche Sounds innerhalb von 30 ms zusammenfassen
    if (this.last[name] !== undefined && now - this.last[name] < CONFIG.AUDIO_MERGE) return;
    if (this.voices >= CONFIG.AUDIO_MAX_VOICES) return;
    let g = vol === undefined ? 1 : vol, pan = 0;
    if (x !== undefined && y !== undefined && Renderer.cam) {
      const d = dist(x, y, Renderer.cam.x, Renderer.cam.y), maxD = CONFIG.AUDIO_HEAR_TILES * TILE;
      g *= Math.pow(clamp(1 - d / maxD, 0, 1), 1.4);
      pan = clamp((x - Renderer.cam.x) / (8 * TILE), -1, 1);
      if (g < 0.02) return;
    }
    this.last[name] = now;
    const out = ctx.createGain(); out.gain.value = g;
    let node = out;
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = pan; out.connect(p); node = p; }
    node.connect(this.sfx);
    this.voices++;
    let dur = 0.3;
    try { dur = this.syn[name].call(this, out, now) || 0.3; } catch (e) { /* Ton auslassen */ }
    setTimeout(() => { this.voices--; try { node.disconnect(); out.disconnect(); } catch (e) { /* schon getrennt */ } }, dur * 1000 + 80);
  },
  // Bausteine
  osc(out, type, f0, f1, t, dur, v, attack) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (attack || 0.004)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(out, t, dur, ftype, f0, f1, v, q) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; s.loop = true;
    f.type = ftype; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur); f.Q.value = q || 0.8;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  syn: {
    shotgun(o, t) { this.osc(o, 'sine', 140, 40, t, 0.25, 0.9); this.noise(o, t, 0.32, 'lowpass', 3200, 300, 0.7); this.noise(o, t, 0.06, 'highpass', 2000, 0, 0.4); return 0.35; },
    rifle(o, t) { this.osc(o, 'square', 220, 70, t, 0.08, 0.25); this.noise(o, t, 0.1, 'bandpass', 1800, 600, 0.55, 1.2); return 0.12; },
    smg(o, t) { this.osc(o, 'square', 420, 160, t, 0.05, 0.18); this.noise(o, t, 0.06, 'bandpass', 3200, 1500, 0.4, 1.5); return 0.08; },
    pickaxe(o, t) { this.osc(o, 'triangle', 180, 90, t, 0.12, 0.6); this.noise(o, t, 0.08, 'lowpass', 900, 200, 0.5); return 0.15; },
    swing(o, t) { this.noise(o, t, 0.12, 'bandpass', 600, 2400, 0.18, 2); return 0.14; },
    build(o, t) { this.osc(o, 'sine', 300, 120, t, 0.14, 0.55); this.osc(o, 'triangle', 600, 400, t, 0.06, 0.15); this.noise(o, t, 0.05, 'lowpass', 1500, 400, 0.2); return 0.16; },
    select(o, t) { this.osc(o, 'square', 1400, 1400, t, 0.03, 0.08); return 0.05; },
    click(o, t) { this.osc(o, 'square', 600, 600, t, 0.025, 0.06); return 0.04; },
    ui(o, t) { this.osc(o, 'triangle', 880, 990, t, 0.05, 0.12); return 0.06; },
    editConfirm(o, t) { this.noise(o, t, 0.1, 'bandpass', 900, 4000, 0.35, 2.5); this.osc(o, 'sine', 500, 900, t, 0.07, 0.12); return 0.12; },
    reset(o, t) { this.noise(o, t, 0.1, 'bandpass', 4000, 900, 0.35, 2.5); this.osc(o, 'sine', 900, 500, t, 0.07, 0.12); return 0.12; },
    wallBreak(o, t) { this.noise(o, t, 0.45, 'lowpass', 2500, 150, 0.8); this.osc(o, 'sawtooth', 120, 40, t, 0.3, 0.3); for (let i = 0; i < 4; i++) this.noise(o, t + 0.04 + i * 0.05, 0.04, 'highpass', 3000, 0, 0.25); return 0.5; },
    hit(o, t) { this.osc(o, 'sine', 1800, 1500, t, 0.07, 0.35); return 0.08; },
    shieldHit(o, t) { this.osc(o, 'sine', 2300, 2100, t, 0.12, 0.25); this.osc(o, 'triangle', 3450, 3000, t, 0.1, 0.12); return 0.13; },
    kill(o, t) { this.osc(o, 'square', 660, 660, t, 0.08, 0.2); this.osc(o, 'square', 990, 990, t + 0.09, 0.14, 0.2); return 0.26; },
    death(o, t) { this.osc(o, 'sawtooth', 300, 60, t, 0.35, 0.25); return 0.36; },
    step(o, t) { this.noise(o, t, 0.04, 'lowpass', 500, 200, 0.12); return 0.05; },
    beep(o, t) { this.osc(o, 'square', 660, 660, t, 0.12, 0.18); return 0.13; },
    go(o, t) { this.osc(o, 'square', 990, 990, t, 0.25, 0.2); return 0.26; },
    error(o, t) { this.osc(o, 'square', 180, 150, t, 0.09, 0.15); return 0.1; },
    reload(o, t) { this.noise(o, t, 0.05, 'highpass', 2500, 0, 0.15); this.noise(o, t + 0.12, 0.05, 'highpass', 1800, 0, 0.15); return 0.2; },
    heal(o, t) { this.osc(o, 'sine', 400, 800, t, 0.3, 0.12); return 0.3; },
    shieldUp(o, t) { this.osc(o, 'sine', 600, 1200, t, 0.25, 0.2); this.osc(o, 'triangle', 900, 1800, t + 0.05, 0.25, 0.1); return 0.32; },
    roundWin(o, t) { [523, 659, 784, 1046].forEach((f, i) => this.osc(o, 'triangle', f, f, t + i * 0.1, 0.2, 0.25)); return 0.55; },
    matchWin(o, t) { [523, 659, 784, 1046, 1318].forEach((f, i) => this.osc(o, 'square', f, f, t + i * 0.11, 0.25, 0.14)); return 0.8; },
    roundLose(o, t) { [392, 330, 262, 196].forEach((f, i) => this.osc(o, 'triangle', f, f, t + i * 0.12, 0.22, 0.25)); return 0.6; }
  },
  // Musik: einfache synthetisierte Schleife, im Spiel leiser
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.nextNote = this.ctx.currentTime + 0.1; this.step = 0;
    this.musicTimer = setInterval(() => this.schedule(), 50);
  },
  schedule() {
    const ctx = this.ctx; if (!ctx || ctx.state !== 'running') return;
    const bass = [45, 45, 52, 45, 48, 48, 43, 47];
    const arp = [0, 7, 12, 15, 12, 7, 3, 7];
    const spb = 60 / 112 / 2;
    while (this.nextNote < ctx.currentTime + 0.2) {
      const s = this.step, t = this.nextNote, bar = Math.floor(s / 16) % 8;
      const root = bass[bar];
      const mf = n => 440 * Math.pow(2, (n - 69) / 12);
      if (s % 4 === 0) this.mnote('triangle', mf(root), t, spb * 3.5, 0.35);
      if (s % 2 === 0) this.mnote('square', mf(root + 24 + arp[(s / 2) % 8]), t, spb * 0.9, 0.06);
      if (s % 8 === 4) this.mnoise(t, 0.05, 0.12);
      if (s % 2 === 1) this.mnoise(t, 0.02, 0.04);
      this.nextNote += spb; this.step++;
    }
  },
  mnote(type, f, t, dur, v) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), fl = this.ctx.createBiquadFilter();
    o.type = type; o.frequency.value = f; fl.type = 'lowpass'; fl.frequency.value = 1800;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(this.music); o.start(t); o.stop(t + dur + 0.02);
  },
  mnoise(t, dur, v) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; f.type = 'highpass'; f.frequency.value = 6000;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.music); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
};

const Game = {
  state: 'menu', debug: false, lastOpts: null, prevState: null, acc: 0, last: 0,
  startMatch(opts) {
    this.lastOpts = opts;
    Input.resetAll();
    Match.start(opts);
    Renderer.cam.x = Match.player.x; Renderer.cam.y = Match.player.y;
    this.state = 'playing'; this.acc = 0;
    UI.history = []; UI.show(null);
    Renderer.canvas.classList.add('nocursor');
    Sfx.setMusicMode('game');
  },
  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing'; this.acc = 0; Input.resetAll();
    UI.show(null); Renderer.canvas.classList.add('nocursor');
    Sfx.resume();
  },
  toMenu() {
    this.state = 'menu'; Match.player = null; Match.fighters = []; Match.phase = 'idle';
    UI.history = []; UI.show('s-main');
    Renderer.canvas.classList.remove('nocursor');
    Sfx.setMusicMode('menu');
  },
  step(dt) {
    Match.update(dt);
    Input.endTick();
  },
  frame(now) {
    requestAnimationFrame(t => this.frame(t));
    let dt = (now - this.last) / 1000; this.last = now;
    if (!(dt > 0)) dt = 0; if (dt > 0.25) dt = 0.25;
    const FIX = CONFIG.FIXED_DT;
    if (this.state === 'playing') {
      this.acc += dt;
      let n = 0;
      while (this.acc >= FIX && n < CONFIG.MAX_STEPS) { this.step(FIX); this.acc -= FIX; n++; }
      if (n >= CONFIG.MAX_STEPS) this.acc = 0;   // nach einem Ruckler nicht hängen bleiben
    }
    const st = this.state;
    const showGame = !!Match.player && (st === 'playing' || st === 'paused' || st === 'ended' || (st === 'touchlayout' && this.prevState !== 'menu'));
    Renderer.render(st === 'playing' ? this.acc / FIX : 1, dt, showGame);
    if (UI.current === 's-main') UI.drawLogo(now / 1000);
  }
};

document.addEventListener('visibilitychange', () => {
  // Tab im Hintergrund: Spiel pausiert, Audio stoppt; beim Zurückkehren erscheint das Pausenmenü
  if (document.hidden) { if (Game.state === 'playing') UI.pauseGame(); Sfx.suspend(); }
  else Sfx.resume();
});

function boot() {
  Renderer.init(document.getElementById('game'));
  Input.init(Renderer.canvas);
  Entities.initPools();
  WallSystem.reset();
  UI.init();
  UI.show('s-main');
  // Testzugang (für automatische Prüfungen), stört das normale Spiel nicht
  window.BOXRUSH = { Game, Match, WallSystem, Vision, Physics, AI, settings, CONFIG, Input, Renderer, UI, Entities, step: (n) => { for (let i = 0; i < n; i++) Game.step(CONFIG.FIXED_DT); } };
  const h = location.hash;
  if (h.indexOf('autoplay') >= 0) {
    const lv = (h.match(/lv=(\w+)/) || [])[1] || 'hard';
    const md = (h.match(/mode=(\w+)/) || [])[1] || 'duel';
    Game.startMatch({ mode: md, difficulty: lv, rounds: 3, autoplay: true, autoplayLevel: lv });
  }
  requestAnimationFrame(t => { Game.last = t; Game.frame(t); });
}
boot();
</script>
