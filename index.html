// ===== Antik-Stil: Bausteine (Stein-Muster, Ecken-Schnitt, Bronze, Verzierungen) =====
let AQP=null;
function aqPat(){if(AQP!==null)return AQP;AQP=0;
  try{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),im=x.createImageData(96,96);
    for(let i=0;i<96*96;i++){const n=hs(i,77),v=n<.5?0:255;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=Math.pow(Math.abs(n-.5)*2,3)*30;}
    x.putImageData(im,0,0);x.strokeStyle='rgba(0,0,0,.16)';x.lineWidth=1;
    for(let k=0;k<6;k++){let px=hs(k,81)*96,py=hs(k,82)*96;x.beginPath();x.moveTo(px,py);for(let q=0;q<4;q++){px+=(hs(k*7+q,83)-.5)*44;py+=(hs(k*7+q,84)-.35)*30;x.lineTo(px,py);}x.stroke();}
    AQP=g.createPattern(c,'repeat')||0;}catch(e){AQP=0;}return AQP;}
// Zwischenspeicher: Steinknöpfe und Plaketten werden einmal gemalt und danach nur noch als fertiges Bild kopiert (schont iPad/Handy)
const UIC=new Map(),UIF=new Map();   // UIF: große Fensterrahmen (höchstens 4 gleichzeitig, wegen Speicher)
function uiCache(key,w,h,pad,fn,M){if(!g.getTransform||w<1||h<1)return null;const t=g.getTransform(),sx=Math.hypot(t.a,t.b);if(!(sx>0))return null;
  M=M||UIC;const k=key+'|'+Math.round(sx*100);let c=M.get(k);
  if(!c){if(M.size>(M===UIF?3:180))M.clear();c=document.createElement('canvas');c.width=Math.ceil((w+2*pad)*sx);c.height=Math.ceil((h+2*pad)*sx);const G0=g;g=c.getContext('2d');g.setTransform(sx,0,0,sx,pad*sx,pad*sx);try{fn();}finally{g=G0;}M.set(k,c);}
  return c;}
function chamf(x,y,w,h,c){c=Math.max(0,Math.min(c,w/2,h/2));g.beginPath();g.moveTo(x+c,y);g.lineTo(x+w-c,y);g.lineTo(x+w,y+c);g.lineTo(x+w,y+h-c);g.lineTo(x+w-c,y+h);g.lineTo(x+c,y+h);g.lineTo(x,y+h-c);g.lineTo(x,y+c);g.closePath();}
function brz(x,y,w,h){const q=g.createLinearGradient(x,y,x+w*.35,y+h+w*.12);q.addColorStop(0,'#ffe6a6');q.addColorStop(.25,'#c8913f');q.addColorStop(.55,'#7a5222');q.addColorStop(.8,'#d9a24c');q.addColorStop(1,'#6a4418');return q;}
function texIn(x,y,w,h,c){const P=aqPat();if(!P)return;g.save();chamf(x,y,w,h,c);g.clip();g.fillStyle=P;g.fillRect(x,y,w,h);g.restore();}
function dmd(x,y,r,f,l){g.beginPath();g.moveTo(x,y-r);g.lineTo(x+r*.8,y);g.lineTo(x,y+r);g.lineTo(x-r*.8,y);g.closePath();if(f){g.fillStyle=f;g.fill();}if(l){g.strokeStyle=l;g.lineWidth=1;g.stroke();}}
function gem(x,y,r,c){dmd(x,y,r+3,brz(x-r,y-r,2*r,2*r),'rgba(20,10,4,.9)');const q=g.createLinearGradient(x-r,y-r,x+r,y+r);q.addColorStop(0,'#ffffff');q.addColorStop(.3,c);q.addColorStop(1,shade(c,-.55));dmd(x,y,r,q);g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.arc(x-r*.25,y-r*.35,Math.max(.8,r*.18),0,TAU);g.fill();}
// Eck-Schnörkel: (x,y) = innere Rahmenecke, sx/sy = Richtung ins Innere
function orn(x,y,sx,sy){g.save();g.translate(x,y);g.scale(sx,sy);g.lineCap='round';
  g.strokeStyle='rgba(20,10,4,.8)';g.lineWidth=3.2;g.beginPath();g.moveTo(9,4);g.quadraticCurveTo(22,2.5,30,7);g.moveTo(4,9);g.quadraticCurveTo(2.5,22,7,30);g.stroke();
  g.strokeStyle='#e8b85a';g.lineWidth=1.5;g.beginPath();g.moveTo(9,4);g.quadraticCurveTo(22,2.5,30,7);g.arc(28,11,3.6,-1.1,2.6);g.moveTo(4,9);g.quadraticCurveTo(2.5,22,7,30);g.arc(11,28,3.6,-1.1+Math.PI*1.5,2.6+Math.PI*1.5,true);g.stroke();

// Runde Bronze-Plakette (HUD-Knöpfe)

//   d  = Phrasen (gelten ganz UND als Bausteine in zusammengesetzten Texten, nur an Wortgrenzen)
//   x  = nur ganze Texte

// Neue Sprache hinzufügen: LANGS.fr={name:'Français',d:{...},x:{...},t:[[...]]};  fertig, sie erscheint automatisch in den Einstellungen.
const LANGS={de:{name:'Deutsch'}};
let LG='de',_lx=null,_ld=null,_lix=null,_ltp=[],_lc=new Map();
const _isL=c=>c!==undefined&&c.toLowerCase()!==c.toUpperCase();
function langBuild(){
  _lc=new Map();_lx=_ld=_lix=null;_ltp=[];
  const D=LANGS[LG];if(!D||LG==='de')return;
  _ld=new Map(Object.entries(D.d||{}));_lx=new Map(Object.entries(D.x||{}));
  for(const[k,v]of _ld)if(!_lx.has(k))_lx.set(k,v);
  _lix=new Map();
  for(const k of _ld.keys()){if(!k)continue;const c=k[0];if(!_lix.has(c))_lix.set(c,[]);_lix.get(c).push(k);}
  for(const a of _lix.values())a.sort((p,q)=>q.length-p.length);
  for(const[a,b]of(D.t||[])){
    const rx=new RegExp('^'+a.replace(/[.*+?^$()|[\]\\]/g,'\\$&').replace(/\{(\d)\}/g,'(.+?)')+'$');
    _ltp.push([rx,b]);

function _lfrag(s){

    if(hit){out+=_ld.get(hit);i+=hit.length;}else{out+=c;i++;}
  }

}
function _ltr(s){

  for(const[rx,b]of _ltp){const m=rx.exec(s);if(m)return b.replace(/\{(\d)\}/g,(_,i)=>LTR(m[+i+1]));}
  return _lfrag(s);

function LTR(s){
  if(!_lx||typeof s!=='string'||s.length<2)return s;
  let r=_lc.get(s);if(r!==undefined)return r;
  r=_ltr(s);

// Canvas-Text läuft zentral durch LTR(): fillText / strokeText / measureText
if(typeof CanvasRenderingContext2D!=='undefined')(()=>{const P=CanvasRenderingContext2D.prototype,ft=P.fillText,st=P.strokeText,mt=P.measureText;

  P.strokeText=function(s,x,y,w){return w===undefined?st.call(this,LTR(String(s)),x,y):st.call(this,LTR(String(s)),x,y,w);};

// HTML-Teile (Anmeldefenster): Text und Platzhalter, Originale bleiben für den Rückwechsel erhalten
function domTr(){
  const root=document.getElementById('lg');if(!root)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while(n=w.nextNode()){
    if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest('[data-nt]'))continue;
    if(n.__de!==undefined&&(n.data===n.__de||n.data===n.__en)){const t=LTR(n.__de);n.__en=t;if(n.data!==t)n.data=t;}
    else{n.__de=n.data;const t=LTR(n.data);n.__en=t;if(t!==n.data)n.data=t;}
  }
  root.querySelectorAll('[placeholder]').forEach(e=>{if(e.dataset.de===undefined)e.dataset.de=e.getAttribute('placeholder');e.setAttribute('placeholder',LTR(e.dataset.de));});
}

// ===== KUNST 2.0: Grundbausteine =====
const OLC='rgba(8,6,14,.86)';
let vf=[];
function gv(y0,y1,c1,c2,c3){const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,c1);if(c3){q.addColorStop(.5,c2);q.addColorStop(1,c3);}else q.addColorStop(1,c2);return q;}
function gx(x0,x1,c1,c2,c3){const q=g.createLinearGradient(x0,0,x1,0);q.addColorStop(0,c1);if(c3){q.addColorStop(.5,c2);q.addColorStop(1,c3);}else q.addColorStop(1,c2);return q;}
function gr(x,y,r0,r1,c1,c2){const q=g.createRadialGradient(x,y,r0,x,y,r1);q.addColorStop(0,c1);q.addColorStop(1,c2);return q;}
function ca(c,a){if(c[0]!=='#')return c;return'rgba('+parseInt(c.slice(1,3),16)+','+parseInt(c.slice(3,5),16)+','+parseInt(c.slice(5,7),16)+','+a+')';}
function path(p){g.beginPath();for(let i=0;i<p.length;i++)i?g.lineTo(p[i][0],p[i][1]):g.moveTo(p[i][0],p[i][1]);}
function poly(p,f,l,lw){path(p);g.closePath();if(f){g.fillStyle=f;g.fill();}if(l){g.strokeStyle=l;g.lineWidth=lw||1.5;g.lineJoin='round';g.stroke();}}
function ell(x,y,rx,ry,f,l,lw,rot){g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot||0,0,TAU);if(f){g.fillStyle=f;g.fill();}if(l){g.strokeStyle=l;g.lineWidth=lw||1.5;g.stroke();}}
function circ(x,y,r,f,l,lw){ell(x,y,r,r,f,l,lw);}
function limb(x1,y1,x2,y2,w,c,ol){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=ol||OLC;g.lineWidth=w+2.4;g.stroke();g.strokeStyle=c;g.lineWidth=w;g.stroke();g.lineCap='butt';}
function limb2(x1,y1,x2,y2,x3,y3,w,c,ol){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.strokeStyle=ol||OLC;g.lineWidth=w+2.4;g.stroke();g.strokeStyle=c;g.lineWidth=w;g.stroke();g.lineCap='butt';}

  g.restore();}

      if(ti===3){for(let q=0;q<5;q++){const qx=px-rx*.6+wHs(S,q,5)*rx*1.2,qy=py-ry*.5+wHs(S,q,6)*ry;g.fillStyle='#4fae5e';g.beginPath();g.ellipse(qx,qy,5,3.4,0,.4,TAU-.4);g.lineTo(qx,qy);g.fill();if(q===1)dot(qx+1,qy-2,1.8,'#ffb8e0',1);}}

function bakeChunk(ci,cj,c){
  const P=WPAL[WD.ti],ti=WD.ti,x0=ci*CHS,y0=cj*CHS,x1=Math.min(N,x0+CHS),y1=Math.min(N,y0+CHS);
  g.fillStyle='#0a0810';g.fillRect(ci*CW,cj*CW,CW,CW);
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)if(map[j][i]===0)bakeFloor(i,j,P,ti);
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)if(map[j][i]===0)bakeDecal(i,j,P,ti,c);
  for(let ri=0;ri<rooms.length;ri++){const r=rooms[ri];if(r.x+r.w<=x0||r.x>=x1||r.y+r.h<=y0||r.y>=y1)continue;bakeRoom(r,ri,P,ti,c);}
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){if(map[j][i]!==1)continue;
    let nf=false;for(let b=-1;b<=1&&!nf;b++)for(let a=-1;a<=1;a++){if((a||b)&&!wIsW(i+a,j+b)){nf=true;break;}}
    if(!nf)continue;
    if(!wIsW(i,j+1))bakeFace(i,j,P,ti,c);else bakeTop(i,j,P,ti,c);}
  // Tropfen von der Decke
  for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++)if(map[j][i]===0&&wIsW(i,j-1)&&wHs(i,j,77)>.9&&ti!==2)c.an.push({t:'drip',x:i*T+T/2,y:j*T,ph:wHs(i,j,78)*3});
}
function chunkGet(ci,cj,noBake){
  if(ci<0||cj<0||ci>=CNX||cj>=CNX)return null;
  const key=cj*16+ci;let c=WD.ch.get(key);if(c||noBake)return c||null;
  const s=WD.s,cv=document.createElement('canvas');cv.width=cv.height=Math.ceil(CW*s);
  const cg=cv.getContext('2d');c={cv,an:[],to:[],ci,cj};WD.ch.set(key,c);
  const G0=g;g=cg;cg.setTransform(s,0,0,s,0,0);cg.translate(-ci*CW,-cj*CW);
  try{bakeChunk(ci,cj,c);}catch(e){if(!WD.err++)console.error('Karte:',e);}finally{g=G0;}
  return c;
}

  const pi=Math.floor(me.x/CW),pj=Math.floor(me.y/CW);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)chunkGet(pi+a,pj+b);

function wTorch(t,ti){
  const th=TH[ti],f=Math.sin(tm*11+t.p)*.5+.5,f2=Math.sin(tm*17+t.p*2.3)*.5+.5,x=t.x,y=t.y;
  g.fillStyle=th.fl[0];g.beginPath();g.moveTo(x-4.6,y+1);g.bezierCurveTo(x-6.4,y-6,x-1+f2*2,y-10-f*3,x+f2*1.6-.6,y-17-f*5);g.bezierCurveTo(x+1.4+f2*2,y-10-f*3,x+6.4,y-6,x+4.6,y+1);g.closePath();g.globalAlpha=.94;g.fill();
  g.fillStyle=th.fl[1];g.beginPath();g.moveTo(x-2.6,y+1);g.bezierCurveTo(x-3.6,y-4,x-.6+f2,y-7-f*2,x+f2*.8,y-11-f*3);g.bezierCurveTo(x+.8+f2,y-7-f*2,x+3.6,y-4,x+2.6,y+1);g.closePath();g.fill();
  g.fillStyle='#fffbe8';g.beginPath();g.ellipse(x,y-1.5,1.3,2.6,0,0,TAU);g.fill();g.globalAlpha=1;
  for(let k=0;k<2;k++){const u=(tm*.8+t.p*.37+k*.5)%1;g.fillStyle=th.fl[1];g.globalAlpha=(1-u)*.9;g.fillRect(x+Math.sin(u*9+k*3)*4-.6,y-9-u*26,1.4,1.4);}g.globalAlpha=1;
}
function wAnim(a,P,ti,pass){

    if(a.t==='pud'){const u=(tm*.6+a.ph)%1;g.strokeStyle='rgba(200,225,255,'+(.4*(1-u))+')';g.lineWidth=1;g.beginPath();g.ellipse(a.x,a.y,3+u*9,1.6+u*4.2,0,0,TAU);g.stroke();}
    else if(a.t==='drip'){const p2=(tm*.8+a.ph)%1.6;if(p2<.6){g.fillStyle='rgba(170,205,255,.85)';g.fillRect(a.x-1,a.y+2+p2*48,2,4);}else{const q2=p2-.6;g.strokeStyle='rgba(170,205,255,'+(.55-q2*.55)+')';g.lineWidth=1;g.beginPath();g.ellipse(a.x,a.y+32,q2*13,q2*4.6,0,0,TAU);g.stroke();}}
    else if(a.t==='bub'){for(let k=0;k<2;k++){const u=(tm*.45+a.ph+k*.5)%1,bx=a.x+Math.sin(a.ph*9+k*4)*8,by=a.y+Math.cos(a.ph*7+k*3)*3;g.strokeStyle='rgba(200,230,150,'+(.65*(1-u*u))+')';g.lineWidth=1;g.beginPath();g.arc(bx,by-u*3,1+u*3.2,0,TAU);g.stroke();if(u<.3){g.fillStyle='rgba(255,255,255,.5)';g.fillRect(bx-1,by-u*3-1.4,1.2,1.2);}}}
    else if(a.t==='cdl'){const f=Math.sin(tm*13+a.ph);g.fillStyle='#ffb84a';g.beginPath();g.ellipse(a.x,a.y-1.3,1.5,2.8+f*.7,0,0,TAU);g.fill();g.fillStyle='#fff6d0';g.beginPath();g.ellipse(a.x,a.y-.6,.7,1.4,0,0,TAU);g.fill();}
  }else{
    if(a.t==='glow'){const f=.78+.22*Math.sin(tm*3+a.ph),r=a.r*f,q=g.createRadialGradient(a.x,a.y,0,a.x,a.y,r);q.addColorStop(0,'rgba('+a.c+','+(a.a*f)+')');q.addColorStop(1,'rgba('+a.c+',0)');g.fillStyle=q;g.fillRect(a.x-r,a.y-r,r*2,r*2);}
    else if(a.t==='sig'){const f=.5+.5*Math.sin(tm*1.6+a.ph),r=a.r,q=g.createRadialGradient(a.x,a.y,r*.2,a.x,a.y,r*1.15);q.addColorStop(0,ca(P.ac,.0));q.addColorStop(.7,ca(P.ac,.05+.06*f));q.addColorStop(1,ca(P.ac,0));g.fillStyle=q;g.fillRect(a.x-r*1.2,a.y-r*1.2,r*2.4,r*2.4);
      g.strokeStyle=ca(P.ac,.22+.3*f);g.lineWidth=2;g.beginPath();g.arc(a.x,a.y,r,0,TAU);g.stroke();g.setLineDash([5,9]);g.lineDashOffset=-tm*22;g.strokeStyle=ca(P.ac,.3+.25*f);g.lineWidth=1.6;g.beginPath();g.arc(a.x,a.y,r*.86,0,TAU);g.stroke();g.setLineDash([]);}
    else if(a.t==='spk'){const u=(tm*.7+a.ph)%1;if(u<.3){const s=Math.sin(u/.3*Math.PI)*4.5;g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(a.x,a.y-s);g.lineTo(a.x+s*.22,a.y-s*.22);g.lineTo(a.x+s,a.y);g.lineTo(a.x+s*.22,a.y+s*.22);g.lineTo(a.x,a.y+s);g.lineTo(a.x-s*.22,a.y+s*.22);g.lineTo(a.x-s,a.y);g.lineTo(a.x-s*.22,a.y-s*.22);g.closePath();g.fill();}}

function drawWorld(cx,cy){

  const ci0=clamp(Math.floor(cx/CW),0,CNX-1),ci1=clamp(Math.floor((cx+W)/CW),0,CNX-1),cj0=clamp(Math.floor(cy/CW),0,CNX-1),cj1=clamp(Math.floor((cy+H)/CW),0,CNX-1);
  if(WD.ch.size>22){const pi=Math.floor(me.x/CW),pj=Math.floor(me.y/CW);for(const[k,c]of WD.ch){if(Math.abs(c.ci-pi)>2||Math.abs(c.cj-pj)>2){c.cv.width=c.cv.height=0;WD.ch.delete(k);}}}
  WD.bud=2;const vis=[];
  g.imageSmoothingEnabled=s!==D;
  for(let cj=cj0;cj<=cj1;cj++)for(let ci=ci0;ci<=ci1;ci++){let c=chunkGet(ci,cj,true);if(!c&&WD.bud>0){c=chunkGet(ci,cj);WD.bud--;}if(!c)continue;g.drawImage(c.cv,ci*CW,cj*CW,CW+ex,CW+ex);vis.push(c);}
  g.imageSmoothingEnabled=true;
  if(WD.bud>0){let done=0;for(let cj=cj0-1;cj<=cj1+1&&!done;cj++)for(let ci=ci0-1;ci<=ci1+1&&!done;ci++){if(ci<0||cj<0||ci>=CNX||cj>=CNX)continue;if(!chunkGet(ci,cj,true)){chunkGet(ci,cj);done=1;}}}
  const m=70,inV=a=>a.x>cx-m&&a.x<cx+W+m&&a.y>cy-m&&a.y<cy+H+m;
  for(const c of vis)for(const a of c.an)if(inV(a))wAnim(a,P,ti,0);
  for(const c of vis)for(const t of c.to)if(inV(t))wTorch(t,ti);
  if(cfg.glow){g.save();g.globalCompositeOperation='lighter';
    for(const c of vis){for(const t of c.to)if(inV(t)){const f=Math.sin(tm*11+t.p)*.5+.5;g.globalAlpha=.78+f*.22;g.drawImage(WD.GL[ti],t.x-110,t.y-100);}
      g.globalAlpha=1;for(const a of c.an)if(inV(a))wAnim(a,P,ti,1);}

}

// ---------- Drops: nie in Wänden, nächster Gegenstand gewinnt ----------
function dropFix(i){
  if(!hit(i.x,i.y,6))return;
  const x0=i.x,y0=i.y;
  for(let r=6;r<=140;r+=6){let bx=0,by=0,bd=1e9;
    for(let k=0;k<24;k++){const a=k/24*TAU+r*.37,cx=x0+Math.cos(a)*r,cy=y0+Math.sin(a)*r;if(!hit(cx,cy,6)){const d=Math.hypot(cx-me.x,cy-me.y);if(d<bd){bd=d;bx=cx;by=cy;}}}
    if(bd<1e9){i.x=bx;i.y=by;return;}}
  i.x=me.x;i.y=me.y;
}
function nearAny(){let b=null,bd=42;for(const i of it){if(i.d||(i.t!=='weapon'&&i.t!=='armor'))continue;const d=Math.hypot(i.x-me.x,i.y-me.y);if(d<bd){bd=d;b=i;}}return b;}

// ===== FIXES: Sichtlinie, Spawn-Positionen, Ausrüstung =====
// Sichtlinie: true, wenn zwischen den Punkten keine Wand liegt (Schritt 8px, Endpunkte inklusive)
function los(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/8));for(let i=0;i<=n;i++){if(wall(x0+dx*i/n,y0+dy*i/n))return false;}return true;}
// Nächste freie Stelle (Radius r frei von Wänden). Mit (sx,sy): zusätzlich Sichtlinie zur Quelle.
function freeNear(x,y,r,sx,sy){
  const okp=(a,b)=>!hit(a,b,r)&&(sx==null||los(sx,sy,a,b));
  if(okp(x,y))return{x,y};
  for(let rad=8;rad<=200;rad+=8){for(let k=0;k<16;k++){const a=k/16*TAU+rad*.61,cx=x+Math.cos(a)*rad,cy=y+Math.sin(a)*rad;if(okp(cx,cy))return{x:cx,y:cy};}}
  if(sx!=null&&!hit(sx,sy,r))return{x:sx,y:sy};
  return{x,y};
}
// Boss-Helfer: erscheinen immer frei und in Sichtlinie zum Boss
function mkEn(s,k,x,y){const p=freeNear(x,y,11,s.x,s.y);return mkE(k,p.x,p.y);}
